<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07070d">
<title>Night City Legend</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070d; --bg2:#0e0e1a; --panel:#13132299; --line:#2a2a44;
  --y:#fcee0a; --c:#00f0ff; --m:#ff2a6d; --g:#05ffa1; --o:#ff9f1c; --t:#e8e8f4; --dim:#8a8aa8;
  --hp:#ff2a6d; --hum:#05ffa1; --cred:#fcee0a; --ed:#00f0ff;
  font-family:'Rajdhani','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t);overflow:hidden}
body{font-size:17px;line-height:1.3;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#root{position:fixed;inset:0;display:flex;justify-content:center;
  background:radial-gradient(ellipse at 50% -10%,#1a0a2e 0%,transparent 60%),radial-gradient(ellipse at 100% 100%,#00303a55 0%,transparent 55%),var(--bg)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
#vig{position:fixed;inset:0;pointer-events:none;z-index:49;box-shadow:inset 0 0 120px rgba(0,0,0,.8)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:0}
.screen{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;position:relative;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.mono{font-family:'Share Tech Mono',ui-monospace,monospace}
.hd{font-family:'Orbitron','Rajdhani',sans-serif;letter-spacing:.08em;text-transform:uppercase}

/* ---------- glitch ---------- */
.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;inset:0;overflow:hidden}
.glitch::before{color:var(--m);transform:translate(-2px,0);clip-path:inset(0 0 55% 0);animation:gl1 2.8s infinite steps(1)}
.glitch::after{color:var(--c);transform:translate(2px,0);clip-path:inset(55% 0 0 0);animation:gl2 3.3s infinite steps(1)}
@keyframes gl1{0%,90%,100%{transform:translate(0)}92%{transform:translate(-4px,1px)}95%{transform:translate(3px,-1px)}}
@keyframes gl2{0%,86%,100%{transform:translate(0)}88%{transform:translate(4px,-1px)}93%{transform:translate(-3px,1px)}}

/* ---------- title ---------- */
.title{align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
.title h1{font-size:clamp(40px,12vw,70px);margin:0;line-height:.95;color:var(--y);text-shadow:0 0 18px #fcee0a88}
.title h1 small{display:block;font-size:.32em;color:var(--c);letter-spacing:.5em;text-shadow:0 0 12px #00f0ff88;margin-bottom:6px}
.title p{color:var(--dim);margin:0 0 6px;max-width:420px}
.skyline{position:absolute;left:0;right:0;bottom:0;height:42%;opacity:.55;z-index:-1;pointer-events:none}
.btn{position:relative;display:block;width:100%;padding:14px 18px;text-align:left;border:1px solid var(--line);background:linear-gradient(180deg,#171728,#0f0f1c);
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));transition:transform .12s,border-color .15s,background .15s,filter .15s;overflow:hidden}
.btn:hover,.btn:focus-visible{border-color:var(--c);filter:brightness(1.25);outline:none}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,#fcee0a,#d8cb00);color:#111;font-weight:700;border-color:var(--y);text-align:center;text-transform:uppercase;letter-spacing:.12em}
.btn.pri:hover{filter:brightness(1.1)}
.btn[disabled],.btn.lock{opacity:.4;pointer-events:none;filter:grayscale(.8)}
.btn .rip{position:absolute;border-radius:50%;background:#fff5;transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.row{display:flex;gap:10px;width:100%;max-width:420px}
.stack{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px}

/* ---------- creation ---------- */
.create{padding:18px 16px;overflow:auto;gap:14px}
.create h2{margin:0;color:var(--y);font-size:22px}
.create .sub{color:var(--dim);margin-top:-8px}
.opt .t{font-weight:700;font-size:18px;color:var(--c)}
.opt .d{color:var(--dim);font-size:15px;margin-top:2px}
.opt.sel{border-color:var(--y);background:linear-gradient(180deg,#26240a,#14140a)}
.opt.sel .t{color:var(--y)}
input.txt{width:100%;padding:12px 14px;background:#0c0c18;border:1px solid var(--line);color:var(--t);font:inherit;font-size:20px;outline:none;user-select:text;-webkit-user-select:text}
input.txt:focus{border-color:var(--c);box-shadow:0 0 12px #00f0ff44}
.attrrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #1b1b30}
.attrrow .nm{flex:1}.attrrow .nm b{display:block;color:var(--c);letter-spacing:.1em}.attrrow .nm i{font-style:normal;color:var(--dim);font-size:13px}
.pips{display:flex;gap:3px}.pip{width:10px;height:16px;background:#1d1d33;transform:skewX(-14deg)}.pip.on{background:var(--y);box-shadow:0 0 6px #fcee0a99}.pip.bonus{background:var(--g)}
.pm{width:38px;height:38px;border:1px solid var(--line);display:grid;place-items:center;font-size:22px;background:#12121f}
.pm:active{transform:scale(.9);border-color:var(--y)}

/* ---------- game ---------- */
.hud{padding:10px 12px 6px;display:flex;flex-direction:column;gap:6px;z-index:5}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.meter{position:relative;padding:4px 6px 6px;background:#0d0d19cc;border:1px solid var(--line);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}
.meter .lb{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.meter .lb b{font-size:15px;letter-spacing:0;color:var(--t)}
.bar{height:6px;background:#1b1b30;margin-top:3px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;transition:width .6s cubic-bezier(.2,.9,.2,1)}
.m-hp i{background:var(--hp);box-shadow:0 0 8px var(--hp)}.m-hum i{background:var(--hum);box-shadow:0 0 8px var(--hum)}.m-cred i{background:var(--cred);box-shadow:0 0 8px var(--cred)}
.m-ed .lb b{color:var(--ed)}
.m-ed .bar i{background:var(--ed);box-shadow:0 0 8px var(--ed)}
.meter .dot{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--t);opacity:0;transform:scale(0);transition:.2s}
.meter.pv .dot{opacity:1;transform:scale(1);box-shadow:0 0 8px #fff}
.meter.pv.big .dot{width:12px;height:12px}
.meter.warn{animation:warn 1s infinite}
@keyframes warn{50%{border-color:var(--m);box-shadow:0 0 14px #ff2a6d88}}
.meter.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.12)}}
.sub-hud{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim);letter-spacing:.08em}
.sub-hud .role{color:var(--y);text-transform:uppercase}
.float{position:fixed;z-index:70;font-weight:700;font-size:22px;pointer-events:none;text-shadow:0 0 10px currentColor,0 2px 0 #000;animation:flt 1.3s ease-out forwards}
@keyframes flt{from{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-8px) scale(1.15)}to{transform:translateY(-70px) scale(1);opacity:0}}

.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:4px 14px 0;position:relative;perspective:900px}
.speaker{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:6px;min-height:46px}
.portrait{width:52px;height:52px;flex:none;border:1px solid var(--c);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));background:#0b0b16;animation:pin .5s}
@keyframes pin{from{transform:scale(.6) rotate(-8deg);opacity:0}}
.speaker .nm{font-weight:700;font-size:20px;line-height:1}
.speaker .rl{color:var(--dim);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.cardwrap{width:100%;flex:1;min-height:0;position:relative;display:flex;align-items:stretch}
.card{position:relative;width:100%;touch-action:pan-y;display:flex;flex-direction:column;justify-content:center;padding:20px 18px;
  background:linear-gradient(160deg,#181830ee,#0d0d1cee);border:1px solid var(--line);
  clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px));
  box-shadow:0 0 40px #00000088;overflow:auto;animation:cin .45s cubic-bezier(.2,.9,.25,1.1);will-change:transform}
.card::before{content:'';position:absolute;left:0;top:0;width:4px;height:100%;background:var(--ac,var(--y));box-shadow:0 0 14px var(--ac,var(--y))}
.card .tag{font-size:12px;letter-spacing:.2em;color:var(--ac,var(--y));text-transform:uppercase;margin-bottom:8px}
.card .tx{font-size:19.5px;line-height:1.38}
.card .tx em{color:var(--c);font-style:normal}.card .tx strong{color:var(--y)}
.card.out{animation:cout .35s forwards}
@keyframes cin{from{opacity:0;transform:translateY(40px) rotateX(18deg) scale(.94)}}
@keyframes cout{to{opacity:0;transform:translateX(var(--ox,0)) rotate(var(--or,0)) scale(.9)}}
.swipelb{position:absolute;top:14px;max-width:48%;padding:6px 10px;background:#000c;border:1px solid var(--y);color:var(--y);font-weight:700;opacity:0;pointer-events:none;font-size:15px}
.swipelb.l{left:12px}.swipelb.r{right:12px;text-align:right}
.hint{font-size:12px;color:var(--dim);text-align:center;margin-top:4px;letter-spacing:.12em;min-height:16px}
.choices{display:flex;flex-direction:column;gap:8px;padding:8px 14px 8px;z-index:5}
.choice{display:flex;align-items:center;gap:10px;padding:11px 14px 11px 12px;animation:chin .4s both}
.choice:nth-child(2){animation-delay:.06s}.choice:nth-child(3){animation-delay:.12s}.choice:nth-child(4){animation-delay:.18s}
@keyframes chin{from{opacity:0;transform:translateY(16px)}}
.choice .k{width:24px;height:24px;flex:none;border:1px solid var(--dim);color:var(--dim);display:grid;place-items:center;font-size:13px}
.choice .tt{flex:1}.choice .tt b{display:block;font-weight:600;font-size:17px}.choice .tt small{color:var(--dim);font-size:13px}
.choice .bd{flex:none;font-size:13px;padding:2px 7px;border:1px solid var(--c);color:var(--c);font-weight:700}
.choice .bd.hi{border-color:var(--g);color:var(--g)}.choice .bd.lo{border-color:var(--m);color:var(--m)}
.choice.lock .tt small{color:var(--m)}
.dock{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px 8px 8px;border-top:1px solid var(--line);background:#0a0a14ee;z-index:5}
.dock button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);transition:.15s}
.dock button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.dock button:hover,.dock button:active{color:var(--y);transform:translateY(-2px)}
.dock button.alert{color:var(--m);animation:warn 1s infinite}

/* result */
.result{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:20px 18px;background:linear-gradient(160deg,#181830f5,#0d0d1cf5);border:1px solid var(--line);
  clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px));animation:cin .35s;overflow:auto;cursor:pointer}
.result .rt{font-size:19px;line-height:1.38}
.dice{display:flex;align-items:center;gap:14px}
.die{width:64px;height:64px;display:grid;place-items:center;font-size:30px;font-weight:700;font-family:'Orbitron',sans-serif;border:2px solid var(--c);color:var(--c);transform:rotate(45deg)}
.die span{transform:rotate(-45deg)}
.die.roll{animation:roll .12s infinite}
@keyframes roll{50%{transform:rotate(60deg) scale(.92)}}
.die.ok{border-color:var(--g);color:var(--g);box-shadow:0 0 22px #05ffa188}
.die.ko{border-color:var(--m);color:var(--m);box-shadow:0 0 22px #ff2a6d88}
.dice .info{font-size:14px;color:var(--dim)}.dice .info b{display:block;font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 9px;border:1px solid currentColor;font-weight:700;font-size:15px;animation:chp .4s both}
@keyframes chp{from{opacity:0;transform:scale(.4)}}
.chip.p{color:var(--g)}.chip.n{color:var(--m)}.chip.i{color:var(--c)}.chip.y{color:var(--y)}
.cont{color:var(--dim);text-align:center;font-size:13px;letter-spacing:.2em;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}

/* modal */
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:#000a;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:88%;display:flex;flex-direction:column;background:linear-gradient(180deg,#14142a,#0a0a14);border:1px solid var(--c);border-bottom:0;
  clip-path:polygon(0 18px,18px 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%);animation:up .3s cubic-bezier(.2,.9,.2,1)}
@keyframes up{from{transform:translateY(60%);opacity:0}}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.sheet header h3{margin:0;color:var(--y);font-size:19px}
.sheet .x{width:36px;height:36px;border:1px solid var(--line);font-size:20px}
.sheet .body{overflow:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:10px}
.sec{color:var(--c);font-size:12px;letter-spacing:.22em;text-transform:uppercase;margin-top:6px}
.item{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);background:#0f0f1d;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.item .in{flex:1}.item .in b{display:block}.item .in small{color:var(--dim);font-size:13px;display:block}
.item .pr{font-weight:700;color:var(--ed);white-space:nowrap}.item .pr.no{color:var(--m)}
.item.own{border-color:var(--g)}
.tagx{display:inline-block;font-size:11px;padding:0 6px;border:1px solid var(--m);color:var(--m);margin-right:4px}
.tagx.g{border-color:var(--g);color:var(--g)}.tagx.y{border-color:var(--y);color:var(--y)}.tagx.c{border-color:var(--c);color:var(--c)}
.map{width:100%;background:#080812;border:1px solid var(--line)}
.map rect{stroke:#000;stroke-width:1.5;cursor:pointer;transition:filter .2s,opacity .2s}
.map rect:hover{filter:brightness(1.5)}
.map text{font-size:8.5px;fill:#fff;pointer-events:none;font-weight:700;text-shadow:0 1px 2px #000}
.map .ward{font-size:9px;fill:#ffffff55;letter-spacing:.3em}
.leg{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:12px;color:var(--dim)}.leg i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:middle}
.bigbar{height:10px;background:#1b1b30;position:relative}.bigbar i{position:absolute;inset:0 auto 0 0}
.log{font-size:14px;color:#b9b9d6;padding:6px 0;border-bottom:1px dashed #23233a}.log b{color:var(--y);margin-right:6px}

/* end */
.end{padding:22px 18px;overflow:auto;align-items:center;gap:12px;text-align:center}
.end h1{margin:6px 0 0;font-size:34px;line-height:1}
.end .ep{color:var(--dim);font-style:italic;max-width:420px}
.score{font-family:'Orbitron',sans-serif;font-size:56px;color:var(--y);text-shadow:0 0 22px #fcee0a88}
.brk{width:100%;max-width:420px;text-align:left}
.brk div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #1b1b30;font-size:16px}
.brk div b{color:var(--c)}
.newbest{color:var(--g);letter-spacing:.3em;animation:blink 1s infinite}

/* states */
.lowhum .stage,.lowhum .hud{animation:jit 3s infinite steps(1)}
@keyframes jit{0%,93%,100%{transform:none;filter:none}94%{transform:translateX(-3px);filter:hue-rotate(90deg)}96%{transform:translateX(3px) skewX(2deg);filter:saturate(2)}98%{transform:none}}
.shake{animation:shk .45s}
@keyframes shk{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,2px)}}
.toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);z-index:90;padding:10px 18px;background:#000d;border:1px solid var(--y);color:var(--y);font-weight:700;letter-spacing:.1em;text-transform:uppercase;animation:toast 2.6s forwards;text-align:center;max-width:90%}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media (min-width:700px){.screen{border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 80px #00f0ff10}}
@media (max-height:700px){.card .tx{font-size:17.5px}.choice{padding:8px 12px}.portrait{width:42px;height:42px}.speaker{min-height:38px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}

/* ---- UX v2 ---- */
.blocs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bloc{padding:0;text-align:left;font-size:9.5px;letter-spacing:.14em;color:var(--dim);position:relative}
.bloc .bb{height:4px;margin-top:2px;background:linear-gradient(90deg,#ff2a6d55,#ffffff12 25%,#ffffff12 75%,#ff2a6d55);position:relative}
.bloc .bb::after{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#ffffff55}
.bloc .bb i{position:absolute;top:-3px;width:8px;height:10px;margin-left:-4px;transform:skewX(-14deg);transition:left .6s cubic-bezier(.2,.9,.2,1);box-shadow:0 0 8px currentColor}
.bloc.dg{color:var(--m);animation:warn 1s infinite}
.bloc.pv span{color:#fff;text-shadow:0 0 8px #fff}.bloc.pv::after{content:'';position:absolute;right:0;top:0;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff}
.sheet.full{max-height:96%;height:96%}
.sheet header .bk{margin-right:10px;font-size:26px;line-height:1}
.sheet header h3{flex:1}
.sticky{position:sticky;top:-4px;z-index:3;background:#10102a;padding:6px 0 8px;margin:0 -4px;display:flex;flex-direction:column;gap:8px}
.vstat{display:flex;gap:14px;align-items:center;padding:8px 12px;background:#0c0c1a;border:1px solid var(--line);font-weight:700}
.vstat b{margin-left:auto}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tiles.one{grid-template-columns:1fr}.tiles.three{grid-template-columns:repeat(3,1fr)}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;text-align:left;border:1px solid var(--line);background:linear-gradient(180deg,#191934,#10101f);
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);transition:transform .12s,border-color .15s,filter .15s;min-height:92px}
.tile:hover{border-color:var(--c);filter:brightness(1.2)}.tile:active{transform:scale(.96)}
.tile .ti{font-size:26px;line-height:1}.tile b{font-size:17px;margin-top:4px}.tile small{color:var(--dim);font-size:12.5px;line-height:1.2}
.tile[disabled]{opacity:.35;pointer-events:none}
.tile.rec{border-color:var(--g);box-shadow:0 0 16px #05ffa133}.tile em{position:absolute;top:8px;right:14px;font-size:10px;font-style:normal;color:var(--g);letter-spacing:.12em;text-transform:uppercase}
.tiles.three .tile{min-height:104px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.fchips.wrap{flex-wrap:wrap;overflow:visible}
.fchips::-webkit-scrollbar{display:none}
.fc{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;font-size:13px;color:var(--dim);background:#0f0f1d;display:inline-flex;align-items:center;gap:6px}
.fc i{width:9px;height:9px;border-radius:50%;display:inline-block}.fc.on{background:var(--y);color:#111;border-color:var(--y);font-weight:700}
.buy{flex:none;padding:9px 14px;font-weight:700;border:1px solid var(--g);color:var(--g);background:#05ffa114;white-space:nowrap;transition:.12s}
.buy:active{transform:scale(.94)}.buy.no{border-color:var(--line);color:var(--dim);background:none}
.own-t{color:var(--g);font-size:12px;letter-spacing:.12em}
.mappanel{position:sticky;bottom:-20px;z-index:3;background:#10102a;padding:8px 0 12px;display:flex;flex-direction:column;gap:8px}

.map g:hover rect{filter:brightness(1.4)}

card({id:`viktor_deal`,who:`vik`,tag:`Clinique de Vik · Little China`,w:4,once:true,cond:()=>G.cred>=4,
  tx:`« Tu as une tête de gamin qui s'est déjà fait casser. Je fais des prix pour ceux qui reviennent vivants. Mais pas d'imprudence : le chrome, ça se paie… en humanité. »`,
  ch:[
    {t:`Accepter la tarification Vik`,s:`−15 % chez les ripperdocs`,fx:{flag:[`vik`],rel:{vik:12},cred:2,hum:2,msg:`« Passe quand tu veux. Et ne triche pas avec ton corps. »`}},
    {t:`Faire réparer un vieux souvenir`,s:`Soin gratuit +25`,fx:{hp:25,hum:3,flag:[`vik`],rel:{vik:14},msg:`Il recoud ton épaule en silence. « Prends soin de toi. »`}}
  ]});
card({id:`misty_reading`,who:`misty`,tag:`Esoterica · Tarot`,w:4,
  tx:`Une boutique de cristaux, d'encens et de cartes. Misty bat son jeu : « La Mort n'est jamais loin, mais ce n'est pas toujours une fin. Veux-tu que je lise ton avenir ? »`,
  ch:[
    {t:`Tirer les cartes`,s:`−100 €$ · Humanité +`,req:R.ed(100),fx:{ed:-100,hum:12,rel:{misty:12},msg:`Un moment étrange de paix. « Tu as encore de la lumière en toi, » dit-elle.`}},
    {t:`Discuter autour d'un thé`,s:`+Humanité`,fx:{hum:7,cred:1,rel:{misty:8},msg:`Elle te raconte son enfance à Night City. Tu repars apaisé(e).`}},
    {t:`Passer ton chemin`,fx:{}}
  ]});
card({id:`fingers_deal`,who:`fingers`,tag:`Ripperdoc · Discount`,w:3,cond:()=>G.cred>=10&&!hasDeckBlock(),
  tx:`Une clinique louche, des seringues à moitié vides. Fingers t'accueille avec un sourire tordu. « Un implant bon marché ? Je te fais une réduction de moitié. Quand ça marche, c'est comme neuf. Quand ça rate… eh bien, je n'ai jamais perdu de patient, jamais. »`,
  ch:[
    {t:`Tenter l'opération pas chère`,s:`Pari risqué`,chk:{a:`cool`,dc:6,ok:{hum:-3,ed:-200,at:{ref:1},msg:`Ça brûle, mais c'est fait. Une fine couche de chrome te donne des réflexes affûtés.`},ko:{hp:-30,hum:-8,ed:-200,msg:`Quelque chose a mal tourné. Tu t'évanouis, tu te réveilles avec un tremblement permanent.`}}},
    {t:`Décliner poliment`,fx:{}}
  ]});
function hasDeckBlock(){return false}
card({id:`delamain`,who:`delamain`,tag:`Taxi Delamain`,w:3,cond:()=>G.ed>=100&&!G.flags.delamain,
  tx:`« Bonsoir. Je suis Delamain, votre chauffeur intelligent. La sécurité de votre voyage est ma priorité absolue. Votre destination ? » Une voix polie, presque trop humaine pour une IA de taxi.`,
  ch:[
    {t:`Discuter avec l'IA`,s:`+Humanité`,fx:{hum:4,flag:[`delamain`],rel:{delamain:12},ed:-40,msg:`Delamain philosophe sur la solitude des flottes autonomes. Il te dépose avec un « À très bientôt ».`}},
    {t:`Lui demander de rouler vite`,s:`−60 €$`,fx:{ed:-60,cred:1,msg:`Il ralentit finalement : « Pour votre sécurité, je maintiens la limite. »`}},
    {t:`Descendre`,fx:{}}
  ]});
card({id:`trauma_sub`,who:`doc`,tag:`Trauma Team`,w:4,once:true,cond:()=>G.ed>=1500&&G.cred>=8,
  tx:`Un représentant de <em>Trauma Team International</em> t'aborde : « Un abonnement Platinum, et si vous tombez, une équipe blindée vous récupère en hélico. Pas de fusillade qui tienne. <strong>1 200 €$</strong>. »`,
  ch:[
    {t:`Souscrire à l'abonnement`,s:`Une seconde chance en cas de mort`,req:R.ed(1200),fx:{ed:-1200,flag:[`trauma`],msg:`Contrat signé. Tu portes maintenant une puce de géolocalisation médicale.`}},
    {t:`Refuser, je compte sur mes réflexes`,fx:{cred:1}}
  ]});
card({id:`mox_club`,who:`lizzie`,tag:`Lizzie's Bar · Kabuki`,w:4,
  tx:`Néons roses et basses profondes. Lizzie t'accueille au club : « Ici, on s'entraide, on se protège, et personne n'aime les profiteurs. Tu bois, tu danses… ou tu veux nous aider pour un souci ? »`,
  ch:[
    {t:`Danser jusqu'à l'aube`,s:`+Humanité`,fx:{hum:9,ed:-80,msg:`Les basses font vibrer ton implant. Pendant une heure, tu oublies la ville.`}},
    {t:`Proposer ton aide`,s:`SANG-FROID`,chk:{a:`cool`,dc:6,ok:{cred:5,fac:{mox:10},hum:3,msg:`Tu règles un souci de harcèlement avec tact. Lizzie te serre dans ses bras.`},ko:{cred:1,fac:{mox:2},msg:`Tu fais une gaffe. Mais l'intention compte.`}}},
    {t:`Repartir`,fx:{}}
  ]});
card({id:`maelstrom_raid`,who:`royce`,tag:`Maelstrom`,w:3,cond:()=>G.cred>=10&&!G.member,
  tx:`Une camionnette tourne au coin d'un entrepôt de Northside. Des hommes bardés de chrome ricanent : « Hé, toi. Viens voir. On fait une petite fête, tu as de l'argent, du chrome ou de la rage ? »`,
  ch:[
    {t:`Entrer dans la danse`,s:`Rejoindre le chaos`,fx:{hum:-10,cred:4,ed:600,fac:{maelstrom:12},role:{solo:1},msg:`Cris, étincelles, lames. Le chrome est une drogue qui chante.`}},
    {t:`Sortir en courant`,s:`RÉFLEXES`,chk:{a:`ref`,dc:6,ok:{hum:1,msg:`Tu échappes au piège de justesse.`},ko:{hp:-15,ed:-100,msg:`Ils te rattrapent, te fouillent, te laissent dans le caniveau.`}}}
  ]});
card({id:`barfight`,who:`narr`,tag:`Afterlife · Bagarre`,w:4,
  tx:`Un mercenaire ivre te bouscule. « Tu regardes quoi ? » Tout le bar s'est tu. Sous les néons, un cercle de curieux se forme.`,
  ch:[
    {t:`Le défier au poing`,s:`CORPS`,chk:{a:`body`,dc:6,ok:{cred:4,ed:150,msg:`Un coup, deux coups, il s'effondre. Les mercs te saluent d'un hochement de tête.`},ko:{hp:-18,cred:-1,msg:`Il frappe plus fort que prévu. Tu sors du bar avec un œil au beurre noir.`}}},
    {t:`Désamorcer avec une blague`,s:`SANG-FROID`,chk:{a:`cool`,dc:6,ok:{cred:3,hum:2,msg:`Tout le bar rit. Il te paie un verre. Tu viens de gagner un allié.`},ko:{cred:-2,msg:`Personne ne rit. Il t'écarte d'un coup d'épaule.`}}},
    {t:`Partir sans bruit`,fx:{}}
  ]});
card({id:`race`,who:`regina`,tag:`Course illégale`,w:3,cond:()=>skill(`drv`)>=1||A(`ref`)>=7,
  tx:`Une course sur la route des Badlands, mise : <strong>1 500 €$</strong>. Les gagnants repartent avec le tout, les perdants avec les dents cassées.`,
  ch:[
    {t:`Participer`,s:`RÉFLEXES · conduite`,chk:{a:`ref`,k:`drv`,dc:8,ok:{ed:3000,cred:7,msg:`Tu coupes la ligne en premier, hurlant de joie. La route est à toi.`},ko:{hp:-28,ed:-400,cred:-1,msg:`Dérapage dans un virage. Tu finis dans un fossé, la voiture en feu.`}}},
    {t:`Parier sur un autre`,s:`−300 €$`,req:R.ed(300),chk:{a:`cool`,dc:5,ok:{ed:600,msg:`Ton favori gagne. Les gains te rendent le sourire.`},ko:{ed:-300,msg:`Tu perds tout. Le favori a crevé à mi-course.`}}},
    {t:`Regarder depuis le bord`,fx:{hum:2}}
  ]});
card({id:`scavs`,who:`scav`,tag:`Scavs`,w:3,
  tx:`Des charognards fouillent un corps au bord de la route : bistouris, glacière, seringues. Un enfant te regarde, immobile, au milieu de leur camionnette. Les Scavs revendent les organes aux ripperdocs sans scrupule.`,
  ch:[
    {t:`Les attaquer pour libérer l'enfant`,s:`CORPS · combat`,chk:{a:`body`,k:`cmb`,dc:8,ok:{cred:8,hum:10,ed:200,msg:`Tu les mets en déroute. L'enfant te murmure un merci que tu n'oublieras jamais.`},ko:{hp:-32,cred:1,hum:3,msg:`Ils te frappent à terre mais l'enfant s'enfuit grâce à toi.`}}},
    {t:`Fermer les yeux et partir`,s:`−Humanité`,fx:{hum:-9,msg:`Tu marches sans te retourner. Mais l'image ne te quittera plus.`}},
    {t:`Les payer pour qu'ils le relâchent`,s:`−500 €$`,req:R.ed(500),fx:{ed:-500,hum:7,cred:2,msg:`Pour eux, un enfant est une marchandise. Pour toi, une dette réglée.`}}
  ]});
card({id:`malfunction`,who:`narr`,tag:`Panne de chrome`,w:4,cond:()=>G.cyber.length>=1,
  tx:`Ton implant se bloque en pleine rue. Un grésillement sous la peau, une douleur électrique dans la nuque. Les cyberwares cheap sont souvent fragiles.`,
  ch:[
    {t:`Courir chez un ripperdoc`,s:`−250 €$`,req:R.ed(250),fx:{ed:-250,hp:15,msg:`Quelques coups de tournevis, un recalibrage, et tout redémarre.`}},
    {t:`Le réparer toi-même`,s:`TECHNIQUE`,chk:{a:`tech`,dc:6,ok:{at:{tech:1},msg:`Un fil ici, une soudure là. Tu comprends mieux ton propre corps.`},ko:{hp:-22,hum:-4,msg:`Mauvaise connexion. Tu pleures de douleur un long moment.`}}},
    {t:`Serrer les dents`,s:`CORPS`,chk:{a:`body`,dc:5,ok:{cred:1,msg:`Ça passe. À force d'insister, tu te sens presque invincible.`},ko:{hp:-16,hum:-3,msg:`La douleur persiste des heures.`}}}
  ]});
card({id:`ncpd_sting`,who:`ncpd`,tag:`NCPD · Contrôle`,w:3,cond:()=>G.cred>=10&&G.member!==`ncpd`,
  tx:`Une patrouille NCPD te coince : « Papiers. Ces implants, ils sont déclarés ? » Dans le monde de Night City, la police a ses prix et tu le sais.`,
  ch:[
    {t:`Graisser la patte`,s:`−400 €$`,req:R.ed(400),fx:{ed:-400,bloc:{loi:-5},msg:`« Bonne soirée, citoyen. » Sans bruit, ils s'effacent.`}},
    {t:`Argumenter`,s:`SANG-FROID`,chk:{a:`cool`,dc:7,ok:{cred:2,msg:`Tu connais tes droits. Les agents hésitent et te laissent partir.`},ko:{hp:-12,ed:-150,cred:-1,msg:`Ils n'aiment pas les petits malins. Tu passes la nuit en cellule.`}}},
    {t:`Fuir`,s:`RÉFLEXES`,chk:{a:`ref`,dc:7,ok:{cred:2,msg:`Tu files dans un cul-de-sac, escalades, disparais.`},ko:{hp:-20,ed:-200,msg:`Un taser dans le dos. Ça fait mal.`}}}
  ]});
card({id:`partner`,who:`lover`,tag:`Rencontre`,w:3,once:true,cond:()=>G.age>=22&&G.hum>=40,
  tx:`Au détour d'un noodle stand sous la pluie, quelqu'un te prête son parapluie. Un sourire fatigué, un regard sans fard, une conversation sans mensonge. Dans cette ville, c'est rare.`,
  ch:[
    {t:`Passer la soirée ensemble`,s:`+Humanité · Lien`,fx:{hum:14,ed:-60,flag:[`partner`],msg:`Vous parlez pendant des heures. Pour la première fois depuis longtemps, tu ris sans arrière-pensée.`}},
    {t:`Poursuivre ta route`,s:`Rester seul(e)`,fx:{cred:1,msg:`Tu salues d'un geste vague. Tu ne reverras peut-être jamais cette personne.`}}
  ]});
card({id:`old_friend`,who:`fix`,tag:`Un vieil ami`,w:3,cond:()=>G.age>=24,
  tx:`Un ami d'enfance te rattrape, couvert de dettes. « Je suis dans la merde. 1 500 balles, ou les gars me coupent un doigt. T'es la seule personne en qui j'ai confiance. »`,
  ch:[
    {t:`Lui donner l'argent`,s:`−1 500 €$`,req:R.ed(1500),fx:{ed:-1500,hum:10,cred:2,msg:`Il pleure presque de gratitude. Cet argent te reviendra peut-être un jour.`}},
    {t:`Régler ses dettes à ta façon`,s:`CORPS · combat`,chk:{a:`body`,k:`cmb`,dc:7,ok:{cred:6,hum:5,msg:`Tu discutes avec ses créanciers. Ils comprennent vite.`},ko:{hp:-25,msg:`Trop nombreux. Il est quand même sauvé, mais tu paies de ta peau.`}}},
    {t:`L'abandonner`,s:`−Humanité`,fx:{hum:-9,msg:`Tu détournes le regard. Il n'a plus de mots. Toi non plus.`}}
  ]});
card({id:`jackie`,who:`jackie`,tag:`El Coyote Cojo`,w:4,cond:()=>yr()>=2072&&yr()<=2076,
  tx:`Un grand gaillard rieur t'attrape par l'épaule : « Jackie Welles ! Heywood, quoi ! Tu viens manger chez ma mère ? Elle fait le meilleur mole du quartier. » Dans son sourire, il n'y a rien de faux.`,
  ch:[
    {t:`Dîner chez Mama Welles`,s:`+Humanité`,fx:{hum:10,ed:-40,fac:{valentinos:4},flag:[`jackie`],rel:{jackie:12,mama:8},msg:`Mama Welles remplit ton assiette, te demande si tu manges assez. Tu te sens chez toi.`}},
    {t:`Boire un verre avec lui`,fx:{hum:5,cred:2,rel:{jackie:8},msg:`Un bar enfumé, des histoires de braquages ratés. Jackie rêve d'un grand coup, d'une vie meilleure.`}},
    {t:`Décliner`,fx:{}}
  ]});
card({id:`sasquatch`,who:`sas`,tag:`Rancho Coronado · Combat`,w:3,cond:()=>A(`body`)>=5,
  tx:`Les Animals t'invitent à leur salle de sport clandestine. Un combat à mains nues : <strong>2 000 €$</strong> au vainqueur. Sasquatch observe, impassible, les bras croisés.`,
  ch:[
    {t:`Monter sur le ring`,s:`CORPS`,chk:{a:`body`,dc:8,ok:{ed:2000,cred:6,fac:{animals:10},msg:`Un crochet à la mâchoire, le géant s'écroule. La salle explose. Sasquatch hoche la tête.`},ko:{hp:-30,cred:1,msg:`Tu te fais broyer. Mais tu as tenu trois rounds : respect.`}}},
    {t:`Observer`,fx:{}}
  ]});
card({id:`kerry_concert`,who:`kerry`,tag:`Concert de Kerry Eurodyne`,w:3,cond:()=>yr()>=2072,
  tx:`Kerry Eurodyne remplit une salle de Westbrook. Entre deux accords, il crie : « Samurai, c'était nous ! Ne laissons personne décider de nos vies ! » Le public hurle. Quelqu'un te tend un pass backstage.`,
  ch:[
    {t:`Aller backstage`,s:`SANG-FROID`,chk:{a:`cool`,dc:7,ok:{cred:6,hum:4,role:{rocker:2},flag:[`kerry`],rel:{kerry:14},msg:`Tu discutes avec la légende. Il te donne un médiator signé.`},ko:{cred:1,msg:`Les gardes te refusent l'entrée. Mais la musique te reste.`}}},
    {t:`Rester dans le public`,s:`+Humanité`,fx:{hum:8,msg:`Le son fait vibrer ta poitrine. Tu pleures sans savoir pourquoi.`}}
  ]});
card({id:`johnny_graffiti`,who:`johnny`,tag:`Légende Samurai`,w:3,cond:()=>yr()>=2070,
  tx:`Sur un mur de Kabuki, un graffiti : <em>"SAMURAI — NEVER FADE AWAY"</em>. Les anciens parlent du concert de 2023, de la bombe sur la Tour Arasaka, de Johnny Silverhand, mort ou disparu, personne ne sait vraiment.`,
  ch:[
    {t:`Peindre une étoile à côté`,s:`+Street Cred · Arasaka rancune`,fx:{cred:3,hum:4,fac:{arasaka:-8},msg:`Un geste simple, un clin d'œil à l'histoire. Les vieux te saluent en passant.`}},
    {t:`Ignorer. Les héros, ça n'existe pas.`,fx:{msg:`Tu passes ton chemin. Night City n'a pas besoin de martyrs.`}},
    {t:`Prendre une photo pour les nostalgiques`,fx:{ed:60,cred:1}}
  ]});

/* ============================ HISTOIRE (dates) ============================ */
card({id:`maine_crew`,who:`maine`,tag:`2076 · Edgerunners`,story:true,at:[2076,0],
  tx:`À l'Afterlife, une table bruyante : <strong>Maine</strong> et sa crew — David, Lucy, Rebecca, Pilar, Kiwi, Dorio, Falco. Maine te tape l'épaule : « T'as une tête de gars qui connaît les boulots à haut risque. Un coup gros comme un immeuble. Une place libre, ça t'intéresse ? »`,
  ch:[
    {t:`Rejoindre la crew pour un run`,s:`Risque très élevé · Gain énorme`,fx:{flag:[`maine`],cred:8,ed:3500,role:{solo:3},next:`maine_fall`,msg:`Tu serres la main de Maine, tu croises le regard de David. Le coup est lancé.`}},
    {t:`Refuser, les gros coups finissent mal`,s:`Prudence`,fx:{cred:2,hum:3,msg:`« Comme tu veux. Mais tu vas rater quelque chose, choom. »`}},
    {t:`Demander à voir David`,s:`Lucy et David`,fx:{hum:5,cred:3,msg:`David est jeune, tendu, avec un sourire timide. Lucy t'observe comme si elle voyait déjà ton avenir.`}}
  ]});
card({id:`maine_fall`,who:`smasher`,tag:`2076 · Adam Smasher`,once:true,
  tx:`Le braquage de la Tour Arasaka dérape. Les alarmes hurlent, les portes se ferment. Derrière le feu, une silhouette titanesque : <strong>Adam Smasher</strong>, cyborg intégral d'Arasaka. Maine est à terre, Dorio hurle, Falco n'est plus un nom. David te crie de fuir.`,
  ch:[
    {t:`Courir, ne pas se retourner`,s:`RÉFLEXES · fuite`,chk:{a:`ref`,dc:9,ok:{cred:12,hum:-8,ed:1000,msg:`Tu cours dans la fumée. Derrière toi, les cris. Tu survis. Peu d'autres y arrivent.`},ko:{hp:-60,hum:-10,cred:4,msg:`Une balle, puis une autre. Tu survives par miracle, mais tu portes cette nuit dans ta chair.`}}},
    {t:`Couvrir la fuite de David`,s:`Sacrifice · peut être fatal`,chk:{a:`body`,k:`cmb`,dc:10,ok:{cred:20,hum:6,msg:`Tu retiens Smasher assez longtemps pour que David et Lucy disparaissent. On parlera de toi à l'Afterlife pendant des années.`},ko:{hp:-80,cred:25,hum:-6,msg:`Smasher te saisit et te brise comme une poupée. Tu as tenu assez longtemps pour que David et Lucy disparaissent. Tu t'en sors à peine.`}}},
    {t:`Hacker les portes pour tous`,s:`Cyberdeck · INT`,req:R.deck(),chk:{a:`int`,k:`hck`,dc:9,ok:{cred:15,role:{net:3},msg:`Les portes s'ouvrent, l'équipe s'échappe. Tu viens de sauver des vies.`},ko:{hp:-45,hum:-8,msg:`Le pare-feu d'Arasaka te grille la nuque. Tu t'en sors de justesse.`}}}
  ]});
card({id:`konpeki_rumor`,who:`dex`,tag:`2077 · Konpeki Plaza`,story:true,at:[2077,2],
  tx:`À l'Afterlife, tout le monde parle d'un coup monstre à la <em>Konpeki Plaza</em>. Dex a engagé une jeune merc, <strong>V</strong>, et Jackie Welles pour braquer l'hôtel d'Arasaka pendant que Saburo y est invité. Dex te regarde : « J'ai besoin de quelqu'un en couverture. Pas dans l'équipe principale, mais assez près. »`,
  ch:[
    {t:`Accepter de faire la couverture`,s:`Risque · gros gain`,chk:{a:`cool`,dc:8,ok:{ed:3000,cred:10,flag:[`konpeki`],msg:`Tu surveilles la rue pendant que la tour brûle d'un autre feu. Plus tard, tu apprends que le coup a mal tourné.`},ko:{hp:-30,cred:3,msg:`La sécurité Arasaka te repère. Tu t'enfuis, blessé(e), sans pouvoir aider personne.`}}},
    {t:`Refuser, trop dangereux`,fx:{cred:1,hum:3,msg:`« Sage. Parfois, la vie vaut plus qu'une légende. »`}}
  ]});
card({id:`saburo`,who:`narr`,tag:`2077 · Saburo Arasaka`,story:true,at:[2077,4],
  tx:`Les écrans de Night City s'illuminent : <em>Saburo Arasaka est mort.</em> La rumeur parle d'un assassinat à la Konpeki Plaza. Arasaka vacille, Militech jubile, Hanako Arasaka prend la scène. Les rues bruissent.`,
  ch:[
    {t:`Profiter du chaos pour piller un entrepôt`,s:`Risqué`,chk:{a:`ref`,dc:8,ok:{ed:2500,cred:6,hum:-3,msg:`Une camionnette entière d'armes de contrebande. Tu es riche, d'un coup.`},ko:{hp:-24,cred:0,msg:`Les gardes sont encore là. Tu t'en sors à peine.`}}},
    {t:`Vendre l'info aux fixers`,s:`INTELLECT`,chk:{a:`int`,dc:7,ok:{ed:1800,cred:5,role:{fixer:2},msg:`Dex et Wakako s'arrachent tes infos. Tu mets les pieds dans un jeu énorme.`},ko:{ed:200,msg:`Trop d'infos circulent. La tienne ne vaut plus rien.`}}},
    {t:`Observer et attendre`,fx:{hum:2,cred:1}}
  ]});
card({id:`arasaka_assault`,who:`takemura`,tag:`2077 · Tour Arasaka`,story:true,at:[2077,7],
  tx:`Alerte rouge sur tous les réseaux : un assaut sur la <strong>Tour Arasaka</strong>. Des mercenaires, des nomades, des anciens, tous visent le même cœur. Les Aldecaldos, dit-on, forment un convoi. Rogue est de la partie. Des rumeurs parlent de Johnny Silverhand, de Soulkiller, du Blackwall. Tu as le choix.`,
  ch:[
    {t:`Rejoindre l'assaut`,s:`Risque extrême`,chk:{a:`body`,k:`cmb`,dc:10,ok:{cred:22,ed:4000,hum:-6,role:{solo:3},flag:[`assault`],msg:`Dans la fumée des tours, tu te bats à côté des légendes. Quand la poussière retombe, tu es toujours debout.`},ko:{hp:-70,cred:8,hum:-6,msg:`Tu survis à un enfer. Beaucoup tombent à tes côtés. Tu t'en sors, couvert(e) de sang.`}}},
    {t:`Aider à distance, en piratant`,s:`Cyberdeck · INT`,req:R.deck(),chk:{a:`int`,k:`hck`,dc:9,ok:{cred:20,ed:3000,role:{net:3},flag:[`assault`],msg:`Tu perces les caméras, ouvres les portes. Quelqu'un te remercie dans un canal chiffré.`},ko:{hp:-25,hum:-6,msg:`Les défenses d'Arasaka te mordent la nuque. Tu coupes la liaison, hagard(e).`}}},
    {t:`Rester à l'écart, observer de loin`,s:`Prudent`,fx:{cred:2,hum:3,msg:`Tu regardes la fumée monter sur Night City. Une époque se termine, tu le sens.`}}
  ]});
card({id:`afterwar`,who:`hanako`,tag:`2078 · Après la tempête`,story:true,at:[2078,0],
  tx:`Un an plus tard, Night City panse ses plaies. La Tour Arasaka est un chantier, Militech et NUSA se partagent les juteux contrats de reconstruction. Les gangs repoussent les frontières. La rue appelle toujours son lot de nouveaux visages.`,
  ch:[
    {t:`Profiter du vide pour s'enrichir`,s:`Gros gain`,fx:{ed:2000,cred:3,msg:`Tu te places entre les entrepreneurs et les gangs. Rien d'illégal… ou presque.`}},
    {t:`Poursuivre ta propre route`,fx:{cred:2,hum:3}},
    {t:`Chercher des vieux amis`,fx:{hum:6,msg:`Certains ont disparu, d'autres sont devenus des rumeurs. Quelques-uns te sourient quand même.`}}
  ]});
card({id:`dogtown`,who:`hansen`,tag:`Dogtown · Barghest`,story:true,at:[2077,10],
  tx:`Dogtown, au fond de Pacifica : l'ancien complexe militaire est devenu un état dans l'état. Le colonel <strong>Kurt Hansen</strong> et ses Barghest tiennent les remparts. La NUSA a besoin de ses mercenaires, et lui a besoin d'opérateurs capables.`,
  ch:[
    {t:`Entrer à Dogtown, tenter ta chance`,s:`Débloque Dogtown`,chk:{a:`cool`,dc:8,ok:{flag:[`dogtown`],cred:6,ed:1500,msg:`Les Barghest te laissent passer. Le quartier te fascine : ruines, néons, et un silence qui pèse.`},ko:{hp:-20,cred:1,msg:`On t'écarte à coups de crosse. Mais l'idée de Dogtown continue de te hanter.`}}},
    {t:`Rester à Night City`,fx:{}}
  ]});

card({id:`hum_warn`,who:`doc`,tag:`⚠ Humanité critique`,w:30,cond:()=>G.hum<45&&G.hum>=20,

card({id:`maxtac`,who:`maxtac`,tag:`⚠ MaxTac`,w:60,cond:()=>G.hum<20,

card({id:`sandy_overload`,who:`doc`,tag:`Surcharge nerveuse`,w:8,cond:()=>hasCy(`sandy`)||hasCy(`apogee`),
  tx:`Ton Sandevistan s'emballe : le monde ralentit, mais ton corps lâche. Du sang coule de ton nez. « C'est le prix, » dit le doc. « Un peu de repos ou un recalibrage, sinon tu cuis de l'intérieur. »`,

card({id:`loan_shark`,who:`fix`,tag:`Créanciers`,w:50,cond:()=>G.ed<0,
  tx:`Tu dois de l'argent. Pas à n'importe qui : à des gens qui savent comment vous retrouver. Deux types t'attendent devant ta porte, leur sourire n'a rien d'amical.`,

   MOTEUR — état, règles, effets

let G = null;
const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const byId = {}; CARDS.forEach(c => byId[c.id] = c);
const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const CYMAP = {}; CYBER.forEach(c=>CYMAP[c.id]=c);
const GEARMAP = {}; GEAR.forEach(c=>GEARMAP[c.id]=c);
CYBER.forEach(c=>{c.h=Math.round(c.h*1.3)});
const CY = id => CYMAP[id];
const DMAP = {}; DIST.forEach(d=>DMAP[d.id]=d);

/* intros liées à l'origine */
byId.st_intro.cond = ()=>G.origin===`street`;

const CD = {hum_warn:3,maxtac:2,loan_shark:3,fac_promo:1,mine_raid:5,legend:99};

/* ---------- état ---------- */
function newState(o){
  const at = {body:3,ref:3,tech:3,int:3,cool:3};
  Object.entries(o.at||{}).forEach(([k,v])=>at[k]+=v);
  Object.entries(o.alloc||{}).forEach(([k,v])=>at[k]+=v);
  const s = {
    v:1, name:o.name, origin:o.origin, sub:o.sub, t:0, age:START_AGE,
    hp:100, hum:100, cred:o.cred, ed:o.ed, at,
    cyber:[], hacks:[], gear:[], flags:{}, fac:{}, member:null, rank:0, jobs:0,
    mine:null, pendingLoot:0, lastA:null, xp:{body:0,ref:0,tech:0,int:0,cool:0}, rel:{}, bloc:{rue:50,corpo:50,loi:50,nomad:50}, dist:{}, role:{solo:0,net:0,fixer:0,tech:0,med:0,rocker:0,corpo:0,nomad:0,cop:0,boss:0},
    done:{}, hist:[], queue:[], log:[], tmp:{}, joinedOnce:{}, cur:null,
    stats:{cards:0,fights:0,jobs:0,peak:0,gigs:0}, over:null, fameBonus:0
  };
  DIST.forEach(d=>s.dist[d.id]=d.o);
  Object.entries(o.fac||{}).forEach(([k,v])=>s.fac[k]=v);
  (o.flags||[]).forEach(f=>s.flags[f]=true);
  return s;
}
const yr = () => START_YEAR + Math.floor(G.t/12);
const mo = () => G.t % 12;
const MONTHS = [`Janv.`,`Févr.`,`Mars`,`Avr.`,`Mai`,`Juin`,`Juil.`,`Août`,`Sept.`,`Oct.`,`Nov.`,`Déc.`];
const dateStr = () => `${MONTHS[mo()]} ${yr()}`;
const hasCy = id => G.cyber.includes(id);
const hasDeck = () => G.cyber.some(i=>CY(i).deck) && hasCy(`plug`);
const deckSlots = () => G.cyber.reduce((a,i)=>a+(CY(i).deck||0),0);
function bonusAt(a){
  let v=0;
  G.cyber.forEach(i=>{v+=(CY(i).at||{})[a]||0});
  G.gear.forEach(i=>{v+=(GEARMAP[i].at||{})[a]||0});
  if(G.member) v+=(FAC[G.member].at||{})[a]||0;
  return v;
}
const A = a => clamp(G.at[a]+bonusAt(a),1,13);
function skill(k){
  let v=0;
  G.cyber.forEach(i=>{v+=(CY(i).k||{})[k]||0});
  if(k===`cmb`||k===`drv`){ let best=0; G.gear.forEach(i=>{best=Math.max(best,(GEARMAP[i].k||{})[k]||0)}); v+=best; }
  if(k===`hck`) v+=Math.floor(G.hacks.length/2);
  if(G.mine){ if(G.mine.type===`runners`&&k===`hck`)v++; if(G.mine.type===`nomads`&&k===`drv`)v++; if(G.mine.type===`gang`&&k===`cmb`)v++; }
  if(G.member===`wraiths`&&k===`drv`)v++;
  return v;
}
function mitigation(){
  let m=0;
  G.cyber.forEach(i=>m+=CY(i).mit||0);
  G.gear.forEach(i=>m+=GEARMAP[i].mit||0);
  return Math.min(.5,m);
}
const ownedList = () => DIST.filter(d=>G.dist[d.id]===`player`);
function pickFoe(d){
  const home = FAC[d.o]?d.o:null;
  const pool = Object.keys(FAC).filter(f=>f!==G.member&&f!==home);
  return pool[rnd(0,pool.length-1)];
}
function roleTitle(){
  if(G.mine&&G.role.boss>=3) return ROLES.boss;
  let best=null,bv=2;
  Object.entries(G.role).forEach(([k,v])=>{if(k!==`boss`&&v>bv){bv=v;best=k}});
  if(best) return ROLES[best];
  return {street:`Street Kid`,corpo:`Corpo`,nomad:`Nomade`}[G.origin];
}
function rankTitle(){ return G.member?RANKS[FAC[G.member].k][G.rank]:null; }

/* ---------- expérience : on progresse en pratiquant ---------- */
const xpNeed = lv => 6+3*Math.max(0,lv-3);
const MENTOR = {body:`jackie`,ref:`claire`,tech:`vik`,int:`dex`,cool:`rogue`};
function gainXp(a,amt){
  G.xp=G.xp||{body:0,ref:0,tech:0,int:0,cool:0};
  if(G.at[a]>=9) return;
  G.xp[a]+=amt; chip(`i`,`+${amt} XP ${ATTRS[a].n}`);
  while(G.at[a]<9 && G.xp[a]>=xpNeed(G.at[a])){
    G.xp[a]-=xpNeed(G.at[a]); G.at[a]++;
    chip(`p`,`★ ${ATTRS[a].n} ${G.at[a]} !`); G.log.unshift({d:dateStr(),m:`Tu progresses : ${ATTRS[a].n} ${G.at[a]}.`});
    toast(`${ATTRS[a].n} ${G.at[a]} !`); SFX.ok(); flash(`#fcee0a`); vib([30,40,30]);
  }
}
/* ---------- blocs d'influence (équilibre) ---------- */
function moveBloc(b,d){
  if(!b||!d) return; G.bloc=G.bloc||{rue:50,corpo:50,loi:50,nomad:50};
  const o=BLOCS[b].opp, bb=G.bloc[b], ob=G.bloc[o];
  G.bloc[b]=clamp(bb+d,0,100); G.bloc[o]=clamp(ob-d*.4,0,100);
  const rd=Math.round(G.bloc[b]-bb); if(Math.abs(rd)>=1) chip(rd>0?`i`:`n`,`${sgn(rd)} ${BLOCS[b].n}`);
}
function blocFromFx(fx){
  const m={}; if(!fx) return m;
  if(fx.fac) Object.entries(fx.fac).forEach(([k,v])=>{const b=BLOC[k];if(b)m[b]=(m[b]||0)+v*.5});
  if(fx.join&&BLOC[fx.join]) m[BLOC[fx.join]]=(m[BLOC[fx.join]]||0)+10;
  if(fx.bloc) Object.entries(fx.bloc).forEach(([k,v])=>m[k]=(m[k]||0)+v);
  return m;
}
/* ---------- butin : récompenses au choix ---------- */
const lootTierEd = ed => ed>=4000?3:ed>=2500?2:ed>=1200?1:0;
function makeLoot(t){
  const pool=[];
  const ed=Math.round((350*t+rnd(0,250))/50)*50;
  pool.push({k:`cash`,ic:`💰`,t:`Prime`,d:`+${money(ed)}`,ap:()=>applyFx({ed})});
  pool.push({k:`cred`,ic:`★`,t:`Réputation`,d:`+${1+t} Street Cred`,ap:()=>applyFx({cred:1+t})});
  const ats=Object.keys(ATTRS).filter(k=>G.at[k]<9);
  if(ats.length){ const a=(G.lastA&&G.at[G.lastA]<9)?G.lastA:ats[rnd(0,ats.length-1)];
    pool.push({k:`xp`,ic:`📈`,t:`Expérience`,d:`+${3+t} XP · ${ATTRS[a].n}`,ap:()=>gainXp(a,3+t)}); }
  pool.push({k:`heal`,ic:`💊`,t:`Repos mérité`,d:`+${25+10*t} Santé · +${4+2*t} Humanité`,ap:()=>applyFx({hp:25+10*t,hum:4+2*t})});
  const cands=Object.keys(WHO).filter(k=>REL_NAMES.includes(k));
  if(cands.length){ const c=cands[rnd(0,cands.length-1)];
    pool.push({k:`rel`,ic:`🤝`,t:`Faveur`,d:`+${8+3*t} lien · ${WHO[c].n}`,ap:()=>applyFx({rel:{[c]:8+3*t}})}); }
  const worst=Object.keys(BLOCS).sort((a,b)=>Math.abs(G.bloc[b]-50)-Math.abs(G.bloc[a]-50))[0];
  const dev=G.bloc[worst]-50;
  if(Math.abs(dev)>=18) pool.push({k:`bal`,ic:`⚖`,t:`Rééquilibrer`,d:`${BLOCS[worst].n} ${dev<0?`+`:`−`}${8+4*t} (te rapproche du milieu)`,w:3,ap:()=>applyFx({bloc:{[worst]:dev<0?8+4*t:-(8+4*t)}})});
  if(t>=2){ const g=GEAR.filter(x=>!G.gear.includes(x.id)&&x.p<=2000+1800*t&&(!x.cred||G.cred>=x.cred)); if(g.length){ const x=g[rnd(0,g.length-1)];
    pool.push({k:`gear`,ic:`🎁`,t:`Butin`,d:`${x.n} (${x.t})`,w:2,ap:()=>{G.gear=G.gear.filter(i=>GEARMAP[i].t!==x.t);G.gear.push(x.id);chip(`y`,`Obtenu : ${x.n}`)}}); } }
  if(t>=2&&hasDeck()){ const h=HACKS.filter(x=>!G.hacks.includes(x.id)&&A(`int`)>=x.int); if(h.length&&G.hacks.length<deckSlots()){ const x=h[rnd(0,h.length-1)];
    pool.push({k:`hack`,ic:`💾`,t:`Quickhack`,d:`${x.n} (gratuit)`,w:2,ap:()=>{G.hacks.push(x.id);chip(`y`,`Chargé : ${x.n}`)}}); } }
  const out=[];
  while(out.length<3&&pool.length){
    const tw=pool.reduce((a,o)=>a+(o.w||2),0); let r=Math.random()*tw, i=0;
    for(;i<pool.length;i++){ r-=(pool[i].w||2); if(r<=0)break; }
    out.push(pool.splice(Math.min(i,pool.length-1),1)[0]);
  }
  return out;
}
/* ---------- jets ---------- */
function rollInfo(c){
  const tot = A(c.a) + (c.k?skill(c.k):0);
  const dc = typeof c.dc===`function`?c.dc():c.dc;
  const need = dc + 4 - tot;
  let n=0; for(let r=1;r<=10;r++){ if(r===10||(r!==1&&r>=need)) n++; }
  return {tot,dc,need,chance:n/10};
}

/* ---------- effets ---------- */
let CHIPS = [];
const chip = (cls,txt)=>CHIPS.push({cls,txt});
const sgn = v => (v>0?`+`:``)+v;
function applyFx(fx){
  if(!fx) return;
  if(fx.hp){ let v=fx.hp; if(v<0) v=-Math.max(1,Math.round(-v*1.3*(1-mitigation()))); const b=G.hp; G.hp=clamp(G.hp+v,0,100); if(G.hp!==b) chip(v>0?`p`:`n`,`${sgn(G.hp-b)} Santé`); if(v<0){SFX.hit();shake();flash(`#ff2a6d`)} }
  if(fx.hum){ const b=G.hum; G.hum=clamp(G.hum+fx.hum,0,100); if(G.hum!==b) chip(G.hum>b?`p`:`n`,`${sgn(G.hum-b)} Humanité`); if(fx.hum<0)SFX.glitch(); }
  if(fx.cred){ const b=G.cred; const cv=fx.cred>0?Math.max(1,Math.round(fx.cred*(1-G.cred/110))):fx.cred; G.cred=clamp(G.cred+cv,0,100); if(G.cred!==b) chip(G.cred>b?`y`:`n`,`${sgn(G.cred-b)} Street Cred`); G.stats.peak=Math.max(G.stats.peak,G.cred); }
  if(fx.ed){ G.ed+=fx.ed; chip(fx.ed>0?`i`:`n`,`${sgn(fx.ed)} €$`); }
  if(fx.at) Object.entries(fx.at).forEach(([k,v])=>{ const b=G.at[k]; G.at[k]=clamp(G.at[k]+v,1,10); if(G.at[k]!==b) chip(`p`,`${sgn(G.at[k]-b)} ${ATTRS[k].n}`); });
  Object.entries(blocFromFx(fx)).forEach(([b,d])=>moveBloc(b,d));
  if(fx.fac) Object.entries(fx.fac).forEach(([k,v])=>{ G.fac[k]=clamp((G.fac[k]||0)+v,-100,100); });
  if(fx.rel){ G.rel=G.rel||{}; Object.entries(fx.rel).forEach(([k,v])=>{ G.rel[k]=clamp((G.rel[k]||0)+v,-50,100); chip(v>0?`p`:`n`,`${sgn(v)} lien · ${WHO[k].n.split(` `)[0]}`); }); }
  if(fx.role) Object.entries(fx.role).forEach(([k,v])=>G.role[k]=(G.role[k]||0)+v);
  if(fx.flag) fx.flag.forEach(f=>G.flags[f]=true);
  if(fx.unflag) fx.unflag.forEach(f=>delete G.flags[f]);
  if(fx.flagMark) G.joinedOnce[fx.flagMark]=true;
  if(fx.unonce) delete G.done[fx.unonce];
  if(fx.cy) installCy(fx.cy,true);
  if(fx.join) joinFac(fx.join);
  if(fx.fn && FN[fx.fn]) FN[fx.fn]();
  if(fx.found) G.pendingFound = fx.found;
  if(fx.next) (Array.isArray(fx.next)?fx.next:[fx.next]).forEach(n=>G.queue.push(n));
}
function joinFac(id){
  if(G.member&&G.member!==id) G.fac[G.member]=(G.fac[G.member]||0)-10;
  G.member=id; G.rank=0; G.jobs=0; G.fac[id]=Math.max(20,(G.fac[id]||0)+20);
  FAC[id].foes.forEach(f=>G.fac[f]=clamp((G.fac[f]||0)-15,-100,100));
  chip(`y`,`Membre : ${FAC[id].n}`); toast(`Tu rejoins ${FAC[id].n}`); SFX.ok();
}
function removeCy(id){ G.cyber=G.cyber.filter(x=>x!==id); }
function installCy(id,free){
  const c=CY(id);
  G.cyber=G.cyber.filter(x=>CY(x).slot!==c.slot);
  if(c.slot===`neural`&&!hasCy(`plug`)) {}
  G.cyber.push(id);
  if(c.slot===`neural`&&c.id!==`plug`){}
}
const FN = {
  sellOne(){ if(!G.cyber.length)return; const id=G.cyber[rnd(0,G.cyber.length-1)]; removeCy(id); const v=Math.round(CY(id).p*.5); G.ed+=v; chip(`i`,`+${v} €$`); chip(`n`,`− ${CY(id).n}`); },
  defendWin(){ if(G.mine) G.mine.power++; chip(`y`,`Territoire défendu`); },
  defendLose(){ const d=G.tmp&&G.tmp.d; if(d&&G.dist[d]===`player`){ G.dist[d]=G.tmp.rival||`neutral`; chip(`n`,`Perdu : ${DMAP[d].n}`); } },
  mineGrow(){ if(G.mine){G.mine.power++;chip(`y`,`Puissance de ${G.mine.name} +1`);} },
  facJobWin(){ const f=FAC[G.member]; const pay=(G.rank+1)*450+rnd(0,350); G.ed+=pay; G.cred=clamp(G.cred+3+G.rank,0,100); G.fac[G.member]=clamp((G.fac[G.member]||0)+6,-100,100); G.jobs++; G.stats.jobs++; G.pendingLoot=Math.max(G.pendingLoot||0,G.rank>=2?2:1); chip(`i`,`+${pay} €$`); chip(`y`,`+${3+G.rank} Street Cred`); chip(`i`,`+6 ${f.n}`); },
  facJobFail(){ G.jobs=Math.max(0,G.jobs); },
  promote(){ G.rank++; const f=FAC[G.member]; const pay=500*G.rank; G.ed+=pay; G.fac[G.member]=clamp((G.fac[G.member]||0)+8,-100,100); chip(`y`,`Rang : ${RANKS[f.k][G.rank]}`); chip(`i`,`+${pay} €$`);
    if(f.k===`mox`){G.hum=clamp(G.hum+8,0,100);chip(`p`,`+8 Humanité`)}
    if(G.member===`maelstrom`){G.hum=clamp(G.hum-6,0,100);chip(`n`,`−6 Humanité`)}
    if(f.k===`trauma`){G.hp=100;chip(`p`,`Soins gratuits`)}
    SFX.ok(); },
  betray(){ const old=G.member; const nw=FAC[old].foes[0]; G.fac[old]=-70; joinFac(nw); },
  seizeFaction(){ const id=G.member; G.flags[`leader_`+id]=true; const hd=FAC[id].home; if(DMAP[hd]) G.dist[hd]=`player`; G.role.boss+=2; chip(`y`,`Tu diriges ${FAC[id].n}`); toast(`Tu prends la tête de ${FAC[id].n}`); SFX.ok(); flash(`#fcee0a`); },
  facLoyal(){ G.fac[G.member]=clamp((G.fac[G.member]||0)+12,-100,100); }
};

/* ---------- temps & économie ---------- */
function tick(months){
  const k = months/STEP;
  let inc = 0;
  ownedList().forEach(d=>inc+=d.inc*3*(G.mine&&G.mine.type===`gang`?1.2:1));
  if(G.mine&&G.mine.type===`fixers`) inc+=300;
  if(G.flags.corpjob) inc+=140*STEP;
  if(G.member){ const kd=FAC[G.member].k; inc+= (kd===`corp`||kd===`ncpd`||kd===`trauma`?110:55)*(G.rank+1)*STEP*.6; }
  const rent = clamp(30+Math.max(0,G.ed)*.004,30,150)*STEP;
  const net = Math.round((inc-rent)*k);
  G.ed += net;
  const reg = G.cyber.reduce((a,i)=>a+(CY(i).regen||0),0);
  if(reg) G.hp=clamp(G.hp+Math.round(reg*k),0,100);
  G.hp = clamp(G.hp+Math.round(5*k),0,100);
  G.t += months;
  G.age = START_AGE + Math.floor(G.t/12);
  if(ownedList().length){ G.cred=clamp(G.cred+ownedList().length*0.3*k|0,0,100); }
  return net;
}

/* ---------- tirage ---------- */
function safe(fn,d){ try{return fn()}catch(e){return d} }
function drawCard(){
  while(G.queue.length){ const c=byId[G.queue.shift()]; if(c) return c; }
  const T=G.t;
  const st = CARDS.filter(c=>c.story && !G.done[c.id] && T>=(c.at[0]-START_YEAR)*12+c.at[1] && (!c.cond||safe(c.cond,false)));
  if(st.length){ st.sort((a,b)=>(a.at[0]*12+a.at[1])-(b.at[0]*12+b.at[1])); return st[0]; }
  const recent = id => { const cd=CD[id]||7; return G.hist.slice(-cd).includes(id); };
  let pool = CARDS.filter(c=>!c.story && (!c.once||!G.done[c.id]) && (!c.cond||safe(c.cond,false)) && !recent(c.id));
  if(!pool.length) pool = CARDS.filter(c=>c.id.startsWith(`fl`));
  const tw = pool.reduce((a,c)=>a+(c.w||5),0);
  let r = Math.random()*tw;
  for(const c of pool){ r-=(c.w||5); if(r<=0) return c; }
  return pool[0];
}
function prepCard(c){
  G.done[c.id]=true; G.hist.push(c.id); if(G.hist.length>40)G.hist.shift();
  G.tmp={};
  const raw = typeof c.tx===`function`?c.tx():c.tx;
  G.cur = {id:c.id, text:raw.replace(/\{n\}/g,G.name)};
}

/* ---------- conquête ---------- */
function conquestChoices(d){
  const o=[];
  o.push({k:`assault`,t:`Assaut armé`,s:`${ATTRS.body.n} + combat`,a:`body`,sk:`cmb`,dc:5+d.def*1.5});
  o.push({k:`hack`,t:`Piratage des systèmes`,s:`${ATTRS.int.n} + hack · cyberdeck requis`,a:`int`,sk:`hck`,dc:5+d.def*1.5+1,req:hasDeck()?``:`Cyberdeck requis`});
  o.push({k:`talk`,t:`Diplomatie & pression`,s:`${ATTRS.cool.n}`,a:`cool`,sk:null,dc:6+d.def*1.5});
  const price=d.def*1800;
  o.push({k:`buy`,t:`Acheter le quartier`,s:`${price} €$ · réussite garantie`,price,req:G.ed>=price?``:`${price} €$ requis`});
  return o;
}
function canConquer(d){
  if(G.dist[d.id]===`player`) return `Déjà à toi`;
  if(d.lock&&!G.flags.dogtown) return `Verrouillé`;
  if(G.member&&G.dist[d.id]===G.member) return `Ta propre faction`;
  const need = d.def*7;
  if(G.cred<need) return `Street Cred ${need} requis`;
  return ``;
}
function doConquer(d,opt){
  CHIPS=[];
  const prev=G.dist[d.id];
  let ok=true, info=null;
  if(opt.k===`buy`){ G.ed-=opt.price; chip(`n`,`−${opt.price} €$`); }
  else {
    const c={a:opt.a,k:opt.sk,dc:opt.dc - (G.member&&FAC[G.member].foes.includes(prev)?2:0)};
    const ri=rollInfo(c); const roll=rnd(1,10);
    ok = roll===10||(roll!==1&&roll>=ri.need); info={roll,...ri,ok}; gainXp(opt.a,ok?3:1);
  }
  if(ok){
    G.dist[d.id]=`player`; G.cred=clamp(G.cred+d.def*2,0,100); chip(`y`,`+${d.def*2} Street Cred`);
    if(FAC[prev]){ G.fac[prev]=clamp((G.fac[prev]||0)-15,-100,100); moveBloc(BLOC[prev],-8); FAC[prev].foes.forEach(f=>G.fac[f]=clamp((G.fac[f]||0)+5,-100,100)); }
    if(G.mine) G.mine.power++;
    G.log.unshift({d:dateStr(),m:`Tu prends le contrôle de ${d.n}.`}); chip(`y`,`${d.n} conquis`);
  } else {
    const hp=-(d.def*8); applyFx({hp}); if(FAC[prev]){G.fac[prev]=clamp((G.fac[prev]||0)-6,-100,100);chip(`n`,`−6 ${FAC[prev].n}`)}
    G.cred=clamp(G.cred-2,0,100); chip(`n`,`−2 Street Cred`);
  }
  tick(2);
  return {ok,info,chips:CHIPS.slice()};
}

/* ---------- fins & score ---------- */
const relSum = () => Object.values(G.rel||{}).reduce((a,v)=>a+Math.max(0,v),0);
function computeScore(kind){
  const years = yr()-START_YEAR;
  const attrSum = Object.keys(G.at).reduce((a,k)=>a+G.at[k],0);
  const dN = ownedList().length;
  const legend = G.flags.legend?1500:0;
  const fame = G.gear.reduce((a,i)=>a+(GEARMAP[i].fame||0)*300,0);
  const lines = [
    [`Années survécues (${years})`, years*90],
    [`Street Cred (${G.cred})`, G.cred*45],
    [`Pic de réputation (${G.stats.peak})`, G.stats.peak*15],
    [`Fortune`, Math.round(Math.max(0,G.ed)/12)],
    [`Humanité restante (${G.hum})`, G.hum*7],
    [`Quartiers contrôlés (${dN})`, dN*320],
    [`Faction « ${G.mine?G.mine.name:`—`} »`, G.mine?G.mine.power*260+400:0],
    [`Attributs (${attrSum})`, attrSum*25],
    [`Chrome installé (${G.cyber.length})`, G.cyber.length*80],
    [`Missions de faction (${G.stats.jobs})`, G.stats.jobs*60],
    [`Relations (${relSum()})`, relSum()*14],
    [`Légende & style`, legend+fame],
  ];
  let base = lines.reduce((a,l)=>a+l[1],0);
  const mult = ENDS[kind].m || ({retire:1.3,quit:1.15,blaze:G.cred>=30?1.2:0.9,flatline:.6,mercy:.6,psycho:.5,debt:.5}[kind]||1);
  return {lines, base, mult, total:Math.round(base*mult)};
}
function endGame(kind){
  if(G.over) return;
  G.over=kind;
  const sc=computeScore(kind);
  G.final=sc;
  store.del(`ncl_save`);
  const best=store.get(`ncl_best`)||[];
  const entry={name:G.name,score:sc.total,end:ENDS[kind].t,role:roleTitle(),year:yr(),age:G.age,date:Date.now()};
  best.push(entry); best.sort((a,b)=>b.score-a.score);
  G.newBest = best[0]===entry;
  store.set(`ncl_best`,best.slice(0,8));
}
function checkEnd(){
  if(G.over) return true;
  if(G.hp<=0){
    if(G.flags.trauma){ delete G.flags.trauma; G.hp=35; toast(`Trauma Team Platinum t'a sauvé(e) !`); SFX.ok(); G.log.unshift({d:dateStr(),m:`Trauma Team t'a ramené(e) de justesse.`}); return false; }
    endGame(`flatline`); return true;
  }
  if(G.hum<=0){ endGame(`psycho`); return true; }
  if(G.ed<=-4000){ endGame(`debt`); return true; }
  for(const b of Object.keys(BLOCS)){ const v=(G.bloc||{})[b]; if(v<=0){ endGame(`bloc_${b}_lo`); return true; } if(v>=100){ endGame(`bloc_${b}_hi`); return true; } }
  if(G.age>=RETIRE_AGE){ endGame(`retire`); return true; }
  return false;
}

let AC=null, muted=!!store.get(`ncl_mute`);
function beep(f,d=.08,type=`square`,v=.035,slide=0){
  if(muted)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
const SFX = {

  ko:()=>beep(180,.3,`sawtooth`,.05,.4),
  hit:()=>beep(110,.18,`square`,.06,.4),
  glitch:()=>{beep(900,.05,`sawtooth`,.03,.2);setTimeout(()=>beep(300,.08,`square`,.03,.5),60)},
  buy:()=>{beep(880,.05,`triangle`,.05);setTimeout(()=>beep(1320,.1,`triangle`,.05),60)},
  roll:()=>beep(300+Math.random()*400,.03,`square`,.02),
  swoosh:()=>beep(400,.12,`sine`,.03,2.2),

function vib(n){try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}
function shake(){ vib(40); const e=$(`.screen`); if(!e)return; e.classList.remove(`shake`); void e.offsetWidth; e.classList.add(`shake`); }
function flash(c){ const f=$(`#flash`); f.style.background=c; f.style.transition=`none`; f.style.opacity=.35; requestAnimationFrame(()=>{f.style.transition=`opacity .5s`; f.style.opacity=0}); }
function toast(t){ const e=document.createElement(`div`); e.className=`toast`; e.textContent=t; document.body.appendChild(e); setTimeout(()=>e.remove(),2700); }
function floatAt(el,txt,color){

  document.body.appendChild(f); setTimeout(()=>f.remove(),1300);

/* ---------- portraits procéduraux ---------- */
function portrait(id){
  const w=WHO[id]||WHO.narr, c=w.c, bot=w.sk<8;
  const skin=bot?`#5a5f6e`:`hsl(${22+(w.sk%7)*2},${28+w.sk}%,${22+w.sk}%)`;
  const dark=`#0b0b16`;
  let hair=``,face=``;
  const eyes = bot ? `<rect x="36" y="42" width="28" height="6" rx="2" fill="${c}"/>` :
    `<circle cx="41" cy="45" r="2.6" fill="${c}"/><circle cx="59" cy="45" r="2.6" fill="${c}"/>`;
  switch(w.st){
    case `mohawk`: hair=`<path d="M44 14l3 12 3-14 3 14 3-12 0 18H44z" fill="${c}"/>`;break;
    case `short`: hair=`<path d="M30 40c0-18 8-24 20-24s20 6 20 24c-4-8-10-12-20-12s-16 4-20 12z" fill="${dark}"/>`;break;
    case `long`: hair=`<path d="M28 44c-2-22 8-30 22-30s24 8 22 30l2 30H26z" fill="${dark}"/><path d="M28 44c-2-22 8-30 22-30s24 8 22 30" fill="none" stroke="${c}" stroke-width="1.5"/>`;break;
    case `hood`: hair=`<path d="M22 80c-2-34 6-62 28-62s30 28 28 62z" fill="#141428" stroke="${c}" stroke-width="1.5"/>`;break;
    case `helmet`: hair=`<path d="M28 44c0-20 8-28 22-28s22 8 22 28z" fill="#2a2f45" stroke="${c}" stroke-width="1.5"/><rect x="28" y="42" width="44" height="4" fill="#1a1a2e"/>`;break;
    case `cap`: hair=`<path d="M30 40c0-14 8-20 20-20s20 6 20 20z" fill="#222238"/><rect x="26" y="38" width="52" height="4" rx="2" fill="${c}"/>`;break;
    default: break;
  }
  if(w.st===`shades`) face=`<rect x="31" y="41" width="38" height="8" rx="2" fill="#000"/><rect x="33" y="43" width="14" height="2" fill="${c}"/><rect x="53" y="43" width="14" height="2" fill="${c}"/>`;
  else if(w.st===`visor`) face=`<rect x="32" y="39" width="36" height="11" rx="3" fill="#000"/><rect x="34" y="43" width="32" height="3" fill="${c}"><animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></rect>`;
  else face=eyes;
  if(w.st===`mask`) face+=`<path d="M32 54h36v14c0 6-8 10-18 10s-18-4-18-10z" fill="#101020" stroke="${c}"/><path d="M40 62h20M40 67h20" stroke="${c}" opacity=".6"/>`;
  const mouth = (w.st===`mask`)?``:`<path d="M42 60q8 5 16 0" stroke="${dark}" stroke-width="1.6" fill="none" opacity=".7"/>`;
  const scar = (w.sk%3===0&&!bot)?`<path d="M62 36l-5 12" stroke="${c}" stroke-width="1.2" opacity=".6"/>`:``;
  return `<svg viewBox="0 0 100 100" class="portrait" aria-hidden="true">
  <defs><linearGradient id="pg${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="#0b0b16"/></linearGradient></defs>
  <rect width="100" height="100" fill="url(#pg${id})"/>

  <rect x="43" y="64" width="14" height="12" fill="${skin}"/>
  ${w.st===`hood`?``:hair.includes(`long`)?``:``}
  ${w.st===`long`?hair:``}
  <ellipse cx="50" cy="46" rx="21" ry="25" fill="${skin}"/>
  ${w.st!==`long`?hair:``}
  ${face}${mouth}${scar}
  <path d="M10 8h14M10 8v14M90 92H76M90 92V78" stroke="${c}" stroke-width="1.5" opacity=".7" fill="none"/>
  </svg>`;
}

/* ---------- skyline ---------- */
function skyline(){
  let s=`<svg class="skyline" viewBox="0 0 400 160" preserveAspectRatio="none">`;
  let x=0; const cols=[`#ff2a6d`,`#00f0ff`,`#fcee0a`,`#c77dff`];
  while(x<400){
    const w=14+Math.random()*28, h=40+Math.random()*110, c=cols[Math.floor(Math.random()*4)];
    s+=`<rect x="${x}" y="${160-h}" width="${w}" height="${h}" fill="#0c0c1a" stroke="${c}" stroke-opacity=".35"/>`;
    for(let i=0;i<Math.floor(h/14);i++) if(Math.random()>.55) s+=`<rect x="${x+3+Math.random()*(w-8)}" y="${160-h+6+i*13}" width="3" height="4" fill="${c}" opacity=".8"/>`;
    x+=w+2;
  }
  return s+`</svg>`;
}

const root = () => $(`#root`);
function ripple(e){ const b=e.currentTarget; const r=document.createElement(`span`); r.className=`rip`; const d=Math.max(b.clientWidth,b.clientHeight); const bb=b.getBoundingClientRect(); r.style.width=r.style.height=d+`px`; r.style.left=(e.clientX-bb.left-d/2)+`px`; r.style.top=(e.clientY-bb.top-d/2)+`px`; b.appendChild(r); setTimeout(()=>r.remove(),500); }
document.addEventListener(`pointerdown`,e=>{ const b=e.target.closest&&e.target.closest(`.btn`); if(b&&!b.disabled&&!b.classList.contains(`lock`)) ripple({currentTarget:b,clientX:e.clientX,clientY:e.clientY}); });

let lastVals=null;
function updateHud(init){
  const v={hp:G.hp,hum:G.hum,cred:G.cred,ed:G.ed};
  [`hp`,`hum`,`cred`].forEach(k=>{ $(`#b-${k}`).style.width=v[k]+`%`; $(`#v-${k}`).textContent=Math.round(v[k]); });
  $(`#v-ed`).textContent=v.ed.toLocaleString(`fr`); $(`#b-ed`).style.width=clamp(Math.log10(Math.max(1,v.ed))/5*100,2,100)+`%`;
  if(v.ed<0){$(`#v-ed`).style.color=`var(--m)`}else $(`#v-ed`).style.color=``;
  $(`#hdate`).textContent=`${dateStr()} · ${G.name}, ${G.age} ans`;
  $(`#hrole`).textContent=roleTitle()+(rankTitle()?` · ${rankTitle()}`:``);
  const cb=document.querySelector(`.dock [data-d=city]`); if(cb)cb.classList.toggle(`alert`,G.hp<45||G.hum<45);
  $(`#m-hp`).classList.toggle(`warn`,G.hp<=25);
  $(`#m-hum`).classList.toggle(`warn`,G.hum<=30);
  document.body.classList.toggle(`lowhum`,G.hum<=35);
  if(lastVals&&!init){
    [[`hp`,`#ff2a6d`],[`hum`,`#05ffa1`],[`cred`,`#fcee0a`],[`ed`,`#00f0ff`]].forEach(([k,c])=>{
      const d=v[k]-lastVals[k]; if(d){ const m=$(`#m-${k}`); m.classList.remove(`bump`);void m.offsetWidth;m.classList.add(`bump`); floatAt(m,(d>0?`+`:``)+d,c); }
    });
  }
  renderBlocs();
  lastVals=v;
}
function renderBlocs(){
  const b=G.bloc||{rue:50,corpo:50,loi:50,nomad:50};
  $(`#blocs`).innerHTML=Object.keys(BLOCS).map(k=>{
    const v=Math.round(b[k]), danger=v<=20||v>=80;
    return `<button class="bloc ${danger?`dg`:``}" id="bl-${k}" data-b="${k}"><span>${BLOCS[k].n}</span><div class="bb"><i style="left:${v}%;background:${danger?`var(--m)`:BLOCS[k].c}"></i></div></button>`;
  }).join(``);
  document.querySelectorAll(`.bloc`).forEach(e=>e.onclick=()=>{const k=e.dataset.b;SFX.tap();toast(`${BLOCS[k].n} ${Math.round(b[k])}/100 — ${BLOCS[k].d}. Trop bas : ils te traquent. Trop haut : ils te possèdent.`)});
}
function previewDots(ch){
  const keys=new Set(); const add=f=>{if(!f)return;[`hp`,`hum`,`cred`,`ed`].forEach(k=>{if(f[k])keys.add(k)});};
  if(ch){ add(ch.fx); if(ch.chk){add(ch.chk.ok);add(ch.chk.ko);} }
  [`hp`,`hum`,`cred`,`ed`].forEach(k=>$(`#m-${k}`).classList.toggle(`pv`,keys.has(k)));
  const bl=new Set(); if(ch){ [ch.fx,ch.chk&&ch.chk.ok,ch.chk&&ch.chk.ko].forEach(f=>Object.keys(blocFromFx(f)).forEach(k=>bl.add(k))); }
  Object.keys(BLOCS).forEach(k=>{const e=$(`#bl-${k}`); if(e)e.classList.toggle(`pv`,bl.has(k))});
}

/* ---------- boucle ---------- */
function nextOrResume(resume){
  if(resume&&G.cur&&byId[G.cur.id]) { showCardView(); return; }
  nextCard();
}
function save(){ store.set(`ncl_save`,G); }
function nextCard(){
  if(checkEnd()){ return showEnd(); }
  const c=drawCard(); prepCard(c); save(); updateHud(); showCardView();
}
function showCardView(){
  const c=byId[G.cur.id], w=WHO[c.who]||WHO.narr;
  const stage=$(`#stage`), chs=$(`#choices`);
  stage.innerHTML=`<div class="speaker">${portrait(c.who)}<div><div class="nm" style="color:${w.c}">${esc(w.n)}</div><div class="rl">${esc(w.r)}</div></div></div>
    <div class="cardwrap" id="cw"><div class="card" id="card" style="--ac:${w.c}">
      <div class="tag">${esc(c.tag||``)}</div><div class="tx">${G.cur.text}</div></div></div>`;
  chs.innerHTML=c.ch.map((h,i)=>{
    const lock=h.req?h.req():``; let badge=``;
    if(h.chk){ const r=rollInfo(h.chk); const p=Math.round(r.chance*100); badge=`<span class="bd ${p>=70?`hi`:p<=35?`lo`:``}">${p}%</span>`; }
    return `<button class="btn choice ${lock?`lock`:``}" data-i="${i}"><span class="k">${i+1}</span><span class="tt"><b>${h.t}</b>${(h.s||lock)?`<small>${lock?`🔒 ${lock}`:h.s}</small>`:``}</span>${badge}</button>`;
  }).join(``);
  chs.querySelectorAll(`.choice`).forEach(b=>{
    const i=+b.dataset.i;
    b.onclick=()=>pick(i);
    b.onmouseenter=b.onfocus=()=>previewDots(c.ch[i]);
    b.onmouseleave=b.onblur=()=>previewDots(null);
    b.addEventListener(`touchstart`,()=>previewDots(c.ch[i]),{passive:true});
  });
  SFX.swoosh();
}
let picking=false;
function pick(i,dir){
  if(picking||G.over)return;
  const c=byId[G.cur.id], ch=c.ch[i];
  if(ch.req&&ch.req()) { SFX.ko(); shake(); return; }
  picking=true; SFX.tap(); previewDots(null);
  const card=$(`#card`);
  if(card){ const d=dir||(i===0?-1:1); card.style.setProperty(`--ox`,(d*120)+`px`); card.style.setProperty(`--or`,(d*10)+`deg`); card.classList.add(`out`); }
  $(`#choices`).innerHTML=``;
  setTimeout(()=>resolveChoice(ch),260);
}
function resolveChoice(ch){
  CHIPS=[]; let fx, info=null;
  if(ch.chk){
    const c=ch.chk, r=rollInfo(c), roll=rnd(1,10);
    const ok = roll===10 || (roll!==1 && roll>=r.need);
    fx = ok?c.ok:c.ko; info={roll,ok,a:c.a,...r};
    if(ok)G.stats.fights+=0;
  } else fx=ch.fx;
  const before={hp:G.hp,hum:G.hum,cred:G.cred,ed:G.ed};
  applyFx(fx||{});
  if(info){ gainXp(info.a,info.ok?3:1); G.lastA=info.a; if(info.ok){ const lt=lootTierEd(fx.ed||0); if(lt) G.pendingLoot=Math.max(G.pendingLoot||0,lt); } }
  const msg = fx&&fx.msg ? fx.msg : ``;
  G.log.unshift({d:dateStr(),m:msg||ch.t}); if(G.log.length>120)G.log.pop();
  const chips=CHIPS.slice();
  const dead = fx&&fx.die;
  const wasHP=G.hp;
  const loot=(dead||(fx&&(fx.retire||fx.quit)))?0:(G.pendingLoot||0); G.pendingLoot=0;
  showResult({msg,chips,info,loot,die:dead,retire:fx&&fx.retire,quit:fx&&fx.quit,title:ch.t});
}
function showResult(r){
  const cw=$(`#cw`);
  const diceHtml = r.info ? `<div class="dice"><div class="die roll" id="die"><span>?</span></div><div class="info" id="dinfo">${ATTRS[r.info.a].n} <b>jet en cours…</b><span>Difficulté ${r.info.need} sur d10</span></div></div>` : ``;
  cw.innerHTML=`<div class="result" id="res">${diceHtml}<div class="rt" id="rt" style="${r.info?`visibility:hidden`:``}">${r.msg||`<em>${esc(r.title)}</em>`}</div><div class="chips" id="chips"></div><button class="btn pri" id="cont" style="visibility:hidden">Continuer ›</button></div>`;
  let done=false;
  const reveal=()=>{
    $(`#rt`).style.visibility=`visible`;
    $(`#chips`).innerHTML=r.chips.map((c,i)=>`<span class="chip ${c.cls}" style="animation-delay:${i*.07}s">${esc(c.txt)}</span>`).join(``);
    $(`#cont`).style.visibility=`visible`; done=true;
    updateHud(); autoCheck();
  };
  function autoCheck(){ if(G.hum<=30) SFX.glitch(); }
  const go=()=>{ if(!done)return; document.removeEventListener(`keydown`,key); $(`#res`).onclick=null; finishCard(r); };
  const key=e=>{ if(e.key===`Enter`||e.key===` `){ e.preventDefault(); go(); } };
  if(r.info){
    const die=$(`#die`); let n=0;
    const iv=setInterval(()=>{ die.firstChild.textContent=rnd(1,10); SFX.roll(); if(++n>9){ clearInterval(iv);
      die.classList.remove(`roll`); die.classList.add(r.info.ok?`ok`:`ko`); die.firstChild.textContent=r.info.roll;
      $(`#dinfo`).innerHTML=`${ATTRS[r.info.a].n} ${r.info.tot} + d10<b style="color:${r.info.ok?`var(--g)`:`var(--m)`}">${r.info.ok?`RÉUSSITE`:`ÉCHEC`}</b><span>Il fallait ${Math.max(2,r.info.need)}+ · tu as fait ${r.info.roll}</span>`;
      r.info.ok?(SFX.ok(),flash(`#05ffa1`),vib(30)):(SFX.ko(),shake());
      reveal();
    } },60);
  } else { setTimeout(reveal,150); }
  $(`#res`).onclick=go; document.addEventListener(`keydown`,key);
}
function finishCard(r){
  picking=false;
  if(r.loot&&!G.over){ const t=r.loot; r.loot=0; return showLoot(t,()=>finishCard(r)); }
  if(G.pendingFound){ const kind=G.pendingFound; G.pendingFound=null; return askFactionName(kind,()=>afterCard(r)); }
  afterCard(r);
}
function afterCard(r){
  if(r.die){ endGame(r.die); return showEnd(); }
  if(r.retire){ endGame(`retire`); return showEnd(); }
  if(r.quit){ endGame(`quit`); return showEnd(); }
  if(checkEnd()) return showEnd();
  if(G.cred>50){ G.cred-=(G.cred>80?2:1); }
  const net=tick(STEP); G.stats.cards++;
  if(net>=600) toast(`Revenus passifs : +${net} €$`);
  else if(net<=-250) toast(`Loyer & dettes : ${net} €$`);
  nextCard();
}
function askFactionName(kind,done){

let modalLock=false;
function modal(title,body,o){
  o=o||{}; const old=$(`#modal`); const keep=old&&old.dataset.t===title;
  closeModal(true); modalLock=!!o.lock;
  const m=document.createElement(`div`); m.className=`modal`; m.id=`modal`; m.dataset.t=title; if(keep)m.style.animation=`none`;
  m.innerHTML=`<div class="sheet ${o.full?`full`:``}" ${keep?`style="animation:none"`:``}><header>${o.back?`<button class="x bk" id="mbk">‹</button>`:``}<h3 class="hd">${title}</h3>${modalLock?``:`<button class="x" id="mx">✕</button>`}</header><div class="body" id="mb">${body}</div></div>`;
  document.body.appendChild(m);
  if(!modalLock){ m.addEventListener(`pointerdown`,e=>{if(e.target===m)closeModal()}); $(`#mx`).onclick=()=>{SFX.tap();closeModal()}; }
  if(o.back) $(`#mbk`).onclick=()=>{SFX.tap();o.back()};
}
function closeModal(){ const m=$(`#modal`); if(m)m.remove(); modalLock=false; }
document.addEventListener(`keydown`,e=>{
