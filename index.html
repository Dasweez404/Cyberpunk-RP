<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070d">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Night City Legend</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#07070d; --bg2:#0e0e1a; --panel:#13132299; --line:#2a2a44;
  --y:#fcee0a; --c:#00f0ff; --m:#ff2a6d; --g:#05ffa1; --o:#ff9f1c; --t:#e8e8f4; --dim:#8a8aa8;
  --hp:#ff2a6d; --hum:#05ffa1; --cred:#fcee0a; --ed:#00f0ff;
  font-family:'Rajdhani','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t);overflow:hidden}
body{font-size:17px;line-height:1.3;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#root{position:fixed;inset:0;display:flex;justify-content:center;
  background:radial-gradient(ellipse at 50% -10%,#1a0a2e 0%,transparent 60%),radial-gradient(ellipse at 100% 100%,#00303a55 0%,transparent 55%),var(--bg)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
#vig{position:fixed;inset:0;pointer-events:none;z-index:49;box-shadow:inset 0 0 120px rgba(0,0,0,.8)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:0}
.screen{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;position:relative;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.mono{font-family:'Share Tech Mono',ui-monospace,monospace}
.hd{font-family:'Orbitron','Rajdhani',sans-serif;letter-spacing:.08em;text-transform:uppercase}

/* ---------- glitch ---------- */
.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;inset:0;overflow:hidden}
.glitch::before{color:var(--m);transform:translate(-2px,0);clip-path:inset(0 0 55% 0);animation:gl1 2.8s infinite steps(1)}
.glitch::after{color:var(--c);transform:translate(2px,0);clip-path:inset(55% 0 0 0);animation:gl2 3.3s infinite steps(1)}
@keyframes gl1{0%,90%,100%{transform:translate(0)}92%{transform:translate(-4px,1px)}95%{transform:translate(3px,-1px)}}
@keyframes gl2{0%,86%,100%{transform:translate(0)}88%{transform:translate(4px,-1px)}93%{transform:translate(-3px,1px)}}

/* ---------- title ---------- */
.title{align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
.title h1{font-size:clamp(40px,12vw,70px);margin:0;line-height:.95;color:var(--y);text-shadow:0 0 18px #fcee0a88}
.title h1 small{display:block;font-size:.32em;color:var(--c);letter-spacing:.5em;text-shadow:0 0 12px #00f0ff88;margin-bottom:6px}
.title p{color:var(--dim);margin:0 0 6px;max-width:420px}
.skyline{position:absolute;left:0;right:0;bottom:0;height:42%;opacity:.55;z-index:-1;pointer-events:none}
.btn{position:relative;display:block;width:100%;padding:14px 18px;text-align:left;border:1px solid var(--line);background:linear-gradient(180deg,#171728,#0f0f1c);
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));transition:transform .12s,border-color .15s,background .15s,filter .15s;overflow:hidden}
.btn:hover,.btn:focus-visible{border-color:var(--c);filter:brightness(1.25);outline:none}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,#fcee0a,#d8cb00);color:#111;font-weight:700;border-color:var(--y);text-align:center;text-transform:uppercase;letter-spacing:.12em}
.btn.pri:hover{filter:brightness(1.1)}
.btn[disabled],.btn.lock{opacity:.4;pointer-events:none;filter:grayscale(.8)}
.btn .rip{position:absolute;border-radius:50%;background:#fff5;transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.row{display:flex;gap:10px;width:100%;max-width:420px}
.stack{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px}

/* ---------- creation ---------- */
.create{padding:18px 16px;overflow:auto;gap:14px}
.create h2{margin:0;color:var(--y);font-size:22px}
.create .sub{color:var(--dim);margin-top:-8px}
.opt .t{font-weight:700;font-size:18px;color:var(--c)}
.opt .d{color:var(--dim);font-size:15px;margin-top:2px}
.opt.sel{border-color:var(--y);background:linear-gradient(180deg,#26240a,#14140a)}
.opt.sel .t{color:var(--y)}
input.txt{width:100%;padding:12px 14px;background:#0c0c18;border:1px solid var(--line);color:var(--t);font:inherit;font-size:20px;outline:none;user-select:text;-webkit-user-select:text}
input.txt:focus{border-color:var(--c);box-shadow:0 0 12px #00f0ff44}
.attrrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #1b1b30}
.attrrow .nm{flex:1}.attrrow .nm b{display:block;color:var(--c);letter-spacing:.1em}.attrrow .nm i{font-style:normal;color:var(--dim);font-size:13px}
.pips{display:flex;gap:3px}.pip{width:10px;height:16px;background:#1d1d33;transform:skewX(-14deg)}.pip.on{background:var(--y);box-shadow:0 0 6px #fcee0a99}.pip.bonus{background:var(--g)}
.pm{width:38px;height:38px;border:1px solid var(--line);display:grid;place-items:center;font-size:22px;background:#12121f}
.pm:active{transform:scale(.9);border-color:var(--y)}

/* ---------- game ---------- */
.hud{padding:10px 12px 6px;display:flex;flex-direction:column;gap:6px;z-index:5}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.meter{position:relative;padding:4px 6px 6px;background:#0d0d19cc;border:1px solid var(--line);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}
.meter .lb{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.meter .lb b{font-size:15px;letter-spacing:0;color:var(--t)}
.bar{height:6px;background:#1b1b30;margin-top:3px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;transition:width .6s cubic-bezier(.2,.9,.2,1)}
.m-hp i{background:var(--hp);box-shadow:0 0 8px var(--hp)}.m-hum i{background:var(--hum);box-shadow:0 0 8px var(--hum)}.m-cred i{background:var(--cred);box-shadow:0 0 8px var(--cred)}
.m-ed .lb b{color:var(--ed)}
.m-ed .bar i{background:var(--ed);box-shadow:0 0 8px var(--ed)}
.meter .dot{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--t);opacity:0;transform:scale(0);transition:.2s}
.meter.pv .dot{opacity:1;transform:scale(1);box-shadow:0 0 8px #fff}
.meter.pv.big .dot{width:12px;height:12px}
.meter.warn{animation:warn 1s infinite}
@keyframes warn{50%{border-color:var(--m);box-shadow:0 0 14px #ff2a6d88}}
.meter.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.12)}}
.sub-hud{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim);letter-spacing:.08em}
.sub-hud .role{color:var(--y);text-transform:uppercase}
.float{position:fixed;z-index:70;font-weight:700;font-size:22px;pointer-events:none;text-shadow:0 0 10px currentColor,0 2px 0 #000;animation:flt 1.3s ease-out forwards}
@keyframes flt{from{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-8px) scale(1.15)}to{transform:translateY(-70px) scale(1);opacity:0}}

.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:4px 14px 0;position:relative;perspective:900px}
.speaker{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:6px;min-height:46px}
.portrait{width:52px;height:52px;flex:none;border:1px solid var(--c);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));background:#0b0b16;animation:pin .5s}
@keyframes pin{from{transform:scale(.6) rotate(-8deg);opacity:0}}
.speaker .nm{font-weight:700;font-size:20px;line-height:1}
.speaker .rl{color:var(--dim);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.cardwrap{width:100%;flex:1;min-height:0;position:relative;display:flex;align-items:stretch}
.card{position:relative;width:100%;touch-action:pan-y;display:flex;flex-direction:column;justify-content:center;padding:20px 18px;
  background:linear-gradient(160deg,#181830ee,#0d0d1cee);border:1px solid var(--line);
  clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px));
  box-shadow:0 0 40px #00000088;overflow:auto;animation:cin .45s cubic-bezier(.2,.9,.25,1.1);will-change:transform}
.card::before{content:'';position:absolute;left:0;top:0;width:4px;height:100%;background:var(--ac,var(--y));box-shadow:0 0 14px var(--ac,var(--y))}
.card .tag{font-size:12px;letter-spacing:.2em;color:var(--ac,var(--y));text-transform:uppercase;margin-bottom:8px}
.card .tx{font-size:19.5px;line-height:1.38}
.card .tx em{color:var(--c);font-style:normal}.card .tx strong{color:var(--y)}
.card.out{animation:cout .35s forwards}
@keyframes cin{from{opacity:0;transform:translateY(40px) rotateX(18deg) scale(.94)}}
@keyframes cout{to{opacity:0;transform:translateX(var(--ox,0)) rotate(var(--or,0)) scale(.9)}}
.swipelb{position:absolute;top:14px;max-width:48%;padding:6px 10px;background:#000c;border:1px solid var(--y);color:var(--y);font-weight:700;opacity:0;pointer-events:none;font-size:15px}
.swipelb.l{left:12px}.swipelb.r{right:12px;text-align:right}
.hint{font-size:12px;color:var(--dim);text-align:center;margin-top:4px;letter-spacing:.12em;min-height:16px}
.choices{display:flex;flex-direction:column;gap:8px;padding:8px 14px 8px;z-index:5}
.choice{display:flex;align-items:center;gap:10px;padding:11px 14px 11px 12px;animation:chin .4s both}
.choice:nth-child(2){animation-delay:.06s}.choice:nth-child(3){animation-delay:.12s}.choice:nth-child(4){animation-delay:.18s}
@keyframes chin{from{opacity:0;transform:translateY(16px)}}
.choice .k{width:24px;height:24px;flex:none;border:1px solid var(--dim);color:var(--dim);display:grid;place-items:center;font-size:13px}
.choice .tt{flex:1}.choice .tt b{display:block;font-weight:600;font-size:17px}.choice .tt small{color:var(--dim);font-size:13px}
.choice .bd{flex:none;font-size:13px;padding:2px 7px;border:1px solid var(--c);color:var(--c);font-weight:700}
.choice .bd.hi{border-color:var(--g);color:var(--g)}.choice .bd.lo{border-color:var(--m);color:var(--m)}
.choice.lock .tt small{color:var(--m)}
.dock{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px 8px 8px;border-top:1px solid var(--line);background:#0a0a14ee;z-index:5}
.dock button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);transition:.15s}
.dock button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.dock button:hover,.dock button:active{color:var(--y);transform:translateY(-2px)}
.dock button.alert{color:var(--m);animation:warn 1s infinite}

/* result */
.result{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:20px 18px;background:linear-gradient(160deg,#181830f5,#0d0d1cf5);border:1px solid var(--line);
  clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px));animation:cin .35s;overflow:auto;cursor:pointer}
.result .rt{font-size:19px;line-height:1.38}
.dice{display:flex;align-items:center;gap:14px}
.die{width:64px;height:64px;display:grid;place-items:center;font-size:30px;font-weight:700;font-family:'Orbitron',sans-serif;border:2px solid var(--c);color:var(--c);transform:rotate(45deg)}
.die span{transform:rotate(-45deg)}
.die.roll{animation:roll .12s infinite}
@keyframes roll{50%{transform:rotate(60deg) scale(.92)}}
.die.ok{border-color:var(--g);color:var(--g);box-shadow:0 0 22px #05ffa188}
.die.ko{border-color:var(--m);color:var(--m);box-shadow:0 0 22px #ff2a6d88}
.dice .info{font-size:14px;color:var(--dim)}.dice .info b{display:block;font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 9px;border:1px solid currentColor;font-weight:700;font-size:15px;animation:chp .4s both}
@keyframes chp{from{opacity:0;transform:scale(.4)}}
.chip.p{color:var(--g)}.chip.n{color:var(--m)}.chip.i{color:var(--c)}.chip.y{color:var(--y)}
.cont{color:var(--dim);text-align:center;font-size:13px;letter-spacing:.2em;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}

/* modal */
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:#000a;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:88%;display:flex;flex-direction:column;background:linear-gradient(180deg,#14142a,#0a0a14);border:1px solid var(--c);border-bottom:0;
  clip-path:polygon(0 18px,18px 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%);animation:up .3s cubic-bezier(.2,.9,.2,1)}
@keyframes up{from{transform:translateY(60%);opacity:0}}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.sheet header h3{margin:0;color:var(--y);font-size:19px}
.sheet .x{width:36px;height:36px;border:1px solid var(--line);font-size:20px}
.sheet .body{overflow:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:10px}
.sec{color:var(--c);font-size:12px;letter-spacing:.22em;text-transform:uppercase;margin-top:6px}
.item{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);background:#0f0f1d;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.item .in{flex:1}.item .in b{display:block}.item .in small{color:var(--dim);font-size:13px;display:block}
.item .pr{font-weight:700;color:var(--ed);white-space:nowrap}.item .pr.no{color:var(--m)}
.item.own{border-color:var(--g)}
.tagx{display:inline-block;font-size:11px;padding:0 6px;border:1px solid var(--m);color:var(--m);margin-right:4px}
.tagx.g{border-color:var(--g);color:var(--g)}.tagx.y{border-color:var(--y);color:var(--y)}.tagx.c{border-color:var(--c);color:var(--c)}
.map{width:100%;background:#080812;border:1px solid var(--line)}
.map rect{stroke:#000;stroke-width:1.5;cursor:pointer;transition:filter .2s,opacity .2s}
.map rect:hover{filter:brightness(1.5)}
.map text{font-size:8.5px;fill:#fff;pointer-events:none;font-weight:700;text-shadow:0 1px 2px #000}
.map .ward{font-size:9px;fill:#ffffff55;letter-spacing:.3em}
.leg{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:12px;color:var(--dim)}.leg i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:middle}
.bigbar{height:10px;background:#1b1b30;position:relative}.bigbar i{position:absolute;inset:0 auto 0 0}
.log{font-size:14px;color:#b9b9d6;padding:6px 0;border-bottom:1px dashed #23233a}.log b{color:var(--y);margin-right:6px}

/* end */
.end{padding:22px 18px;overflow:auto;align-items:center;gap:12px;text-align:center}
.end h1{margin:6px 0 0;font-size:34px;line-height:1}
.end .ep{color:var(--dim);font-style:italic;max-width:420px}
.score{font-family:'Orbitron',sans-serif;font-size:56px;color:var(--y);text-shadow:0 0 22px #fcee0a88}
.brk{width:100%;max-width:420px;text-align:left}
.brk div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #1b1b30;font-size:16px}
.brk div b{color:var(--c)}
.newbest{color:var(--g);letter-spacing:.3em;animation:blink 1s infinite}

/* states */
.lowhum .stage,.lowhum .hud{animation:jit 3s infinite steps(1)}
@keyframes jit{0%,93%,100%{transform:none;filter:none}94%{transform:translateX(-3px);filter:hue-rotate(90deg)}96%{transform:translateX(3px) skewX(2deg);filter:saturate(2)}98%{transform:none}}
.shake{animation:shk .45s}
@keyframes shk{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,2px)}}
.toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);z-index:90;padding:10px 18px;background:#000d;border:1px solid var(--y);color:var(--y);font-weight:700;letter-spacing:.1em;text-transform:uppercase;animation:toast 2.6s forwards;text-align:center;max-width:90%}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media (min-width:700px){.screen{border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 80px #00f0ff10}}
@media (max-height:700px){.card .tx{font-size:17.5px}.choice{padding:8px 12px}.portrait{width:42px;height:42px}.speaker{min-height:38px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}

/* ---- UX v2 ---- */
.blocs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bloc{padding:0;text-align:left;font-size:9.5px;letter-spacing:.14em;color:var(--dim);position:relative}
.bloc .bb{height:4px;margin-top:2px;background:linear-gradient(90deg,#ff2a6d55,#ffffff12 25%,#ffffff12 75%,#ff2a6d55);position:relative}
.bloc .bb::after{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#ffffff55}
.bloc .bb i{position:absolute;top:-3px;width:8px;height:10px;margin-left:-4px;transform:skewX(-14deg);transition:left .6s cubic-bezier(.2,.9,.2,1);box-shadow:0 0 8px currentColor}
.bloc.dg{color:var(--m);animation:warn 1s infinite}
.bloc.pv span{color:#fff;text-shadow:0 0 8px #fff}.bloc.pv::after{content:'';position:absolute;right:0;top:0;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff}
.sheet.full{max-height:96%;height:96%}
.sheet header .bk{margin-right:10px;font-size:26px;line-height:1}
.sheet header h3{flex:1}
.sticky{position:sticky;top:-4px;z-index:3;background:#10102a;padding:6px 0 8px;margin:0 -4px;display:flex;flex-direction:column;gap:8px}
.vstat{display:flex;gap:14px;align-items:center;padding:8px 12px;background:#0c0c1a;border:1px solid var(--line);font-weight:700}
.vstat b{margin-left:auto}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tiles.one{grid-template-columns:1fr}.tiles.three{grid-template-columns:repeat(3,1fr)}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;text-align:left;border:1px solid var(--line);background:linear-gradient(180deg,#191934,#10101f);
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);transition:transform .12s,border-color .15s,filter .15s;min-height:92px}
.tile:hover{border-color:var(--c);filter:brightness(1.2)}.tile:active{transform:scale(.96)}
.tile .ti{font-size:26px;line-height:1}.tile b{font-size:17px;margin-top:4px}.tile small{color:var(--dim);font-size:12.5px;line-height:1.2}
.tile[disabled]{opacity:.35;pointer-events:none}
.tile.rec{border-color:var(--g);box-shadow:0 0 16px #05ffa133}.tile em{position:absolute;top:8px;right:14px;font-size:10px;font-style:normal;color:var(--g);letter-spacing:.12em;text-transform:uppercase}
.tiles.three .tile{min-height:104px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.fchips.wrap{flex-wrap:wrap;overflow:visible}
.fchips::-webkit-scrollbar{display:none}
.fc{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;font-size:13px;color:var(--dim);background:#0f0f1d;display:inline-flex;align-items:center;gap:6px}
.fc i{width:9px;height:9px;border-radius:50%;display:inline-block}.fc.on{background:var(--y);color:#111;border-color:var(--y);font-weight:700}
.buy{flex:none;padding:9px 14px;font-weight:700;border:1px solid var(--g);color:var(--g);background:#05ffa114;white-space:nowrap;transition:.12s}
.buy:active{transform:scale(.94)}.buy.no{border-color:var(--line);color:var(--dim);background:none}
.own-t{color:var(--g);font-size:12px;letter-spacing:.12em}

card({id:`st_intro`,who:`narr`,tag:`Street Kid · Prologue`,story:true,at:[2070,0],
  tx:()=>({
    heywood:`<strong>Heywood.</strong> Le barrio sent la friture et l'encens. {n}, à 18 ans, tu connais déjà tous les raccourcis de Wellsprings et le nom de chaque Valentino qui passe devant l'église. Mama Welles te garde un plat chaud au <em>Coyote Cojo</em>, mais l'argent des courses ne suffit plus.`,
    watson:`<strong>Watson.</strong> Entre les néons de Kabuki et le métal rouillé de Northside, {n}, tu as appris à regarder le monde sans qu'il te voie. Un seul loyer à payer, un seul appartement à toi : une cage à lapins de six mètres carrés en haut d'un mégabuilding.`,
    santo:`<strong>Santo Domingo.</strong> Arroyo, murs de béton et drapeaux US fanés. {n}, tu as grandi entre les patrouilles de la 6th Street et les cris des Animals de Rancho Coronado. Ici, on apprend vite à courir… ou à frapper.`
  })[G.sub]||`Night City t'a avalé(e).`,
  ch:[
    {t:`Piquer un sac sur le marché`,s:`REF · risque de bagarre`,chk:{a:`ref`,dc:6,
       ok:{ed:260,cred:2,msg:`Rapide, silencieux. Tu es déjà loin quand le propriétaire hurle.`},
       ko:{hp:-12,cred:-1,msg:`Une poigne de fer te rattrape. Un coup de poing, un peu de sang, ta fierté en miettes.`}}},
    {t:`Chercher du boulot chez les fixers`,s:`SANG-FROID · prudent`,chk:{a:`cool`,dc:5,
       ok:{ed:180,cred:2,role:{fixer:1},next:`st_intro2`,msg:`Tu te fais remarquer par un type qui sait organiser les choses. Un début.`},
       ko:{ed:30,msg:`On te rit au nez. Mais tu repars avec un nom en tête.`,next:`st_intro2`}}},
    {t:`Rester dans l'ombre, économiser`,s:`+ Humanité`,fx:{hum:5,ed:60,msg:`Une soupe de nouilles, une nuit tranquille. Même Night City te laisse respirer, parfois.`}}
  ]});
card({id:`st_intro2`,who:`dex`,tag:`Premier contact`,once:true,
  tx:`Un type en lunettes noires t'observe à l'<em>Afterlife</em>. « T'as le regard de ceux qui n'ont plus peur de grand-chose, gamin. Moi, c'est <strong>Dexter DeShawn</strong>. Je peux te trouver des petits boulots. Rien de sale. Enfin, presque. »`,
  ch:[
    {t:`Accepter ses services`,s:`Contact fixer : Dex`,fx:{flag:[`dex`],rel:{dex:12},cred:3,ed:200,msg:`« Bienvenue dans le jeu. Un conseil : ne te vends jamais, ne t'excuse jamais. »`}},
    {t:`Refuser, tu es indépendant(e)`,s:`SANG-FROID +`,fx:{cred:1,at:{cool:1},msg:`« Fier(e), hein ? Reviens quand tu auras faim. » Il disparaît dans la foule.`}}
  ]});
card({id:`co_intro`,who:`corpo`,tag:`Corpo · Prologue`,story:true,at:[2070,0],
  tx:()=>`<strong>Corpo Plaza.</strong> {n}, premier jour comme stagiaire chez <em>${FAC[G.sub].n}</em>. Costume, badge, sourire. Ton supérieur te file un dossier : « Ici, on n'est pas payés pour penser, mais pour obéir. Mais les ambitieux vont vite. » Il te regarde. « Tu es ambitieux ? »`,
  ch:[
    {t:`Obéir, sourire, monter les échelons`,s:`Salaire stable`,fx:{flag:[`corpjob`],ed:600,cred:1,role:{corpo:2},msg:`Tu apprends le jeu : réunions, rapports, et regards en coin. Un salaire tombe, régulier.`}},
    {t:`Lire le dossier en douce`,s:`INTELLECT · risque`,chk:{a:`int`,dc:6,
       ok:{flag:[`corpjob`,`secret`],ed:300,at:{int:1},role:{corpo:1},next:`co_intro2`,msg:`Tu découvres un transfert illégal vers un compte offshore. Ça peut valoir très cher.`},
       ko:{flag:[`corpjob`],ed:100,cred:-1,msg:`Ton supérieur t'a vu. Un avertissement, et ton nom sur une liste.`}}},

  ]});
card({id:`co_intro2`,who:`corpo`,tag:`Information sensible`,once:true,
  tx:`Le compte offshore appartient à un cadre de ta division. Il détourne des fonds vers une cellule de mercenaires qui sabote la concurrence. Tu tiens quelque chose de gros entre les mains.`,
  ch:[
    {t:`Le dénoncer en interne`,s:`Rep corpo +`,fx:{ed:900,cred:2,flag:[`corpjob`],role:{corpo:2},msg:`Promu pour ta loyauté. Mais certains te regardent d'un sale œil.`}},
    {t:`Le faire chanter`,s:`COOL · gros gain`,chk:{a:`cool`,dc:7,
       ok:{ed:3000,cred:3,role:{fixer:2},msg:`Il paie sans broncher. Une fois. Puis deux. Tu as un tout nouveau train de vie.`},
       ko:{hp:-30,ed:-300,cred:-2,msg:`Il avait des gars. Deux costards-cravate te cassent les côtes dans un parking.`}}},
    {t:`Vendre l'info à un fixer`,s:`Le monde de l'ombre`,fx:{ed:1200,cred:3,role:{fixer:2},flag:[`dex`],msg:`Dex te sourit. « T'as un instinct pour ça. »`}}
  ]});
card({id:`no_intro`,who:`nomad`,tag:`Nomade · Prologue`,story:true,at:[2070,0],
  tx:()=>`<strong>Badlands.</strong> Le soleil tape sur le toit du convoi. {n}, tu sais piloter avant de savoir lire. Les ${G.sub===`aldecaldos`?`Aldecaldos de Saul Bright`:G.sub===`wraiths`?`Wraiths, durs et rapides`:`routes sans clan`} sont ta famille — ou ta cage. À l'horizon, les tours de Night City scintillent comme une promesse.`,
  ch:[
    {t:`Partir pour Night City, tenter ta chance`,s:`Nouveau départ`,fx:{cred:2,ed:200,flag:[`incity`],role:{nomad:1},msg:`Tu laisses la poussière derrière toi. La ville te happe en moins d'une heure.`}},
    {t:`Rester avec le clan, devenir pilote`,s:`CORPS/RÉFLEXES +`,fx:{at:{ref:1},cred:1,role:{nomad:3},msg:`Un convoi, une réputation. Les anciens te confient les clés des gros Thorton.`,next:`no_intro2`}},
    {t:`Proposer des réparations aux autres convois`,s:`TECHNIQUE +`,fx:{at:{tech:1},ed:250,role:{tech:2},msg:`Tu rends des services. Les moteurs t'aiment. Certains payent bien.`}}
  ]});
card({id:`no_intro2`,who:`panam`,tag:`Convoi sous attaque`,once:true,
  tx:`Les Raffen Shiv surgissent sur la crête, hurlant. Ton convoi est coincé entre deux dunes. Quelqu'un crie ton nom : on a besoin de toi, maintenant.`,
  ch:[
    {t:`Écraser l'accélérateur, forcer le passage`,s:`RÉFLEXES · conduite`,chk:{a:`ref`,k:`drv`,dc:7,

    {t:`Descendre et tirer`,s:`CORPS · combat`,chk:{a:`body`,k:`cmb`,dc:7,
      ok:{cred:6,ed:300,role:{solo:2},msg:`Un à un, ils tombent. Le sable boit leur sang. On te regarde autrement.`},

  ]});

  tx:`Une course sur la route des Badlands, mise : <strong>1 500 €$</strong>. Les gagnants repartent avec le tout, les perdants avec les dents cassées.`,
  ch:[
    {t:`Participer`,s:`RÉFLEXES · conduite`,chk:{a:`ref`,k:`drv`,dc:8,ok:{ed:3000,cred:7,msg:`Tu coupes la ligne en premier, hurlant de joie. La route est à toi.`},ko:{hp:-28,ed:-400,cred:-1,msg:`Dérapage dans un virage. Tu finis dans un fossé, la voiture en feu.`}}},
    {t:`Parier sur un autre`,s:`−300 €$`,req:R.ed(300),chk:{a:`cool`,dc:5,ok:{ed:600,msg:`Ton favori gagne. Les gains te rendent le sourire.`},ko:{ed:-300,msg:`Tu perds tout. Le favori a crevé à mi-course.`}}},
    {t:`Regarder depuis le bord`,fx:{hum:2}}
  ]});
card({id:`scavs`,who:`scav`,tag:`Scavs`,w:3,
  tx:`Des charognards fouillent un corps au bord de la route : bistouris, glacière, seringues. Un enfant te regarde, immobile, au milieu de leur camionnette. Les Scavs revendent les organes aux ripperdocs sans scrupule.`,
  ch:[
    {t:`Les attaquer pour libérer l'enfant`,s:`CORPS · combat`,chk:{a:`body`,k:`cmb`,dc:8,ok:{cred:8,hum:10,ed:200,msg:`Tu les mets en déroute. L'enfant te murmure un merci que tu n'oublieras jamais.`},ko:{hp:-32,cred:1,hum:3,msg:`Ils te frappent à terre mais l'enfant s'enfuit grâce à toi.`}}},
    {t:`Fermer les yeux et partir`,s:`−Humanité`,fx:{hum:-9,msg:`Tu marches sans te retourner. Mais l'image ne te quittera plus.`}},
    {t:`Les payer pour qu'ils le relâchent`,s:`−500 €$`,req:R.ed(500),fx:{ed:-500,hum:7,cred:2,msg:`Pour eux, un enfant est une marchandise. Pour toi, une dette réglée.`}}
  ]});
card({id:`malfunction`,who:`narr`,tag:`Panne de chrome`,w:4,cond:()=>G.cyber.length>=1,
  tx:`Ton implant se bloque en pleine rue. Un grésillement sous la peau, une douleur électrique dans la nuque. Les cyberwares cheap sont souvent fragiles.`,
  ch:[
    {t:`Courir chez un ripperdoc`,s:`−250 €$`,req:R.ed(250),fx:{ed:-250,hp:15,msg:`Quelques coups de tournevis, un recalibrage, et tout redémarre.`}},
    {t:`Le réparer toi-même`,s:`TECHNIQUE`,chk:{a:`tech`,dc:6,ok:{at:{tech:1},msg:`Un fil ici, une soudure là. Tu comprends mieux ton propre corps.`},ko:{hp:-22,hum:-4,msg:`Mauvaise connexion. Tu pleures de douleur un long moment.`}}},
    {t:`Serrer les dents`,s:`CORPS`,chk:{a:`body`,dc:5,ok:{cred:1,msg:`Ça passe. À force d'insister, tu te sens presque invincible.`},ko:{hp:-16,hum:-3,msg:`La douleur persiste des heures.`}}}
  ]});
card({id:`ncpd_sting`,who:`ncpd`,tag:`NCPD · Contrôle`,w:3,cond:()=>G.cred>=10&&G.member!==`ncpd`,
  tx:`Une patrouille NCPD te coince : « Papiers. Ces implants, ils sont déclarés ? » Dans le monde de Night City, la police a ses prix et tu le sais.`,
  ch:[
    {t:`Graisser la patte`,s:`−400 €$`,req:R.ed(400),fx:{ed:-400,bloc:{loi:-5},msg:`« Bonne soirée, citoyen. » Sans bruit, ils s'effacent.`}},
    {t:`Argumenter`,s:`SANG-FROID`,chk:{a:`cool`,dc:7,ok:{cred:2,msg:`Tu connais tes droits. Les agents hésitent et te laissent partir.`},ko:{hp:-12,ed:-150,cred:-1,msg:`Ils n'aiment pas les petits malins. Tu passes la nuit en cellule.`}}},
    {t:`Fuir`,s:`RÉFLEXES`,chk:{a:`ref`,dc:7,ok:{cred:2,msg:`Tu files dans un cul-de-sac, escalades, disparais.`},ko:{hp:-20,ed:-200,msg:`Un taser dans le dos. Ça fait mal.`}}}
  ]});
card({id:`partner`,who:`lover`,tag:`Rencontre`,w:3,once:true,cond:()=>G.age>=22&&G.hum>=40,
  tx:`Au détour d'un noodle stand sous la pluie, quelqu'un te prête son parapluie. Un sourire fatigué, un regard sans fard, une conversation sans mensonge. Dans cette ville, c'est rare.`,
  ch:[
    {t:`Passer la soirée ensemble`,s:`+Humanité · Lien`,fx:{hum:14,ed:-60,flag:[`partner`],msg:`Vous parlez pendant des heures. Pour la première fois depuis longtemps, tu ris sans arrière-pensée.`}},
    {t:`Poursuivre ta route`,s:`Rester seul(e)`,fx:{cred:1,msg:`Tu salues d'un geste vague. Tu ne reverras peut-être jamais cette personne.`}}
  ]});
card({id:`old_friend`,who:`fix`,tag:`Un vieil ami`,w:3,cond:()=>G.age>=24,
  tx:`Un ami d'enfance te rattrape, couvert de dettes. « Je suis dans la merde. 1 500 balles, ou les gars me coupent un doigt. T'es la seule personne en qui j'ai confiance. »`,
  ch:[
    {t:`Lui donner l'argent`,s:`−1 500 €$`,req:R.ed(1500),fx:{ed:-1500,hum:10,cred:2,msg:`Il pleure presque de gratitude. Cet argent te reviendra peut-être un jour.`}},
    {t:`Régler ses dettes à ta façon`,s:`CORPS · combat`,chk:{a:`body`,k:`cmb`,dc:7,ok:{cred:6,hum:5,msg:`Tu discutes avec ses créanciers. Ils comprennent vite.`},ko:{hp:-25,msg:`Trop nombreux. Il est quand même sauvé, mais tu paies de ta peau.`}}},
    {t:`L'abandonner`,s:`−Humanité`,fx:{hum:-9,msg:`Tu détournes le regard. Il n'a plus de mots. Toi non plus.`}}
  ]});
card({id:`jackie`,who:`jackie`,tag:`El Coyote Cojo`,w:4,cond:()=>yr()>=2072&&yr()<=2076,
  tx:`Un grand gaillard rieur t'attrape par l'épaule : « Jackie Welles ! Heywood, quoi ! Tu viens manger chez ma mère ? Elle fait le meilleur mole du quartier. » Dans son sourire, il n'y a rien de faux.`,
  ch:[
    {t:`Dîner chez Mama Welles`,s:`+Humanité`,fx:{hum:10,ed:-40,fac:{valentinos:4},flag:[`jackie`],rel:{jackie:12,mama:8},msg:`Mama Welles remplit ton assiette, te demande si tu manges assez. Tu te sens chez toi.`}},
    {t:`Boire un verre avec lui`,fx:{hum:5,cred:2,rel:{jackie:8},msg:`Un bar enfumé, des histoires de braquages ratés. Jackie rêve d'un grand coup, d'une vie meilleure.`}},
    {t:`Décliner`,fx:{}}
  ]});
card({id:`sasquatch`,who:`sas`,tag:`Rancho Coronado · Combat`,w:3,cond:()=>A(`body`)>=5,
  tx:`Les Animals t'invitent à leur salle de sport clandestine. Un combat à mains nues : <strong>2 000 €$</strong> au vainqueur. Sasquatch observe, impassible, les bras croisés.`,
  ch:[
    {t:`Monter sur le ring`,s:`CORPS`,chk:{a:`body`,dc:8,ok:{ed:2000,cred:6,fac:{animals:10},msg:`Un crochet à la mâchoire, le géant s'écroule. La salle explose. Sasquatch hoche la tête.`},ko:{hp:-30,cred:1,msg:`Tu te fais broyer. Mais tu as tenu trois rounds : respect.`}}},
    {t:`Observer`,fx:{}}
  ]});
card({id:`kerry_concert`,who:`kerry`,tag:`Concert de Kerry Eurodyne`,w:3,cond:()=>yr()>=2072,
  tx:`Kerry Eurodyne remplit une salle de Westbrook. Entre deux accords, il crie : « Samurai, c'était nous ! Ne laissons personne décider de nos vies ! » Le public hurle. Quelqu'un te tend un pass backstage.`,
  ch:[
    {t:`Aller backstage`,s:`SANG-FROID`,chk:{a:`cool`,dc:7,ok:{cred:6,hum:4,role:{rocker:2},flag:[`kerry`],rel:{kerry:14},msg:`Tu discutes avec la légende. Il te donne un médiator signé.`},ko:{cred:1,msg:`Les gardes te refusent l'entrée. Mais la musique te reste.`}}},
    {t:`Rester dans le public`,s:`+Humanité`,fx:{hum:8,msg:`Le son fait vibrer ta poitrine. Tu pleures sans savoir pourquoi.`}}
  ]});
card({id:`johnny_graffiti`,who:`johnny`,tag:`Légende Samurai`,w:3,cond:()=>yr()>=2070,
  tx:`Sur un mur de Kabuki, un graffiti : <em>"SAMURAI — NEVER FADE AWAY"</em>. Les anciens parlent du concert de 2023, de la bombe sur la Tour Arasaka, de Johnny Silverhand, mort ou disparu, personne ne sait vraiment.`,
  ch:[
    {t:`Peindre une étoile à côté`,s:`+Street Cred · Arasaka rancune`,fx:{cred:3,hum:4,fac:{arasaka:-8},msg:`Un geste simple, un clin d'œil à l'histoire. Les vieux te saluent en passant.`}},
    {t:`Ignorer. Les héros, ça n'existe pas.`,fx:{msg:`Tu passes ton chemin. Night City n'a pas besoin de martyrs.`}},
    {t:`Prendre une photo pour les nostalgiques`,fx:{ed:60,cred:1}}
  ]});

/* ============================ HISTOIRE (dates) ============================ */
card({id:`maine_crew`,who:`maine`,tag:`2076 · Edgerunners`,story:true,at:[2076,0],
  tx:`À l'Afterlife, une table bruyante : <strong>Maine</strong> et sa crew — David, Lucy, Rebecca, Pilar, Kiwi, Dorio, Falco. Maine te tape l'épaule : « T'as une tête de gars qui connaît les boulots à haut risque. Un coup gros comme un immeuble. Une place libre, ça t'intéresse ? »`,
  ch:[
    {t:`Rejoindre la crew pour un run`,s:`Risque très élevé · Gain énorme`,fx:{flag:[`maine`],cred:8,ed:3500,role:{solo:3},next:`maine_fall`,msg:`Tu serres la main de Maine, tu croises le regard de David. Le coup est lancé.`}},
    {t:`Refuser, les gros coups finissent mal`,s:`Prudence`,fx:{cred:2,hum:3,msg:`« Comme tu veux. Mais tu vas rater quelque chose, choom. »`}},
    {t:`Demander à voir David`,s:`Lucy et David`,fx:{hum:5,cred:3,msg:`David est jeune, tendu, avec un sourire timide. Lucy t'observe comme si elle voyait déjà ton avenir.`}}
  ]});
card({id:`maine_fall`,who:`smasher`,tag:`2076 · Adam Smasher`,once:true,
  tx:`Le braquage de la Tour Arasaka dérape. Les alarmes hurlent, les portes se ferment. Derrière le feu, une silhouette titanesque : <strong>Adam Smasher</strong>, cyborg intégral d'Arasaka. Maine est à terre, Dorio hurle, Falco n'est plus un nom. David te crie de fuir.`,
  ch:[
    {t:`Courir, ne pas se retourner`,s:`RÉFLEXES · fuite`,chk:{a:`ref`,dc:9,ok:{cred:12,hum:-8,ed:1000,msg:`Tu cours dans la fumée. Derrière toi, les cris. Tu survis. Peu d'autres y arrivent.`},ko:{hp:-60,hum:-10,cred:4,msg:`Une balle, puis une autre. Tu survives par miracle, mais tu portes cette nuit dans ta chair.`}}},
    {t:`Couvrir la fuite de David`,s:`Sacrifice · peut être fatal`,chk:{a:`body`,k:`cmb`,dc:10,ok:{cred:20,hum:6,msg:`Tu retiens Smasher assez longtemps pour que David et Lucy disparaissent. On parlera de toi à l'Afterlife pendant des années.`},ko:{hp:-80,cred:25,hum:-6,msg:`Smasher te saisit et te brise comme une poupée. Tu as tenu assez longtemps pour que David et Lucy disparaissent. Tu t'en sors à peine.`}}},
    {t:`Hacker les portes pour tous`,s:`Cyberdeck · INT`,req:R.deck(),chk:{a:`int`,k:`hck`,dc:9,ok:{cred:15,role:{net:3},msg:`Les portes s'ouvrent, l'équipe s'échappe. Tu viens de sauver des vies.`},ko:{hp:-45,hum:-8,msg:`Le pare-feu d'Arasaka te grille la nuque. Tu t'en sors de justesse.`}}}
  ]});
card({id:`konpeki_rumor`,who:`dex`,tag:`2077 · Konpeki Plaza`,story:true,at:[2077,2],
  tx:`À l'Afterlife, tout le monde parle d'un coup monstre à la <em>Konpeki Plaza</em>. Dex a engagé une jeune merc, <strong>V</strong>, et Jackie Welles pour braquer l'hôtel d'Arasaka pendant que Saburo y est invité. Dex te regarde : « J'ai besoin de quelqu'un en couverture. Pas dans l'équipe principale, mais assez près. »`,
  ch:[
    {t:`Accepter de faire la couverture`,s:`Risque · gros gain`,chk:{a:`cool`,dc:8,ok:{ed:3000,cred:10,flag:[`konpeki`],msg:`Tu surveilles la rue pendant que la tour brûle d'un autre feu. Plus tard, tu apprends que le coup a mal tourné.`},ko:{hp:-30,cred:3,msg:`La sécurité Arasaka te repère. Tu t'enfuis, blessé(e), sans pouvoir aider personne.`}}},
    {t:`Refuser, trop dangereux`,fx:{cred:1,hum:3,msg:`« Sage. Parfois, la vie vaut plus qu'une légende. »`}}
  ]});
card({id:`saburo`,who:`narr`,tag:`2077 · Saburo Arasaka`,story:true,at:[2077,4],
  tx:`Les écrans de Night City s'illuminent : <em>Saburo Arasaka est mort.</em> La rumeur parle d'un assassinat à la Konpeki Plaza. Arasaka vacille, Militech jubile, Hanako Arasaka prend la scène. Les rues bruissent.`,
  ch:[
    {t:`Profiter du chaos pour piller un entrepôt`,s:`Risqué`,chk:{a:`ref`,dc:8,ok:{ed:2500,cred:6,hum:-3,msg:`Une camionnette entière d'armes de contrebande. Tu es riche, d'un coup.`},ko:{hp:-24,cred:0,msg:`Les gardes sont encore là. Tu t'en sors à peine.`}}},
    {t:`Vendre l'info aux fixers`,s:`INTELLECT`,chk:{a:`int`,dc:7,ok:{ed:1800,cred:5,role:{fixer:2},msg:`Dex et Wakako s'arrachent tes infos. Tu mets les pieds dans un jeu énorme.`},ko:{ed:200,msg:`Trop d'infos circulent. La tienne ne vaut plus rien.`}}},
    {t:`Observer et attendre`,fx:{hum:2,cred:1}}
  ]});
card({id:`arasaka_assault`,who:`takemura`,tag:`2077 · Tour Arasaka`,story:true,at:[2077,7],
  tx:`Alerte rouge sur tous les réseaux : un assaut sur la <strong>Tour Arasaka</strong>. Des mercenaires, des nomades, des anciens, tous visent le même cœur. Les Aldecaldos, dit-on, forment un convoi. Rogue est de la partie. Des rumeurs parlent de Johnny Silverhand, de Soulkiller, du Blackwall. Tu as le choix.`,
  ch:[
    {t:`Rejoindre l'assaut`,s:`Risque extrême`,chk:{a:`body`,k:`cmb`,dc:10,ok:{cred:22,ed:4000,hum:-6,role:{solo:3},flag:[`assault`],msg:`Dans la fumée des tours, tu te bats à côté des légendes. Quand la poussière retombe, tu es toujours debout.`},ko:{hp:-70,cred:8,hum:-6,msg:`Tu survis à un enfer. Beaucoup tombent à tes côtés. Tu t'en sors, couvert(e) de sang.`}}},
    {t:`Aider à distance, en piratant`,s:`Cyberdeck · INT`,req:R.deck(),chk:{a:`int`,k:`hck`,dc:9,ok:{cred:20,ed:3000,role:{net:3},flag:[`assault`],msg:`Tu perces les caméras, ouvres les portes. Quelqu'un te remercie dans un canal chiffré.`},ko:{hp:-25,hum:-6,msg:`Les défenses d'Arasaka te mordent la nuque. Tu coupes la liaison, hagard(e).`}}},
    {t:`Rester à l'écart, observer de loin`,s:`Prudent`,fx:{cred:2,hum:3,msg:`Tu regardes la fumée monter sur Night City. Une époque se termine, tu le sens.`}}
  ]});
card({id:`afterwar`,who:`hanako`,tag:`2078 · Après la tempête`,story:true,at:[2078,0],
  tx:`Un an plus tard, Night City panse ses plaies. La Tour Arasaka est un chantier, Militech et NUSA se partagent les juteux contrats de reconstruction. Les gangs repoussent les frontières. La rue appelle toujours son lot de nouveaux visages.`,
  ch:[
    {t:`Profiter du vide pour s'enrichir`,s:`Gros gain`,fx:{ed:2000,cred:3,msg:`Tu te places entre les entrepreneurs et les gangs. Rien d'illégal… ou presque.`}},
    {t:`Poursuivre ta propre route`,fx:{cred:2,hum:3}},
    {t:`Chercher des vieux amis`,fx:{hum:6,msg:`Certains ont disparu, d'autres sont devenus des rumeurs. Quelques-uns te sourient quand même.`}}
  ]});
card({id:`dogtown`,who:`hansen`,tag:`Dogtown · Barghest`,story:true,at:[2077,10],
  tx:`Dogtown, au fond de Pacifica : l'ancien complexe militaire est devenu un état dans l'état. Le colonel <strong>Kurt Hansen</strong> et ses Barghest tiennent les remparts. La NUSA a besoin de ses mercenaires, et lui a besoin d'opérateurs capables.`,
  ch:[
    {t:`Entrer à Dogtown, tenter ta chance`,s:`Débloque Dogtown`,chk:{a:`cool`,dc:8,ok:{flag:[`dogtown`],cred:6,ed:1500,msg:`Les Barghest te laissent passer. Le quartier te fascine : ruines, néons, et un silence qui pèse.`},ko:{hp:-20,cred:1,msg:`On t'écarte à coups de crosse. Mais l'idée de Dogtown continue de te hanter.`}}},
    {t:`Rester à Night City`,fx:{}}
  ]});

/* ============================ ÉTATS CRITIQUES ============================ */
card({id:`hum_warn`,who:`doc`,tag:`⚠ Humanité critique`,w:30,cond:()=>G.hum<45&&G.hum>=20,
  tx:`Tu entends des voix dans le métro. Ta main tremble quand tu la regardes, comme si elle appartenait à un autre. Un doc te dit sans détour : « Tu as trop de chrome, trop peu d'âme. La cyberpsychose te guette. Si tu craques, MaxTac ne te ratera pas — et la Trauma Team ne viendra pas. »`,
  ch:[
    {t:`Suivre une thérapie`,s:`−500 €$ · +Humanité`,req:R.ed(500),fx:{ed:-500,hum:22,msg:`Immunoblockers, séances, sommeil. Doucement, ton esprit remonte.`}},
    {t:`Prendre un calmant illégal`,s:`+Humanité faible`,fx:{ed:-100,hum:10,hp:-8,msg:`La drogue chasse les voix, mais te laisse nauséeux(se).`}},
    {t:`Continuer, ça ira`,s:`Danger`,fx:{hum:-5,cred:2,msg:`Tu serres la mâchoire. Dans le miroir, quelqu'un te sourit trop largement.`}}
  ]});
card({id:`maxtac`,who:`maxtac`,tag:`⚠ MaxTac`,w:60,cond:()=>G.hum<20,
  tx:`Un hélicoptère noir survole ton toit. Des projecteurs, une voix : « Citoyen, mettez-vous à genoux. » MaxTac. Tu as dépassé un certain seuil, et le monde le sait.`,
  ch:[
    {t:`Supplier, dire que tu es en traitement`,s:`SANG-FROID`,chk:{a:`cool`,dc:9,ok:{hum:12,cred:-3,ed:-800,msg:`Ils te laissent partir avec un rappel à l'ordre et une amende. Tu survis à ça.`},ko:{die:`psycho`,msg:`« Cible hostile. » Tu n'entends même pas la détonation.`}}},
    {t:`Résister`,s:`CORPS · combat`,chk:{a:`ref`,k:`cmb`,dc:11,ok:{hp:-40,hum:-5,cred:10,msg:`Contre toute attente, tu sautes d'un toit et disparais dans la nuit. MaxTac te cherche encore.`},ko:{die:`psycho`,msg:`MaxTac ne te laisse aucune chance.`}}},
    {t:`Te rendre à la clinique de Vik`,s:`−1 500 €$`,req:R.ed(1500),fx:{ed:-1500,hum:25,msg:`Vik t'extrait des implants fous et te recoud. Tu perds du chrome… et gagnes du temps.`}}
  ]});
card({id:`sandy_overload`,who:`doc`,tag:`Surcharge nerveuse`,w:8,cond:()=>hasCy(`sandy`)||hasCy(`apogee`),
  tx:`Ton Sandevistan s'emballe : le monde ralentit, mais ton corps lâche. Du sang coule de ton nez. « C'est le prix, » dit le doc. « Un peu de repos ou un recalibrage, sinon tu cuis de l'intérieur. »`,
  ch:[
    {t:`Te reposer`,s:`+Santé · +Humanité`,fx:{hp:25,hum:6,ed:-120,msg:`Tu dors. Le monde reprend sa vitesse normale.`}},
    {t:`Le pousser encore`,s:`Risque mortel`,chk:{a:`body`,dc:8,ok:{cred:8,msg:`Un boulot brillant. Tu es en vie, mais tout vibre en toi.`},ko:{hp:-45,hum:-6,msg:`Ton système nerveux fume. Tu tiens à peine debout.`}}}
  ]});
card({id:`loan_shark`,who:`fix`,tag:`Créanciers`,w:50,cond:()=>G.ed<0,
  tx:`Tu dois de l'argent. Pas à n'importe qui : à des gens qui savent comment vous retrouver. Deux types t'attendent devant ta porte, leur sourire n'a rien d'amical.`,
  ch:[
    {t:`Leur proposer un boulot pour rembourser`,s:`SANG-FROID`,chk:{a:`cool`,dc:7,ok:{ed:1500,cred:2,msg:`Tu acceptes un petit contrat pour eux. Tes dettes se réduisent.`},ko:{hp:-26,ed:-300,msg:`Ils te cassent le bras pour l'exemple.`}}},
    {t:`Vendre un implant à un ripperdoc`,s:`Perte de chrome`,req:()=>G.cyber.length?``:`Aucun implant`,fx:{fn:`sellOne`,msg:`Un implant en moins, des dettes en moins. Vik pleurera ton corps.`}},
    {t:`Fuir en espérant les semer`,s:`RÉFLEXES`,chk:{a:`ref`,dc:8,ok:{ed:0,cred:-1,msg:`Tu disparais dans les rues. Mais ils chercheront encore.`},ko:{hp:-30,ed:-400,msg:`Ils te rattrapent. Ça se passe mal.`}}}
  ]});

/* ============================ NETRUNNING ============================ */
card({id:`blackwall`,who:`brick`,tag:`Voodoo Boys · Blackwall`,w:5,cond:()=>hasDeck()&&A(`int`)>=6,
  tx:`Les Voodoo Boys te contactent sur un canal crypté : « On cherche quelqu'un qui peut s'approcher du <em>Blackwall</em>. On parle d'IA rogue, d'Alt Cunningham, de choses qui regardent depuis l'autre côté. Tu en es ? »`,
  ch:[
    {t:`Plonger au bord du Blackwall`,s:`INT · Danger mental`,chk:{a:`int`,k:`hck`,dc:10,ok:{cred:12,ed:3500,at:{int:1},hum:-6,role:{net:3},fac:{voodoo:10},msg:`Une présence énorme t'observe. Tu ressors vivant avec des données que personne n'a jamais vues.`},ko:{hp:-35,hum:-15,msg:`Une vague de données te traverse. Tu te réveilles hagard(e), la tête en feu.`}}},
    {t:`Refuser, tu préfères survivre`,fx:{cred:1,hum:2,msg:`Maman Brigitte note ton nom. « Un jour, peut-être. »`}}
  ]});
card({id:`netwatch`,who:`corpo`,tag:`NetWatch · Audit`,w:4,cond:()=>hasDeck(),
  tx:`NetWatch a repéré une intrusion qui ressemble beaucoup à ta signature. Un agent propose un marché : « Pas de poursuites si tu coopères. Ou tu disparais dans un sous-sol. »`,
  ch:[
    {t:`Effacer tes traces`,s:`INT · Hack`,chk:{a:`int`,k:`hck`,dc:8,ok:{cred:4,role:{net:1},msg:`Plus un seul log. Tu es redevenu(e) un fantôme.`},ko:{hp:-20,ed:-600,cred:-2,msg:`Ils te collent un pare-feu mortel. Tu t'en sors, mais ils ont saisi ton matériel.`}}},
    {t:`Coopérer avec NetWatch`,s:`−Humanité`,fx:{hum:-4,ed:1200,cred:-3,role:{net:1},msg:`Tu fournis des noms. Tu as honte, mais tu es vivant(e).`}}
  ]});
card({id:`hacker_gig`,who:`fix`,tag:`Piratage sur commande`,w:5,cond:()=>hasDeck(),
  tx:`Un client veut accéder à une base de données Biotechnica pour y supprimer un dossier. « Tu peux le faire proprement ? Moi, je ne sais pas faire. »`,
  ch:[
    {t:`Casser le pare-feu`,s:`INT · Hack`,chk:{a:`int`,k:`hck`,dc:8,ok:{ed:2000,cred:6,role:{net:2},msg:`Tu entres, tu sors. Personne ne saura que tu étais là.`},ko:{hp:-18,hum:-3,msg:`Un contre-feu t'envoie un choc dans la nuque.`}}},
    {t:`Refuser`,fx:{}}
  ]});

/* ============================ CARRIÈRES (voies) ============================ */
card({id:`path_fixer`,who:`dex`,tag:`Voie de Fixer`,once:true,cond:()=>G.role.fixer>=3&&G.cred>=12,
  tx:`Dex te prend à part : « Tu connais des gens, tu sais parler, tu sens les occasions. Tu pourrais être fixer. Ce n'est pas facile : tu prends un pourcentage, mais tu portes les erreurs. Prêt(e) ? »`,
  ch:[

  valentinos:[`capitan`,`Gustavo Orta a un problème : un Maelstrom a profané une église de Wellsprings. Le barrio veut du sang, mais Padre réclame de l'honneur.`,`Venger l'église`,`Prendre la tête d'une procession de nuit`],
  maelstrom:[`dum`,`Dum Dum veut te voir : « Un Royce plus fort, c'est un Maelstrom plus fort. Je te donne une dose de chrome gratuit si tu me jures fidélité. »`,`Accepter le chrome`,`Résister à la tentation`],

  sixth:[`sixth`,`Un vétéran 6th Street te raconte la guerre de Unification. « On n'est pas des gangsters, on est des patriotes. Prouve-le en nettoyant le quartier. »`,`Nettoyer Arroyo`,`Négocier avec les gangs`],
  voodoo:[`placide`,`Placide te convoque pour Maman Brigitte : « Le Blackwall bouge. On a besoin de vigilance. Tu veux voir ce qu'il y a derrière ? »`,`Plonger avec eux`,`Veiller sur le périmètre`],
  animals:[`sas`,`Sasquatch te convoque au dojo : « Tu as de la force. Pas encore de cœur. Montre-moi les deux. »`,`Défier un champion`,`Protéger un enfant du quartier`],
  mox:[`lizzie`,`Susie Q te demande de monter sur scène pour un hommage aux disparues du Mox. « Tu portes nos couleurs. Parle pour nous. »`,`Parler sur scène`,`Proposer une action de rue`],
  aldecaldos:[`saul`,`Saul te parle de la route : « Les Badlands changent. NUSA et Militech rôdent. J'ai besoin de quelqu'un pour tenir le flanc est. »`,`Tenir le flanc est`,`Négocier avec NUSA`],
  wraiths:[`nomad`,`Un chef Wraith veut un convoi de guerre : « Pas de pitié, pas de témoin. Tu es dedans ? »`,`Mener le convoi`,`Ralentir pour sauver des civils`],
  barghest:[`hansen`,`Hansen te confie le contrôle d'une porte de Dogtown. « La discipline, c'est la survie. »`,`Tenir la porte`,`Autoriser des civils à passer`],
  ncpd:[`ncpd`,`Un capitaine NCPD te propose une promotion : « Si tu fermes les yeux sur un petit trafic de cyberware, tu auras ton insigne de détective. »`,`Fermer les yeux`,`Refuser et enquêter`],
  arasaka:[`takemura`,`Takemura te convoque : « Arasaka exige la perfection. Un cadre a failli. Tu dois le remplacer. »`,`Prendre sa place`,`Défendre le cadre`],
  militech:[`meredith`,`Meredith Stout te propose une affaire : « Un hacker Arasaka a volé un prototype. Va le chercher. »`,`Traquer le hacker`,`Marchander avec lui`],
  kangtao:[`corpo`,`Kang Tao veut tester une IA de visée sur un champ de tir. Tu seras la cible… ou le contrôleur.`,`Piloter le test`,`Saboter le test`],
  biotechnica:[`corpo`,`Une récolte menace d'échouer à cause d'un virus. Biotechnica te confie une mission délicate dans les Badlands.`,`Négocier avec les nomades`,`Détruire les champs infectés`],
  trauma:[`doc`,`Une équipe Trauma Team est coincée dans une zone Maelstrom. À toi de la sortir.`,`Les sortir en force`,`Les extraire discrètement`],
};
Object.keys(ARCS).forEach(id=>{
  const [who,txt,a,b]=ARCS[id], f=FAC[id];
  card({id:`farc_${id}`,who,tag:`Arc · ${f.n}`,once:true,w:30,cond:()=>G.member===id&&G.rank>=1,
    tx:txt,
    ch:[
      {t:a,s:`Rang +`,chk:{a:`ref`,k:`cmb`,dc:8,ok:{ed:2500,cred:8,fac:{[id]:14},fn:`facJobWin`,msg:`Tu relèves le défi avec brio. ${f.n} s'en souviendra longtemps.`},ko:{hp:-30,fac:{[id]:-4},msg:`Un échec cuisant, mais tu en réchappes.`}}},
      {t:b,s:`COOL`,chk:{a:`cool`,dc:8,ok:{ed:1800,cred:7,hum:5,fac:{[id]:10},msg:`Une autre voie, plus fine, plus sage. Les anciens hochent la tête.`},ko:{ed:200,fac:{[id]:-4},msg:`On te reproche ta mollesse.`}}}
    ]});
});
card({id:`fac_coup`,who:`fix`,tag:`Prendre la tête`,once:true,w:20,cond:()=>{const p=promoInfo();return G.member&&!isLeader()&&G.rank>=3&&p&&p.ready},
  tx:()=>`Tu es le bras droit de ${FAC[G.member].n}. Le chef vieillit, les rivaux se multiplient. Dans les couloirs, on murmure ton nom. Si tu veux la première place, c'est maintenant. Sinon, tu resteras dans l'ombre.`,
  ch:[
    {t:`Prendre le pouvoir par la force`,s:`CORPS · combat`,heavy:`Tu renverses ton chef. Si tu échoues, tu le paieras cher ; si tu réussis, tu porteras la couronne — et ses ennemis.`,chk:{a:`body`,k:`cmb`,dc:10,ok:{cred:12,ed:3000,role:{boss:3},fn:`seizeFaction`,msg:`Un duel, un coup décisif. Le chef s'incline. Tu es désormais à la tête de ${`la famille`}.`},ko:{hp:-50,cred:-3,fac:{},msg:`Ta tentative échoue. Tu survis, mais ta position est fragilisée.`}}},
    {t:`Le convaincre de te céder sa place`,s:`SANG-FROID`,heavy:`Tu réclames la place du chef. Un refus brisera la confiance.`,chk:{a:`cool`,dc:9,ok:{cred:10,ed:2000,role:{boss:3},fn:`seizeFaction`,msg:`Sans sang versé, tu deviens leader. Les loyautés se rallient.`},ko:{cred:-2,hum:-2,msg:`Il se méfie. Tu devras patienter.`}}},
    {t:`Rester loyal au chef`,s:`Sécurité`,fx:{hum:5,cred:2,fac:{},fn:`facLoyal`,msg:`Tu prouves ta loyauté. Le chef te remercie et te garde à ses côtés.`}}
  ]});

/* ============================ HISTOIRE 2070-2092 ============================ */
const H = (id,who,tag,at,tx,ch,extra)=>card(Object.assign({id,who,tag,story:true,at,tx,ch},extra||{}));
H(`h_2071`,`narr`,`2071 · Chroming`,[2071,0],`Les cliniques de Little China annoncent des promos sur le chrome. Les cyberpsychos "Sighting" se multiplient aux infos. Night City bourdonne de rumeurs : la nouvelle génération de Sandevistan serait en cours de test.`,[
  {t:`Étudier le marché du chrome`,s:`INTELLECT`,fx:{at:{int:1},cred:1,msg:`Tu apprends quel chrome vaut la peine, lequel est un piège.`}},
  {t:`Ignorer la mode`,fx:{hum:3}}]);
H(`h_2072`,`narr`,`2072 · Guerres des gangs`,[2072,4],`Les Maelstrom prennent un entrepôt de Northside. Les Valentinos ripostent. Les rues de Watson sentent la poudre. Tout le monde se demande qui tiendra le trottoir demain.`,[
  {t:`Se cacher quelques jours`,fx:{hum:3,ed:-100}},
  {t:`Offrir tes services aux gangs`,s:`Gain · risque`,chk:{a:`ref`,k:`cmb`,dc:8,ok:{ed:1800,cred:6,hum:-4,msg:`Tu te places entre deux camps et prends ta part.`},ko:{hp:-26,cred:1,msg:`Une balle perdue t'égratigne sévèrement.`}}}]);
H(`h_2074`,`narr`,`2074 · NetWatch`,[2074,3],`NetWatch renforce ses patrouilles sur le Net. Des netrunners disparaissent. Les Voodoo Boys parlent d'un "Mur" qui se renforce et d'IA rogues qui rôdent derrière.`,[
  {t:`Profiter pour vendre des cyberdecks`,s:`TECHNIQUE`,chk:{a:`tech`,dc:7,ok:{ed:1800,cred:3,msg:`Tu fais fortune sur la peur des autres.`},ko:{ed:-200,msg:`Un lot défectueux. Plus de peur que de mal.`}}},
  {t:`Se faire discret`,fx:{hum:2}}]);
H(`h_2075`,`narr`,`2075 · Braindance`,[2075,2],`Une BD "ultime" fait scandale : un tueur d'Edgerunners aurait enregistré ses meurtres. Judy et les Mox s'indignent. La police fait semblant d'enquêter.`,[
  {t:`Enquêter discrètement`,s:`INTELLECT`,chk:{a:`int`,dc:8,ok:{cred:6,hum:6,msg:`Tu dénoues le fil jusqu'à un producteur de Westbrook.`},ko:{hp:-12,msg:`Tu te fais repérer. Les menaces pleuvent.`}}},
  {t:`Laisser tomber`,fx:{hum:-2}}]);
H(`h_2078b`,`narr`,`2078 · Reconstruction`,[2078,6],`Night City se refait une santé : Militech finance des chantiers, la NUSA fait pression, et de nouveaux gangs se bousculent pour prendre le contrôle des quartiers libérés. Les grandes familles se déchirent.`,[
  {t:`Se placer entre deux camps`,s:`SANG-FROID`,chk:{a:`cool`,dc:8,ok:{ed:3000,cred:6,msg:`Tu tisses des alliances fragiles mais payantes.`},ko:{hp:-20,msg:`On te prend pour un traître. Tu t'en tires de justesse.`}}},
  {t:`Se retirer des affaires`,fx:{hum:5,ed:-100}}]);
H(`h_2080`,`narr`,`2080 · Une nouvelle ère`,[2080,0],`Une décennie après tout, Night City est autre : plus propre en surface, plus sombre en dessous. Les anciens racontent les histoires d'Arasaka, de Johnny, de V comme des légendes. Les jeunes n'y croient qu'à moitié.`,[
  {t:`Raconter ta propre histoire`,fx:{cred:3,hum:4,msg:`Tu parles de ce que tu as vécu. Les yeux brillent.`}},
  {t:`Garder le silence`,fx:{hum:2}}]);
H(`h_2085`,`narr`,`2085 · Les vieux démons`,[2085,5],`Un cyberpsycho qui porte ton ancien chrome se fait descendre par MaxTac. Tu reconnais l'implant, le même que le tien. Un frisson, un doute, un avertissement.`,[
  {t:`Consulter un thérapeute`,s:`−500 €$ · +Humanité`,req:R.ed(500),fx:{ed:-500,hum:15,msg:`« Tu as eu de la chance. Ne la gaspille pas. »`}},
  {t:`Ravaler ton malaise`,fx:{hum:-4}}]);

/* ============================ ÉQUILIBRE DES BLOCS ============================ */
const BEND = {
  rue:{lo:[`TRAQUÉ PAR LA RUE`,`Les gangs se sont unis contre toi. Une nuit, au coin d'une ruelle, plus personne ne t'a défendu.`],hi:[`MARIONNETTE DE LA RUE`,`Tu ne décides plus rien : les gangs t'utilisent comme étendard, puis te jettent quand tu deviens inutile.`]},
  corpo:{lo:[`BLACKLISTÉ PAR LES CORPOS`,`Les corporations t'ont rayé de la carte. Un contrat, un sniper, et ton nom a disparu des bases de données.`],hi:[`CHIEN DE GARDE CORPO`,`Tu portes la laisse des corpos depuis si longtemps que tu as oublié le goût de la liberté.`]},
  loi:{lo:[`GIBIER DE LA NCPD`,`NCPD et MaxTac te traquent sans relâche. Cette fois, il n'y a pas eu de sommation.`],hi:[`INDIC DE LA NCPD`,`Trop proche de la police, tu es devenu(e) un indic. La rue n'a pas oublié.`]},
  nomad:{lo:[`BANNI DES BADLANDS`,`Tous les clans te ferment la route. Sans eux, le désert est une tombe.`],hi:[`PRISONNIER DES CLANS`,`Les clans t'ont adopté… puis enchaîné. Tu roules pour eux, jusqu'à ce que le moteur lâche.`]},
};
Object.keys(BEND).forEach(b=>['lo','hi'].forEach(side=>{
  ENDS[`bloc_${b}_${side}`]={t:BEND[b][side][0],e:BEND[b][side][1],m:.55};
  const low=side===`lo`, B=BLOCS[b];
  card({id:`bc_${b}_${side}`,who:`narr`,tag:`⚖ Équilibre · ${B.n} ${low?`en colère`:`trop proche`}`,w:90,
    cond:()=>low?G.bloc[b]<=15:G.bloc[b]>=85,
    tx:low?`<strong>${B.n}</strong> te perçoit comme une menace. ${B.d} : les ponts se coupent, les menaces arrivent, les portes se ferment. Si rien ne change, ils auront ta peau.`
          :`<strong>${B.n}</strong> te tient de très près. ${B.d} : tu leur dois tout, et ils le savent. Si tu continues, tu n'auras plus de liberté — ni de vie à toi.`,
    ch:[
      {t:`Apaiser la situation`,s:`−1 200 €$ · retour à l'équilibre`,req:R.ed(1200),fx:{ed:-1200,bloc:{[b]:low?22:-22},msg:`Un gros virement, quelques mains serrées. La tension retombe — pour l'instant.`}},
      {t:`Prouver ta valeur`,s:`SANG-FROID`,chk:{a:`cool`,dc:8,ok:{bloc:{[b]:low?16:-16},cred:3,msg:`Tu retournes la situation par ton sang-froid. L'équilibre revient.`},ko:{hp:-18,bloc:{[b]:low?4:-4},msg:`Ça ne prend pas. Tu t'en sors blessé(e), à peine moins en danger.`}}},
      {t:`Ignorer l'avertissement`,s:`Danger de mort`,fx:{bloc:{[b]:low?-8:8},msg:`Tu hausses les épaules. Le piège se resserre.`}}
    ]});
}));

/* ---------- Quête : apprendre le Net (mentor) ---------- */
card({id:`hk_q1`,who:`lucy`,tag:`Quête · Apprendre le Net`,w:7,cond:()=>!G.flags.hackmentor&&!G.flags.hk_q&&A(`int`)>=4&&yr()>=2070,
  tx:`Une netrunneuse te regarde forcer un distributeur de nouilles avec un vieux script. Elle sourit : « Mignon. Tu as du talent, mais tu pirates comme on casse une porte. Je peux t'apprendre à passer par les murs. Trois leçons. Ça te dit ? »`,
  ch:[
    {t:`Accepter ses leçons`,s:`Quête · Hacking avancé`,fx:{flag:[`hk_q`],next:`hk_q2`,rel:{lucy:6},msg:`« Alors commençons. Ne lève pas les yeux de l'écran. »`}},
    {t:`Décliner`,s:`Tu verras plus tard`,fx:{unonce:`hk_q1`,msg:`« Comme tu veux. Je suis souvent dans le coin. »`}}
  ]});
card({id:`hk_q2`,who:`lucy`,tag:`Quête 2/3 · L'épreuve du pare-feu`,once:true,
  tx:`Elle te tend un vieux terminal : trois couches de pare-feu simulées. « Passe-les sans te faire griller. À toi de décider de la méthode. »`,
  ch:[
    {t:`Les contourner par la logique`,s:`INTELLECT`,chk:{a:`int`,k:`hck`,dc:7,ok:{xp:{int:4},next:`hk_q3`,rel:{lucy:8},msg:`Une brèche, un pivot, une sortie propre. Elle hoche la tête.`},ko:{hp:-6,xp:{int:2},next:`hk_q3`,rel:{lucy:3},msg:`Tu te fais griller deux fois, mais tu t'accroches. « Pas mal, pour une première fois. »`}}},
    {t:`Improviser avec ton instinct`,s:`SANG-FROID`,chk:{a:`cool`,dc:7,ok:{xp:{cool:3,int:2},next:`hk_q3`,rel:{lucy:6},msg:`Tu passes à l'instinct, sans te figer. Elle sourit.`},ko:{hp:-8,next:`hk_q3`,msg:`Le terminal grésille. Tu tiens bon malgré la migraine.`}}}
  ]});
card({id:`hk_q3`,who:`lucy`,tag:`Quête 3/3 · Premier run`,once:true,
  tx:`Dernière leçon : un vrai serveur, une vraie corpo. Elle reste derrière toi, les bras croisés. « Je ne touche à rien. À toi de jouer. Ne te débranche pas avant que je le dise. »`,
  ch:[
    {t:`Plonger prudemment`,s:`INTELLECT · hack`,chk:{a:`int`,k:`hck`,dc:7,ok:{fn:`hackMentor`,ed:800,rel:{lucy:12},cred:3,msg:`Tu reviens avec des données et un sourire. « Tu es prêt(e). Bienvenue dans le Net. »`},ko:{fn:`hackMentor`,hp:-12,rel:{lucy:6},msg:`Tu manques de te griller, mais Lucy te débranche à temps. « Bon. La suite, on la fera ensemble. »`}}},
    {t:`Plonger à fond`,s:`Risqué · INTELLECT`,chk:{a:`int`,k:`hck`,dc:9,ok:{fn:`hackMentor`,ed:1800,rel:{lucy:14},cred:5,msg:`Tu fais fondre le pare-feu comme du beurre. Lucy applaudit en silence.`},ko:{fn:`hackMentor`,hp:-25,hum:-3,msg:`Un contre-feu te brûle la nuque. Elle te sort de là, moqueuse mais fière.`}}}
  ]});

/* ---------- Rencontres ---------- */
card({id:`meet_panam`,who:`panam`,tag:`Rencontre · Panam`,once:true,w:7,cond:()=>rel(`panam`)<5&&(G.origin===`nomad`||yr()>=2072),
  tx:`Une nomade à la veste usée se bat contre un contrôle de police, un pistolet Techtronika à la main… qu'elle range avec un clin d'œil. « Panam. Aldecaldos. Tu as un problème avec le flic ? Moi oui. Un coup de main, ça t'irait ? »`,
  ch:[
    {t:`Détourner l'attention du flic`,s:`SANG-FROID`,chk:{a:`cool`,dc:6,ok:{rel:{panam:14},cred:3,msg:`Un faux accident, un malentendu. Elle file. « Tu as le chic, toi. »`},ko:{rel:{panam:6},hp:-8,msg:`Tu prends un coup de matraque pour elle. Elle revient te chercher.`}}},
    {t:`Lui laisser gérer`,fx:{rel:{panam:3},msg:`Elle s'en sort seule. « Pas mal pour un(e) spectateur(rice). »`}}
  ]});
card({id:`meet_claire`,who:`claire`,tag:`Rencontre · Claire`,once:true,w:6,cond:()=>rel(`claire`)<5&&(A(`ref`)>=5||skill(`drv`)>=1),
  tx:`Un garage de la périphérie, une odeur d'huile et de métal chaud. Une pilote te jauge au-dessus d'un capot ouvert : « Tu as les mains qui bougent bien. Tu sais conduire ? »`,
  ch:[
    {t:`Faire un tour d'essai`,s:`RÉFLEXES · conduite`,chk:{a:`ref`,k:`drv`,dc:6,ok:{rel:{claire:14},cred:3,msg:`Un virage serré, un dérapage maîtrisé. Elle rit. « On se reverra. »`},ko:{rel:{claire:5},hp:-6,msg:`Tu cales deux fois. Elle te regarde, amusée.`}}},
    {t:`L'aider à réparer le moteur`,s:`TECHNIQUE`,chk:{a:`tech`,dc:6,ok:{rel:{claire:12},xp:{tech:3},msg:`Tu comprends l'astuce en deux minutes. Elle te tend une clé de 13.`},ko:{rel:{claire:4},msg:`Tu fais plus de dégâts que de réparations. Elle soupire.`}}}
  ]});
card({id:`meet_lucy`,who:`lucy`,tag:`Rencontre · Lucy`,once:true,w:6,cond:()=>rel(`lucy`)<5&&yr()>=2073&&A(`int`)>=5,
  tx:`Sur un toit de Kabuki, une jeune femme aux cheveux argentés regarde la Lune. « Tu aimes les étoiles ? Ici, on voit surtout des néons. » Elle te tend un écouteur : une chanson, un souvenir, quelque chose de fragile.`,
  ch:[
    {t:`Écouter avec elle`,s:`+Humanité`,fx:{hum:8,rel:{lucy:14},msg:`Pendant trois minutes, Night City se tait. Elle sourit sans te regarder.`}},
    {t:`Lui demander ce qu'elle fait ici`,s:`SANG-FROID`,fx:{rel:{lucy:8},cred:1,msg:`« Je prends l'air. Et je regarde les gens qui ne regardent pas les étoiles. »`}}
  ]});

card({id:`jk_heist`,who:`jackie`,tag:`Jackie · Le grand plan`,once:true,w:8,cond:()=>rel(`jackie`)>=35&&yr()<=2076,
  tx:`Jackie déploie un plan sur la table du Coyote Cojo : « Un entrepôt de Maelstrom plein de matos. Trois étages, deux gardes par palier. Avec toi, ça passe. Et après, Mama n'aura plus à travailler la nuit. »`,

card({id:`jd_lesson`,who:`judy`,tag:`Judy · Atelier de BD`,once:true,w:7,cond:()=>rel(`judy`)>=30,

card({id:`pn_race`,who:`panam`,tag:`Panam · Un cadeau`,once:true,w:7,cond:()=>rel(`panam`)>=40,
  tx:`Panam t'attend devant un Thorton fraîchement retapé : « Saul dit que tu fais partie de la famille. Alors voilà : une des bêtes du clan. Elle est à toi. Ne la plante pas dans un fossé, hein. »`,

  ]});
card({id:`vk_secret`,who:`vik`,tag:`Vik · Un secret`,once:true,w:7,cond:()=>rel(`vik`)>=40,
  tx:`Vik verrouille la porte de la clinique. « J'ai un moniteur biologique de seconde main que je n'ai jamais vendu. Il fonctionne mieux que ceux du marché. Je ne le donne qu'à ceux en qui j'ai confiance. »`,
  ch:[
    {t:`L'accepter`,s:`Biomonitor offert`,fx:{cy:`biomon`,rel:{vik:10},hum:3,msg:`Quelques minutes sur la table. Un petit bip : ça tient.`}},
    {t:`Lui dire de le garder pour un patient`,s:`+Humanité`,fx:{hum:10,rel:{vik:14},msg:`Il te serre l'épaule. « Tu vas me rendre sentimental, toi. »`}}
  ]});
card({id:`ms_vision`,who:`misty`,tag:`Misty · Une vision`,once:true,w:7,cond:()=>rel(`misty`)>=40,
  tx:`Misty te regarde longtemps sans parler. « J'ai vu quelque chose pour toi. Pas la mort. Un choix. Quand tu le feras, tu sauras. Rappelle-toi simplement que tu n'es pas seul(e). »`,

    {t:`Lui faire confiance`,s:`+Humanité`,fx:{hum:20,rel:{misty:12},msg:`Une chaleur étrange dans la poitrine. Tu ressors plus léger.`}},
    {t:`Lui demander plus de détails`,fx:{hum:6,cred:2,rel:{misty:6},msg:`« Non. Certaines choses doivent rester des surprises. »`}}

card({id:`kr_song`,who:`kerry`,tag:`Kerry · Une chanson`,once:true,w:7,cond:()=>rel(`kerry`)>=30,
  tx:`Kerry gratte une guitare, assis sur un ampli. « J'ai une chanson sur Night City. Je n'arrive pas à finir le refrain. Aide-moi : qu'est-ce que cette ville t'a pris ? »`,
  ch:[
    {t:`Lui raconter une vraie histoire`,s:`SANG-FROID`,chk:{a:`cool`,dc:7,ok:{cred:6,hum:8,rel:{kerry:12},role:{rocker:2},msg:`Il note chaque mot. Quelques mois plus tard, tu entends un refrain qui te serre la gorge.`},ko:{hum:3,rel:{kerry:5},msg:`Tu cherches tes mots. Il sourit : « Même le silence, ça se met en musique. »`}}},

  ]});
card({id:`cl_gift`,who:`claire`,tag:`Claire · Pièce rare`,once:true,w:7,cond:()=>rel(`claire`)>=30,
  tx:`Claire dégage une bâche : une carrosserie rouge sombre, un moteur qui brille. « Je l'ai montée avec des pièces que personne ne voulait. Une bête. Elle n'a pas de propriétaire. Pas encore. »`,
  ch:[
    {t:`La prendre`,s:`Mizutani Shion offerte`,fx:{gear:`mizutani`,rel:{claire:10},cred:4,msg:`Le moteur gronde. Claire sourit, les mains grasses sur les hanches.`}},
    {t:`Lui proposer de la partager`,s:`+Lien`,fx:{rel:{claire:16},hum:5,msg:`Vous rédigez un contrat à l'encre de cambouis. Les courses à venir s'annoncent belles.`}}
  ]});
card({id:`mm_dinner`,who:`mama`,tag:`Mama Welles · À table`,once:true,w:7,cond:()=>rel(`mama`)>=30,

    {t:`Manger avec elle`,s:`+Santé · +Humanité`,fx:{hp:30,hum:12,rel:{mama:10},fac:{valentinos:4},msg:`Un plat chaud, une main sur l'épaule, quelques mots simples. Rien d'autre à Night City ne vaut ça.`}},
    {t:`L'aider à servir`,s:`+Lien`,fx:{rel:{mama:14},ed:150,cred:2,fac:{valentinos:6},msg:`Les clients te saluent. Tu fais partie de la famille.`}}
  ]});
card({id:`rg_past`,who:`rogue`,tag:`Rogue · Un souvenir`,once:true,w:7,cond:()=>rel(`rogue`)>=30,
  tx:`Tard dans la nuit, l'Afterlife se vide. Rogue pose une bouteille entre vous : « Avant, je faisais confiance à tout le monde. C'est ce qui m'a presque tuée. Je ne le raconte à personne. Mais toi… »`,
  ch:[
    {t:`L'écouter jusqu'au bout`,s:`+Lien`,fx:{rel:{rogue:16},hum:8,cred:3,msg:`Elle parle de batailles et de pertes. Quand elle s'arrête, elle te sert un autre verre.`}},
    {t:`Lui proposer ton aide`,s:`SANG-FROID`,chk:{a:`cool`,dc:7,ok:{rel:{rogue:14},cred:5,msg:`Elle te regarde longtemps. « Peut-être, oui. Un jour. »`},ko:{rel:{rogue:6},msg:`« Je n'ai besoin de personne. » Mais son regard dit autre chose.`}}}
  ]});
card({id:`dx_inner`,who:`dex`,tag:`Dex · Cercle proche`,once:true,w:7,cond:()=>rel(`dex`)>=30,

  ch:[
    {t:`Entrer dans son cercle`,s:`Gigs +15 % de gains`,fx:{flag:[`dexvip`],rel:{dex:10},cred:3,msg:`Tu reçois un numéro privé. Les gigs te rapportent désormais plus.`}},
    {t:`Rester indépendant`,s:`+Humanité`,fx:{rel:{dex:6},hum:4}}
  ]});
card({id:`lc_lesson`,who:`lucy`,tag:`Lucy · Cours particulier`,once:true,w:7,cond:()=>rel(`lucy`)>=25,

    {t:`Lui poser une question sur la Lune`,fx:{hum:6,rel:{lucy:10},msg:`« J'irai. Un jour. Peut-être même avec toi. »`}}
  ]});

/* ---------- Conséquences ---------- */
card({id:`friend_danger`,who:`narr`,tag:`⚠ Un allié en danger`,w:9,cd:12,
  cond:()=>G.stats.cards>=8&&Object.keys(WHO).some(i=>REL_NAMES.includes(i)&&relv(i)>=25&&!(G.dead||{})[i]),
  tx:()=>{
    const l=REL_NAMES.filter(i=>relv(i)>=25&&!(G.dead||{})[i]); const id=l[rnd(0,l.length-1)];
    G.tmp={ally:id}; return `Un appel en pleine nuit : <strong>${WHO[id].n}</strong> est en danger. Une embuscade, une dette, un piège. Tu es peut-être le seul à pouvoir intervenir. Chaque minute compte.`;
  },
  ch:[

const CARD_ = id => CARDS.find(c=>c.id===id);
const ORI = (id,origin,ch) => { const c=CARD_(id); if(c) c.ch.push(Object.assign({only:origin},ch)); };

/* ---------- Faveurs & hostilités de blocs ---------- */
const BP = {
  rue:{hi:[`La rue te porte`,`Dans chaque barrio, on te salue d'un geste. Les petits gangs t'invitent à leurs tables, les marchands sortent leur meilleur matos pour toi. Mais plus on t'aime, plus on attend de toi.`,`Profiter de l'ambiance`,`Rééquilibrer : trinquer avec la police`],

  corpo:{hi:[`Les corpos t'adulent`,`Des invitations arrivent par dizaines : cocktails à Corpo Plaza, dîners avec des VP. On te traite comme un atout. Un atout, ça se possède.`,`Accepter les avantages`,`Garder tes distances`],
         lo:[`Les corpos te surveillent`,`Des drones planent trop souvent près de chez toi. Un compte bloqué, un contrat annulé, un message anonyme : « Nous savons. » Tu n'es plus le bienvenu dans les tours.`,`Racheter leur confiance`,`Brouiller les pistes`]},
  loi:{hi:[`La NCPD te couvre`,`Un agent te fait un signe de tête. Ton dossier a disparu d'une base de données. La police est de ton côté — pour l'instant. La rue, elle, commence à murmurer.`,`Profiter de la protection`,`Se montrer discret(e)`],

  nomad:{hi:[`Les clans t'ouvrent la route`,`Des nomades te saluent sur la route. Un convoi t'offre sa protection, un mécano refuse ton argent. Les Badlands te considèrent comme l'un des leurs.`,`Rouler avec le convoi`,`Rendre une faveur au clan`],

};
Object.keys(BP).forEach(b=>['hi','lo'].forEach(side=>{
  const [tag,tx,a,bb]=BP[b][side], hi=side===`hi`, B=BLOCS[b];
  card({id:`bp_${b}_${side}`,who:`narr`,tag:`⚖ ${B.n} · ${hi?`faveur`:`hostilité`}`,w:7,cd:8,
    cond:()=>hi?(G.bloc[b]>=65&&G.bloc[b]<85):(G.bloc[b]<=35&&G.bloc[b]>15),

      hi?{t:a,s:`Gain · le bloc monte encore`,fx:{ed:900,cred:3,bloc:{[b]:6},msg:`Tu profites de la situation. Les avantages sont réels — et ta liberté, un peu moins.`}}
        :{t:a,s:`−900 €$ · le bloc remonte`,req:R.ed(900),fx:{ed:-900,bloc:{[b]:12},msg:`Quelques billets changent de mains. Les regards se radoucissent.`}},

    ]});
}));

/* ---------- Q4 · Le client fantôme ---------- */
card({id:`q4_1`,who:`corpo`,tag:`Quête · Le client fantôme (1/3)`,once:true,

  ch:[

card({id:`q4_2`,who:`corpo`,tag:`Quête · Le client fantôme (2/3)`,once:true,
  tx:`Le quatrième jour, un homme s'assoit enfin à la table. Arasaka, sans doute : costume sombre, regard glacé. Il commande un thé, puis te fixe. « Vous êtes le/la garde. Vous ne saviez pas pour qui vous travailliez, n'est-ce pas ? »`,

card({id:`q4_3`,who:`meredith`,tag:`Quête · Le client fantôme (3/3)`,once:true,
  tx:`Le lendemain, Meredith Stout (Militech) te contacte : « Il paraît que vous avez rencontré un certain homme. Nous avons des intérêts communs. » Tu as un choix à faire, avec ou sans enregistrement.`,

/* ---------- Q7 · Le passeur ---------- */
card({id:`q7_1`,who:`nomad`,tag:`Quête · Le passeur (1/3)`,once:true,

  ch:[

card({id:`q7_2`,who:`ncpd`,tag:`Quête · Le passeur (2/3)`,once:true,

    {t:`Forcer le barrage`,s:`RÉFLEXES · conduite`,chk:{a:`ref`,k:`drv`,dc:9,ok:{next:`q7_3`,cred:7,bloc:{loi:-5},msg:`Un coup d'accélérateur, une barrière brisée, des tirs derrière toi. Vous passez.`},ko:{next:`q7_3`,hp:-30,bloc:{loi:-6},msg:`Les agents tirent. Vous passez, mais vous saignez.`}}}
  ]});
card({id:`q7_3`,who:`nomad`,tag:`Quête · Le passeur (3/3)`,once:true,
  tx:`De l'autre côté, dans les Badlands, la famille descend. Le père te serre les mains, la mère pleure en silence. Le passeur, lui, compte les billets : « Ta part, comme convenu. Mais tu peux aussi leur laisser. »`,
  ch:[
    {t:`Prendre ta part`,s:`+Gain`,fx:{...qend(`q7`),ed:4000,cred:5,bloc:{nomad:5},msg:`L'argent est réel. Les visages dans le rétroviseur, aussi.`}},

  ]});

card({id:`q2_2`,who:`claws`,tag:`Quête · La BD disparue (2/3)`,once:true,
  tx:`Un dojo de Japantown, fermé pour la nuit. Des Tyger Claws gardent la porte. Derrière, on entend des sanglots étouffés. Tu pourrais les affronter, les contourner, ou négocier un accès.`,

card({id:`q2_3`,who:`judy`,tag:`Quête · La BD disparue (3/3)`,once:true,

card({id:`q3_2`,who:`nomad`,tag:`Quête · Convoi maudit (2/3)`,once:true,

card({id:`q3_3`,who:`saul`,tag:`Quête · Convoi maudit (3/3)`,once:true,

card({id:`q5_2`,who:`scav`,tag:`Quête · Chasse au chrome (2/3)`,once:true,

card({id:`q5_3`,who:`fingers`,tag:`Quête · Chasse au chrome (3/3)`,once:true,

card({id:`hunt_2`,who:`@ex`,tag:`☠ Face à face`,cond:()=>false,

card({id:`ex_grudge`,who:`@ex`,tag:`Un ancien frère`,cond:()=>false,
