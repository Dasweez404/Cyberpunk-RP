/* ---------- Q1 · L'entrepôt oublié ---------- */
card({id:`q1_1`,who:`dex`,tag:`Quête · L'entrepôt oublié (1/3)`,once:true,
  tx:`Northside, un entrepôt que les Maelstrom ont déserté en pleine nuit. Il reste du matériel Militech là-dedans, et peut-être plus. Trois façons d'entrer : les toits, les systèmes, ou la porte.`,
  ch:[
    {t:`Passer par les toits`,s:`SANG-FROID · furtivité`,chk:{a:`cool`,k:`stl`,dc:7,ok:{next:`q1_2`,flag:[`q1_clean`],msg:`Une lucarne, un câble, un silence parfait. Personne ne sait que tu es entré(e).`},ko:{next:`q1_2`,hp:-10,msg:`Une tuile glisse, un chien aboie. Tu entres, mais pas discrètement.`}}},
    {t:`Pirater les accès`,s:`INTELLECT · hack`,req:R.deck(),chk:{a:`int`,k:`hck`,dc:7,ok:{next:`q1_2`,flag:[`q1_clean`],msg:`Les caméras se figent, les portes s'ouvrent. Propre.`},ko:{next:`q1_2`,hp:-8,msg:`Le système sonne une alarme muette. Tu entres quand même.`}}},
    {t:`Forcer la porte`,s:`CORPS · combat`,chk:{a:`body`,k:`cmb`,dc:7,ok:{next:`q1_2`,cred:2,msg:`Un coup, une charnière, la porte tombe. Subtil comme un camion.`},ko:{next:`q1_2`,hp:-14,msg:`La porte résiste, puis cède sur toi. Tu entres sonné(e).`}}}
  ]});
card({id:`q1_2`,who:`narr`,tag:`Quête · L'entrepôt oublié (2/3)`,once:true,
  tx:`À l'intérieur : des caisses de matériel Militech empilées jusqu'au plafond… et, derrière un grillage, trois personnes enchaînées. Des captifs des Maelstrom, destinés aux ripperdocs sans scrupules. Leurs yeux t'implorent en silence.`,
  ch:[
    {t:`Prendre les caisses et filer`,s:`+Gain · −Humanité`,fx:{ed:2500,hum:-8,flag:[`q1_loot`],next:`q1_3`,msg:`Tu charges le matériel. Les captifs ne crient pas. C'est pire.`}},
    {t:`Libérer les captifs`,s:`RÉFLEXES`,chk:{a:`ref`,dc:7,ok:{hum:10,cred:3,flag:[`q1_free`],next:`q1_3`,msg:`Les chaînes tombent. Les captifs t'embrassent, en pleurs.`},ko:{hum:6,hp:-14,flag:[`q1_free`],next:`q1_3`,msg:`Un loquet te blesse. Mais ils sont libres.`}}},
    {t:`Tout faire : libérer et récupérer`,s:`SANG-FROID · difficile`,chk:{a:`cool`,dc:9,ok:{ed:2500,hum:8,cred:5,flag:[`q1_loot`,`q1_free`],next:`q1_3`,msg:`Un plan en trois minutes. Les captifs sortent, les caisses aussi. Presque trop beau.`},ko:{hp:-18,flag:[`q1_free`],next:`q1_3`,msg:`Trop ambitieux : tu perds les caisses mais sauves les captifs.`}}}
  ]});
card({id:`q1_3`,who:`royce`,tag:`Quête · L'entrepôt oublié (3/3)`,once:true,
  tx:`Des phares dans la nuit : les Maelstrom reviennent, en nombre, menés par Royce lui-même. Le grillage est ouvert, l'entrepôt exposé. Tu as quelques secondes.`,
  ch:[
    {t:`Les affronter`,s:`CORPS/RÉFLEXES · combat`,chk:{a:`body`,k:`cmb`,dc:9,ok:{...qend(`q1`),flag:[`qdone_q1`],ed:1500,cred:8,fac:{maelstrom:-10},msg:`Une fusillade courte et brutale. Royce recule, furieux. L'entrepôt est à toi.`},ko:{...qend(`q1`),hp:-35,cred:2,fac:{maelstrom:-8},msg:`Tu t'en sors à moitié mort(e). Les Maelstrom pillent ce qui reste.`}}},
    {t:`Fuir par les toits avec les captifs`,s:`RÉFLEXES`,chk:{a:`ref`,dc:8,ok:{...qend(`q1`),hum:6,cred:6,msg:`Tu disparais dans la nuit, les captifs sur tes talons. Royce hurle sur le toit vide.`},ko:{...qend(`q1`),hp:-22,msg:`Tu t'en sors de justesse, un peu plus lourd(e) de plomb.`}}},
    {t:`Négocier avec Royce`,s:`SANG-FROID`,chk:{a:`cool`,dc:9,ok:{...qend(`q1`),ed:2000,cred:7,fac:{maelstrom:4},msg:`Royce rit, te laisse partir avec une part. « Pas mal, pour un(e) civil(e). »`},ko:{...qend(`q1`),hp:-30,ed:-500,msg:`Royce n'est pas d'humeur à négocier. Tu repars en boitant.`}}}
  ]});

/* ---------- Q4 · Le client fantôme ---------- */
card({id:`q4_1`,who:`corpo`,tag:`Quête · Le client fantôme (1/3)`,once:true,
  tx:`Un costume impeccable te paie d'avance pour garder « un VIP » dans un café de Downtown, tous les jours, à la même heure. Il ne te donne ni nom ni photo. « Vous saurez le reconnaître. »`,
  ch:[
    {t:`Surveiller le café avec attention`,s:`INTELLECT`,chk:{a:`int`,dc:7,ok:{next:`q4_2`,flag:[`q4_know`],msg:`Au troisième jour, tu remarques que personne ne s'assoit à la table réservée. C'est un leurre.`},ko:{next:`q4_2`,msg:`Tu surveilles sans comprendre. Le piège se referme lentement.`}}},
    {t:`Accepter sans poser de questions`,s:`Argent facile`,fx:{ed:800,next:`q4_2`,msg:`L'argent est réel. C'est tout ce que tu sais.`}}
  ]});
card({id:`q4_2`,who:`corpo`,tag:`Quête · Le client fantôme (2/3)`,once:true,
  tx:`Le quatrième jour, un homme s'assoit enfin à la table. Arasaka, sans doute : costume sombre, regard glacé. Il commande un thé, puis te fixe. « Vous êtes le/la garde. Vous ne saviez pas pour qui vous travailliez, n'est-ce pas ? »`,
  ch:[
    {t:`Jouer l'innocence`,s:`SANG-FROID`,chk:{a:`cool`,dc:8,ok:{next:`q4_3`,cred:3,msg:`Il hoche la tête. « Bien. Moins on sait, mieux on vit. »`},ko:{next:`q4_3`,hp:-10,msg:`Il ne te croit pas. Quelques regards s'attardent trop longtemps.`}}},
    {t:`Enregistrer discrètement la conversation`,s:`INTELLECT`,chk:{a:`int`,dc:8,ok:{next:`q4_3`,flag:[`q4_rec`],msg:`Ton implant capte chaque mot. Tu viens de mettre la main sur quelque chose de gros.`},ko:{next:`q4_3`,hp:-12,msg:`Il repère ton micro. Un sourire sans joie.`}}}
  ]});
card({id:`q4_3`,who:`meredith`,tag:`Quête · Le client fantôme (3/3)`,once:true,
  tx:`Le lendemain, Meredith Stout (Militech) te contacte : « Il paraît que vous avez rencontré un certain homme. Nous avons des intérêts communs. » Tu as un choix à faire, avec ou sans enregistrement.`,
  ch:[
    {t:`Vendre l'information à Militech`,s:`Gros gain`,fx:{...qend(`q4`),ed:4200,cred:6,fac:{militech:8,arasaka:-10},loot:3,msg:`Meredith sourit. Le virement dépasse tes attentes. Arasaka t'aura dans le viseur.`}},
    {t:`Prévenir Arasaka`,s:`Loyauté`,fx:{...qend(`q4`),ed:2500,cred:5,fac:{arasaka:10,militech:-8},msg:`Ils te remercient d'un geste sobre. Une enveloppe, un regard.`}},
    {t:`Tout effacer et disparaître quelque temps`,s:`+Humanité`,fx:{...qend(`q4`),hum:8,cred:2,msg:`Tu détruis l'enregistrement. Certaines histoires valent mieux qu'on les oublie.`}}
  ]});

/* ---------- Q7 · Le passeur ---------- */
card({id:`q7_1`,who:`nomad`,tag:`Quête · Le passeur (1/3)`,once:true,
  tx:`Une famille de réfugiés veut traverser la frontière des Badlands. Un passeur te propose une part : « Il faut un véhicule, un guide, et quelqu'un qui sait baratiner les barrages. »`,
  ch:[
    {t:`Conduire le convoi`,s:`RÉFLEXES · conduite`,chk:{a:`ref`,k:`drv`,dc:7,ok:{next:`q7_2`,cred:3,msg:`La piste est bonne. La famille rit nerveusement dans la soute.`},ko:{next:`q7_2`,hp:-10,msg:`Une crevaison, une panne. Mais vous avancez.`}}},
    {t:`Préparer les papiers`,s:`INTELLECT`,chk:{a:`int`,dc:7,ok:{next:`q7_2`,flag:[`q7_papers`],msg:`Des faux papiers parfaits. Ça passera.`},ko:{next:`q7_2`,msg:`Des papiers bâclés. Le barrage sera plus délicat.`}}}

card({id:`q7_2`,who:`ncpd`,tag:`Quête · Le passeur (2/3)`,once:true,
  tx:`Un barrage NCPD au milieu de la route. Les agents examinent les véhicules un par un. Dans ta soute, une famille retient son souffle. Un mauvais geste et tout bascule.`,
  ch:[
    {t:`Utiliser les faux papiers`,s:`Si tu en as`,req:R.flag(`q7_papers`,`Papiers requis`),fx:{next:`q7_3`,cred:3,msg:`Les agents lisent, hésitent, laissent passer. Un soulagement muet.`}},
    {t:`Distraire les agents`,s:`SANG-FROID`,chk:{a:`cool`,dc:8,ok:{next:`q7_3`,cred:4,msg:`Une histoire inventée, un sourire, une cigarette offerte. On t'ouvre la barrière.`},ko:{next:`q7_3`,hp:-14,ed:-300,msg:`Ils veulent fouiller. Un pot-de-vin règle la question.`}}},
    {t:`Forcer le barrage`,s:`RÉFLEXES · conduite`,chk:{a:`ref`,k:`drv`,dc:9,ok:{next:`q7_3`,cred:7,bloc:{loi:-5},msg:`Un coup d'accélérateur, une barrière brisée, des tirs derrière toi. Vous passez.`},ko:{next:`q7_3`,hp:-30,bloc:{loi:-6},msg:`Les agents tirent. Vous passez, mais vous saignez.`}}}
  ]});
card({id:`q7_3`,who:`nomad`,tag:`Quête · Le passeur (3/3)`,once:true,
  tx:`De l'autre côté, dans les Badlands, la famille descend. Le père te serre les mains, la mère pleure en silence. Le passeur, lui, compte les billets : « Ta part, comme convenu. Mais tu peux aussi leur laisser. »`,
  ch:[
    {t:`Prendre ta part`,s:`+Gain`,fx:{...qend(`q7`),ed:4000,cred:5,bloc:{nomad:5},msg:`L'argent est réel. Les visages dans le rétroviseur, aussi.`}},

  ]});

card({id:`q2_2`,who:`claws`,tag:`Quête · La BD disparue (2/3)`,once:true,
  tx:`Un dojo de Japantown, fermé pour la nuit. Des Tyger Claws gardent la porte. Derrière, on entend des sanglots étouffés. Tu pourrais les affronter, les contourner, ou négocier un accès.`,

card({id:`q2_3`,who:`judy`,tag:`Quête · La BD disparue (3/3)`,once:true,
  tx:`Dans une salle de karaoké désaffectée, l'amie de Judy, attachée, la BD dans les mains d'un Tyger. Il te regarde avec un sourire cassé : « Tu veux la BD ? Elle vaut cher. Mais elle, elle ne vaut rien. »`,

    {t:`Récupérer la BD d'abord`,s:`Risqué`,fx:{...qend(`q2`),hum:-6,rel:{judy:-6},ed:1500,msg:`La BD est à toi. L'amie, moins. Judy ne te le pardonnera pas.`}}

card({id:`q3_2`,who:`nomad`,tag:`Quête · Convoi maudit (2/3)`,once:true,

card({id:`q6_1`,who:`kerry`,tag:`Quête · La bande volée (1/2)`,once:true,w:7,cond:()=>QOK()&&rel(`kerry`)>=10,
  tx:`Kerry fait les cent pas dans une loge : « On m'a volé les bandes de mon prochain album. Quelqu'un va les vendre à un label de Westbrook. Je dois les récupérer avant demain soir. »`,
  ch:[
    {t:`Infiltrer le label`,s:`SANG-FROID · furtivité`,chk:{a:`cool`,k:`stl`,dc:8,ok:{...qon,next:`q6_2`,rel:{kerry:8},msg:`Un badge, un faux sourire, une porte entrouverte. Tu les trouves.`},ko:{...qon,next:`q6_2`,hp:-12,rel:{kerry:4},msg:`On te repère. Tu t'enfuis avec un morceau de ce qu'il te fallait.`}}},
    {t:`Menacer le voleur`,s:`CORPS`,chk:{a:`body`,dc:7,ok:{...qon,next:`q6_2`,rel:{kerry:6},msg:`Le voleur ne résiste pas longtemps. Il parle.`},ko:{...qon,next:`q6_2`,hp:-14,msg:`Il avait des amis. Tu repars avec une migraine.`}}}
  ]});
card({id:`q6_2`,who:`kerry`,tag:`Quête · La bande volée (2/2)`,once:true,
  tx:`Tu tiens enfin la bande. Un type du label te rattrape : « Ces bandes valent des millions. Si tu les rends à Kerry, il garde son album. Si tu me les vends, tu deviens riche. » Tu hésites.`,
  ch:[
    {t:`Les rendre à Kerry`,s:`+Lien · +Humanité`,fx:{...qend(`q6`),hum:12,cred:8,rel:{kerry:18},role:{rocker:2},gear:`samurai`,msg:`Kerry te serre contre lui. Il te laisse une veste Samurai en cadeau, en souvenir de ses amis.`}},
    {t:`Les vendre au label`,s:`Gros gain · −Humanité`,heavy:`Tu trahis Kerry pour de l'argent. Il ne te le pardonnera pas.`,fx:{...qend(`q6`),ed:5500,hum:-12,rel:{kerry:-20},msg:`Une fortune. Kerry n'adressera plus jamais la parole à celui/celle qui l'a trahi.`}}
  ]});
/* =====================================================================
   CARTES 6 — conséquences différées (échos), devoirs & pouvoir,
   nouveaux personnages récurrents
   ===================================================================== */
const EXN = () => (G.lastEx&&FAC[G.lastEx])?FAC[G.lastEx].n:`tes anciens frères`;

/* ---------- Échos : la trahison, le départ, le pouvoir ---------- */
card({id:`hunt_1`,who:`@ex`,tag:`☠ Prime sur ta tête`,cond:()=>false,
  tx:()=>`Une voiture sans plaque te suit depuis deux rues. Deux types descendent, calmes, mains visibles : « Tu as quelque chose qui appartient à <strong>${EXN()}</strong>. Leur loyauté, par exemple. Le chef a mis un prix sur ta tête, et c'est un joli prix. »`,
  ch:[
    {t:`Les affronter`,s:`CORPS · combat`,chk:{a:`body`,k:`cmb`,dc:9,ok:{cred:8,hum:-3,msg:`Deux corps au sol, le silence, puis la nuit. Le message est passé : tu ne te laisseras pas faire.`},ko:{hp:-38,ed:-500,msg:`Tu t'en sors à moitié mort(e). Ils ont pris ce qu'ils voulaient sur toi.`}}},
    {t:`Fuir par les toits`,s:`RÉFLEXES`,chk:{a:`ref`,dc:8,ok:{cred:3,msg:`Un câble, trois toits, un saut. Ils ont perdu ta trace — pour cette fois.`},ko:{hp:-24,msg:`Une balle te frôle l'épaule. Tu t'échappes en saignant.`}}},
    {t:`Racheter ta peau`,s:`−3 000 €$ · annule la suite`,req:R.ed(3000),fx:{ed:-3000,fn:`cancelHunt`,msg:`Un virement, un regard plein de mépris. « La prochaine fois, tu seras seul(e). » La prime est levée.`}}
  ]});
card({id:`hunt_2`,who:`@ex`,tag:`☠ Face à face`,cond:()=>false,
  tx:()=>`Un visage que tu connais : un de <strong>${EXN()}</strong> avec qui tu partageais le pain. Il se tient face à toi, l'arme baissée. « Je n'ai rien contre toi. Mais le chef a donné l'ordre. Et un ordre, c'est un ordre. » Ses yeux disent le contraire.`,
  ch:[
    {t:`Le convaincre de te laisser partir`,s:`SANG-FROID`,heavy:`Un échec peut te coûter cher.`,chk:{a:`cool`,dc:9,ok:{unflag:[`hunted`],cred:6,hum:6,msg:`Il baisse l'arme. « Va-t'en. Et ne reviens jamais. » Tu viens de gagner ta liberté.`},ko:{hp:-30,hum:-4,msg:`Il hésite, puis tire. Tu t'en sors, mais il t'a manqué de peu.`}}},
    {t:`Le combattre`,s:`CORPS · combat`,chk:{a:`body`,k:`cmb`,dc:9,ok:{unflag:[`hunted`],cred:8,hum:-8,msg:`Un combat bref et terrible. Il tombe. Tu regardes ton ancien ami un long moment.`},ko:{hp:-40,msg:`Il est meilleur que toi ce soir. Tu fuis, sanglant(e).`}}},
    {t:`Offrir tout ce que tu as`,s:`−5 000 €$ · réconciliation partielle`,req:R.ed(5000),fx:{ed:-5000,unflag:[`hunted`],hum:4,msg:`Tu lui tends l'argent. Il le regarde, puis toi. « Ça ne rachète rien. Mais je dirai que j'ai échoué. »`}}
  ]});
card({id:`ex_grudge`,who:`@ex`,tag:`Un ancien frère`,cond:()=>false,
  tx:()=>`Au détour d'un marché, un ancien de <strong>${EXN()}</strong> te croise. Rien n'est dit. Mais tout est dans le regard : la trahison n'a pas de prescription dans la rue.`,
  ch:[
    {t:`Lui parler franchement`,s:`SANG-FROID`,chk:{a:`cool`,dc:7,ok:{hum:5,cred:2,msg:`Un échange court, sans excuses. Il hoche la tête. Une trêve de fait.`},ko:{hp:-10,msg:`Il crache à terre. Un coup de poing que tu n'as pas vu venir.`}}},
    {t:`L'ignorer`,fx:{hum:-2,msg:`Tu passes ton chemin. Il ne te lâche pas du regard.`}},
    {t:`Le provoquer`,s:`Cred · risque`,chk:{a:`body`,dc:7,ok:{cred:4,msg:`Tu le fais reculer devant tout le monde.`},ko:{hp:-14,cred:-2,msg:`Il frappe plus fort que prévu.`}}}
  ]});
card({id:`duty_tribute`,who:`@fac`,tag:`Devoirs de la famille`,w:6,cond:()=>G.member&&G.flags.duty&&G.rank>=2&&!isLeader(),
  tx:()=>`Un haut gradé de <strong>${FAC[G.member].n}</strong> te rappelle les règles : « Plus on monte, plus on paie. La famille réclame sa part sur tes gains. C'est la loi. Tu es ${RANKS[FAC[G.member].k][G.rank]}, pas un touriste. »`,
  ch:[
    {t:`Payer ta part`,s:`−${`1 500`} €$ · loyauté`,req:R.ed(1500),fx:{ed:-1500,fn:`facLoyal`,hum:2,msg:`Tu payes sans un mot. Les anciens notent ta loyauté.`}},
    {t:`Négocier un délai`,s:`SANG-FROID`,chk:{a:`cool`,dc:8,ok:{cred:3,msg:`Tu obtiens un sursis, sans perdre la face.`},ko:{ed:-1500,fac:{},cred:-2,msg:`On te rappelle à l'ordre. Tu paies quand même.`}}},
    {t:`Refuser de payer`,s:`Défi · rep −`,heavy:`Refuser de payer ta famille est un défi ouvert. Elle s'en souviendra.`,fx:{cred:2,hum:-2,msg:`Silence glacial. Tu viens de te faire des ennemis dans ta propre maison.`,fn:`facDefy`}}
  ]});
card({id:`maelstrom_chrome`,who:`dum`,tag:`Maelstrom · Offre de chrome`,once:true,w:8,cond:()=>G.member===`maelstrom`&&G.rank>=1,
  tx:`Dum Dum te tape sur l'épaule, un sourire mécanique : « Un frère du Maelstrom ne se contente pas de sa chair. J'ai du chrome pour toi, gratuit. Un cadeau de la famille. Tu ne vas pas refuser, hein ? »`,
  ch:[
    {t:`Accepter le chrome`,s:`Gratuit · −Humanité`,heavy:`Le chrome Maelstrom ne coûte pas d'argent. Il coûte ce que tu as de plus précieux : ton humanité.`,fx:{cy:`kerenzikov`,hum:-12,fac:{maelstrom:8},cred:2,msg:`La lame brille sous ta peau. Dum Dum rit. « Bienvenue dans la lumière. »`}},
    {t:`Refuser poliment`,s:`Rep − · +Humanité`,fx:{hum:4,fac:{maelstrom:-10},cred:2,msg:`Le sourire de Dum Dum se fige. « Tu vois ça comme une insulte. Moi aussi. »`}}
  ]});
card({id:`leader_dispute`,who:`@fac`,tag:`Le poids du pouvoir`,cond:()=>false,
  tx:()=>`Deux de tes lieutenants se disputent devant tout le monde, au sujet d'un territoire. L'un est brillant et loyal, l'autre ambitieux et brutal. Tout le monde attend ton verdict. <strong>${FAC[G.member]?FAC[G.member].n:`La famille`}</strong> retient son souffle.`,
  ch:[
    {t:`Donner raison au loyal`,s:`Sûr · l'ambitieux t'en voudra`,fx:{cred:3,hum:3,echo:{leader_coup:6},msg:`Le loyal baisse la tête, reconnaissant. L'ambitieux serre la mâchoire. Il s'en souviendra.`}},
    {t:`Donner raison à l'ambitieux`,s:`Fort · −Humanité`,fx:{cred:5,hum:-4,msg:`L'ambitieux sourit. Le loyal te regarde avec une déception muette.`}},
    {t:`Trancher en leader`,s:`SANG-FROID`,heavy:`Tu imposes ta propre décision à tes deux lieutenants.`,chk:{a:`cool`,dc:8,ok:{cred:8,hum:3,msg:`Ton verdict est dur mais juste. Personne n'ose le contester.`},ko:{cred:-2,echo:{leader_coup:5},msg:`Ton verdict ne satisfait personne. Les couteaux se préparent.`}}}
  ]});
card({id:`leader_coup`,who:`@fac`,tag:`⚠ Complot`,cond:()=>false,
  tx:()=>`Une rumeur te parvient : un de tes proches lieutenants prépare un coup contre toi. Des discussions la nuit, des armes déplacées, des regards fuyants. <strong>${FAC[G.member]?FAC[G.member].n:`Ta famille`}</strong> pourrait basculer d'un jour à l'autre.`,
  ch:[
    {t:`Frapper en premier`,s:`CORPS · combat`,heavy:`Tu élimines un de tes propres lieutenants pour sauver ta place.`,chk:{a:`body`,k:`cmb`,dc:9,ok:{cred:9,hum:-8,msg:`Le complot meurt avec le traître. La famille te craint — et te suit.`},ko:{hp:-35,fn:`loseLead`,msg:`Le coup tourne mal. Tu perds la couronne et manques de perdre la vie.`}}},
    {t:`Acheter sa loyauté`,s:`−3 000 €$`,req:R.ed(3000),fx:{ed:-3000,cred:2,msg:`Un virement, un sourire. La loyauté s'achète, et se paie en retour.`}},
    {t:`Ignorer la rumeur`,s:`Risque de perdre le pouvoir`,chk:{a:`cool`,dc:7,ok:{cred:2,msg:`Ce n'était qu'une rumeur. Cette fois.`},ko:{fn:`loseLead`,hum:-4,msg:`Elle était vraie. On te retire la couronne au petit matin.`}}}
  ]});
card({id:`mine_traitor`,who:`narr`,tag:`⚠ Un lieutenant te trahit`,once:true,w:5,cond:()=>G.mine&&ownedList().length>=2,
  tx:()=>`Un de tes lieutenants négocie en secret avec un rival : il lui livre des infos sur les défenses de <strong>${G.mine.name}</strong>. Tu le sais. Lui ne sait pas que tu le sais.`,
  ch:[
    {t:`L'expulser`,s:`Puissance −1`,fx:{fn:`mineLose`,hum:2,cred:2,msg:`Il disparaît du jour au lendemain. Tes hommes comprennent le message.`}},
    {t:`Lui pardonner`,s:`Risque · +Humanité`,fx:{hum:8,echo:{leader_coup:8},msg:`Il baisse les yeux. « Merci. » Tu n'es pas sûr(e) que ce soit une bonne idée.`}},
    {t:`L'éliminer`,s:`−Humanité`,heavy:`Tu élimines quelqu'un qui t'a servi.`,fx:{hum:-10,cred:6,fn:`mineGrow`,msg:`Le silence qui suit est plus lourd que n'importe quel cri.`}}
  ]});

/* ---------- Nouveaux personnages ---------- */
card({id:`meet_chino`,who:`chino`,tag:`Rencontre · Chino`,once:true,w:6,cond:()=>rel(`chino`)<5&&(G.sub===`heywood`||(G.fac.valentinos||0)>=5),
  tx:`Devant l'église de Wellsprings, un Valentino aux mains abîmées allume une bougie. « Chino. On se croise souvent, toi et moi, sans jamais se parler. Un petit service ? J'ai besoin de quelqu'un en qui je peux avoir confiance pour porter un message à un vieux de Heywood. »`,
  ch:[
    {t:`Porter le message`,s:`SANG-FROID`,chk:{a:`cool`,dc:6,ok:{rel:{chino:14},fac:{valentinos:5},cred:3,msg:`Le vieux sourit, te serre la main. Chino hoche la tête en silence.`},ko:{rel:{chino:6},hp:-8,msg:`Un malentendu, un coup de bâton. Tu arrives quand même à t'expliquer.`}}},
    {t:`Lui dire de le faire lui-même`,fx:{rel:{chino:-3},msg:`Il hausse les épaules. « Comme tu veux, hermano. »`}}
  ]});
card({id:`chino_2`,who:`chino`,tag:`Chino · Une dette d'honneur`,once:true,w:7,cond:()=>rel(`chino`)>=30,
  tx:`Chino a le regard sombre : « Un des nôtres est tombé. Les Maelstrom. Je dois lui rendre justice, mais je ne veux pas partir seul. Tu es avec moi ? »`,
  ch:[
    {t:`Y aller avec lui`,s:`CORPS · combat`,chk:{a:`body`,k:`cmb`,dc:8,ok:{rel:{chino:16},fac:{valentinos:8,maelstrom:-8},cred:6,msg:`Une nuit rouge à Northside. Vous repartez ensemble, silencieux, vivants.`},ko:{hp:-30,rel:{chino:10},msg:`Ça tourne mal, mais vous vous couvrez l'un l'autre. Il ne l'oubliera pas.`}}},
    {t:`Le convaincre d'attendre`,s:`SANG-FROID`,fx:{rel:{chino:6},hum:4,msg:`« Peut-être que tu as raison. Mais ils ne vont pas oublier. »`}}
  ]});
card({id:`meet_nadia`,who:`nadia`,tag:`Rencontre · Nadia`,once:true,w:6,cond:()=>rel(`nadia`)<5&&yr()>=2072&&A(`int`)>=4,
  tx:`Une jeune femme aux cheveux rasés d'un côté t'attrape par le bras dans une ruelle de Kabuki. « Je m'appelle Nadia. J'étais Maelstrom. J'ai fui avec des données qu'ils veulent récupérer. J'ai besoin qu'on efface mes traces. Tu t'y connais ? »`,
  ch:[
    {t:`Effacer ses traces par hack`,s:`INTELLECT`,req:R.deck(),chk:{a:`int`,k:`hck`,dc:7,ok:{rel:{nadia:14},cred:3,fac:{maelstrom:-6},msg:`Un nettoyage propre, un code qui se dissout. Nadia soupire de soulagement.`},ko:{rel:{nadia:6},hp:-10,msg:`Un trace subsiste. Elle devra quitter la ville avant la fin de la semaine.`}}},
    {t:`La cacher quelque temps`,s:`SANG-FROID`,fx:{rel:{nadia:12},hum:4,fac:{maelstrom:-4},msg:`Un coin de toit, une couverture, un thé. Elle te regarde avec une reconnaissance silencieuse.`}},
    {t:`La livrer aux Maelstrom`,s:`−Humanité · Gros gain`,heavy:`Tu livres une fuyarde à ses bourreaux.`,fx:{ed:2500,hum:-14,fac:{maelstrom:10},rel:{nadia:-30},msg:`Ils te paient grassement. Elle crie ton nom quand ils l'emmènent.`}}
  ]});
card({id:`nadia_2`,who:`nadia`,tag:`Nadia · Une leçon`,once:true,w:7,cond:()=>rel(`nadia`)>=30,
  tx:`Nadia t'apprend ses astuces de netrunneuse maelstrom : des angles que personne n'enseigne. « Ils ne les ont pas inventés. Ils les ont volés. Je te les donne. »`,
  ch:[
    {t:`Apprendre`,s:`+XP INT`,fx:{xp:{int:6},rel:{nadia:10},hum:-2,msg:`Des raccourcis sombres, efficaces. Tu comprends mieux les cerveaux dérangés.`}},
    {t:`Lui demander ce qu'elle a vraiment volé`,fx:{rel:{nadia:8},cred:4,ed:800,msg:`Elle sourit : « Un peu d'argent, beaucoup de secrets. Prends ta part. »`}}
  ]});
card({id:`meet_mika`,who:`mika`,tag:`Rencontre · Mika`,once:true,w:6,cond:()=>rel(`mika`)<5&&(G.hp<75||G.cyber.length>=1),
  tx:`Une porte basse, un néon rose : « MIKA — soins sans questions ». À l'intérieur, une doc fatiguée, des mains sûres, des diplômes qui n'existent pas. « Assieds-toi. Ça va piquer. Mais moins que la rue. »`,
  ch:[
    {t:`La laisser te soigner`,s:`+Santé`,fx:{hp:30,rel:{mika:14},ed:-100,msg:`Quelques points de suture, une piqûre, un regard doux. Elle refuse la moitié du prix.`}},
    {t:`Lui poser des questions sur son travail`,s:`+Humanité`,fx:{hum:6,rel:{mika:10},msg:`Elle parle des cliniques qu'elle a perdues, des gens qu'elle a sauvés. Tu repars plus lourd(e)… et plus humain(e).`}}
  ]});
card({id:`mika_2`,who:`mika`,tag:`Mika · Un cadeau`,once:true,w:7,cond:()=>rel(`mika`)>=30,
  tx:`Mika ferme la porte et sort un étui de sous le comptoir : « Tendons renforcés, d'occasion. Pas de papiers, pas de garantie. Mais ils marchent. Je les gardais pour quelqu'un de bien. »`,
  ch:[
    {t:`Les accepter`,s:`Reinforced Tendons offerts`,fx:{cy:`tendons`,rel:{mika:10},hum:-3,msg:`Quelques minutes de douleur, puis une légèreté nouvelle dans les jambes.`}},
    {t:`Lui dire de les vendre`,s:`+Humanité`,fx:{hum:10,rel:{mika:14},msg:`Elle te regarde longtemps. « Tu es rare, toi. »`}}
  ]});
card({id:`meet_hiro`,who:`hiro`,tag:`Rencontre · Hiro`,once:true,w:6,cond:()=>rel(`hiro`)<5&&G.cred>=15,
  tx:`Dans un bar de Charter Hill, un ingénieur de Kang Tao regarde son verre : « Je suis Hiro. Je travaille sur des armes qu'on n'utilisera jamais dans le bon sens. Je voudrais partir. Si on me reconnaît, je suis mort. »`,
  ch:[
    {t:`L'aider à disparaître`,s:`SANG-FROID`,chk:{a:`cool`,dc:8,ok:{rel:{hiro:16},fac:{kangtao:-8},cred:4,msg:`Un faux nom, un billet de train. Il serre ta main longtemps.`},ko:{rel:{hiro:8},hp:-14,fac:{kangtao:-6},msg:`Un témoin te repère. Il s'en sort. Toi, avec une balle dans l'épaule.`}}},
    {t:`Le dénoncer à Kang Tao`,s:`+Rep corpo · −Humanité`,heavy:`Tu livres un homme qui t'a fait confiance.`,fx:{ed:1800,fac:{kangtao:12},hum:-10,rel:{hiro:-30},msg:`Kang Tao te remercie. Il ne sera plus jamais vu.`}}
  ]});
card({id:`hiro_2`,who:`hiro`,tag:`Hiro · Prototype`,once:true,w:7,cond:()=>rel(`hiro`)>=30,
  tx:`Hiro te remet une mallette : « Un prototype d'armure légère. Il m'a coûté mon poste, mais il est à toi. Ne le montre pas aux corpos. »`,
  ch:[
    {t:`L'accepter`,s:`Armure Kang Tao offerte`,fx:{gear:`kangarmor`,rel:{hiro:10},msg:`Elle épouse tes épaules comme une seconde peau. Presque trop belle.`}},
    {t:`Lui conseiller de la garder pour lui`,fx:{hum:8,rel:{hiro:14},msg:`« Tu es vraiment bizarre, toi. Ça me plaît. »`}}
  ]});
card({id:`meet_eli`,who:`eli`,tag:`Rencontre · Eli`,once:true,w:6,cond:()=>rel(`eli`)<5&&A(`int`)>=5,
  tx:`Un homme en costume banal s'assoit en face de toi dans un diner de Downtown. « Eli. NetWatch. Je ne devrais pas être là. Je ne devrais pas te parler. Mais j'ai des choses à dire sur ce qu'on cache sous le Mur. »`,
  ch:[
    {t:`L'écouter jusqu'au bout`,s:`INTELLECT`,chk:{a:`int`,dc:7,ok:{rel:{eli:14},xp:{int:3},cred:3,msg:`Il parle trois heures. Quand il part, tu sais des choses que tu aurais préféré ignorer.`},ko:{rel:{eli:6},hum:-3,msg:`Il parle trop vite. Tu retiens l'essentiel — et l'angoisse.`}}},
    {t:`Le dénoncer à NetWatch`,s:`−Humanité`,heavy:`Tu livres un homme qui te confie des secrets.`,fx:{ed:1500,hum:-8,rel:{eli:-30},msg:`NetWatch te remercie. Eli disparaît dans la semaine.`}}
  ]});
card({id:`eli_2`,who:`eli`,tag:`Eli · Un avertissement`,once:true,w:7,cond:()=>rel(`eli`)>=30,
  tx:`Eli te glisse un message : « NetWatch va lancer un balayage dans ton quartier. Évite le Net trois jours. Et prends ça : une porte dérobée que j'ai laissée pour moi. »`,
  ch:[
    {t:`Prendre la porte dérobée`,s:`+XP INT · +Cred`,fx:{xp:{int:4},cred:4,rel:{eli:10},msg:`Une adresse, un code. Un secret qu'il t'a confié, entre nous.`}},
    {t:`Le remercier et te mettre au vert`,s:`+Humanité`,fx:{hum:6,rel:{eli:12},msg:`Tu te fais discret(e). Le balayage ne trouve rien.`}}
  ]});
card({id:`meet_hands`,who:`hands`,tag:`Rencontre · Mr. Hands`,once:true,w:6,cond:()=>rel(`hands`)<5&&G.cred>=18,
  tx:`Un homme élégant te tend un verre sans te demander ton nom. « On m'appelle Mr. Hands. Je suis un fixer, comme d'autres. Sauf que je ne travaille pas pour tout le monde. Quand j'ai un client discret, je cherche quelqu'un de discret. »`,
  ch:[
    {t:`Écouter son offre`,s:`SANG-FROID`,chk:{a:`cool`,dc:8,ok:{rel:{hands:14},ed:2200,cred:5,msg:`Un contrat propre, une enveloppe épaisse. Il hoche la tête : « On se reverra. »`},ko:{rel:{hands:6},ed:300,msg:`Il lit en toi trop de nervosité. Il paie quand même, à contrecœur.`}}},
    {t:`Refuser, tu ne bosses pas pour n'importe qui`,s:`+Cred`,fx:{cred:3,rel:{hands:4},msg:`« Fier(e). J'aime ça. Réfléchis. »`}}
  ]});
card({id:`hands_2`,who:`hands`,tag:`Mr. Hands · Une faveur`,once:true,w:7,cond:()=>rel(`hands`)>=30,
  tx:`Mr. Hands te donne rendez-vous dans un salon vide : « J'ai un client qui ne peut pas être vu avec moi. Tu serais mes yeux. En échange : de l'argent, mon carnet, et ma discrétion. »`,
  ch:[
    {t:`Accepter`,s:`+Gain · +XP COOL`,fx:{ed:3500,xp:{cool:5},rel:{hands:12},cred:4,msg:`Tu fais ce qu'on te demande, sans une question. Il te paie le double.`}},
    {t:`Décliner`,fx:{rel:{hands:-2},hum:3}}
  ]});

/* ---------- Fixers déjà connus : lien + mission de niveau 2 ---------- */
card({id:`wk_2`,who:`wakako`,tag:`Wakako Okada · Faveur de Japantown`,once:true,w:7,cond:()=>rel(`wakako`)>=15,
  tx:`Wakako te reçoit dans son salon de thé, derrière un paravent. « Je suis une femme d'affaires. Dans ce milieu, on ne me doit rien, mais on m'est redevable. Un contrat difficile attend quelqu'un de discret. Je te l'offre. »`,
  ch:[
    {t:`Accepter le contrat`,s:`SANG-FROID`,chk:{a:`cool`,dc:8,ok:{ed:3200,cred:7,rel:{wakako:12},fac:{tygers:4},msg:`Tout se passe dans la discrétion. Wakako verse le thé : « Voilà qui est bien fait. »`},ko:{hp:-18,ed:400,rel:{wakako:4},msg:`Un imprévu, une blessure. Wakako te regarde avec une déception polie.`}}},
    {t:`Lui offrir un service en retour`,s:`+Lien`,fx:{rel:{wakako:10},cred:3,msg:`Elle sourit à peine. « Dans ce monde, la gratitude est une monnaie. »`}}

function tick(months){
  const k = months/STEP;
  let inc = 0;
  ownedList().forEach(d=>inc+=d.inc*3*(.4+.6*holdOf(d.id)/100)*(G.mine&&G.mine.type===`gang`?1.2:1));
  if(G.mine&&G.mine.type===`fixers`) inc+=300;
  if(G.flags.corpjob) inc+=140*STEP;
  if(G.member){ const kd=FAC[G.member].k; inc+= (kd===`corp`||kd===`ncpd`||kd===`trauma`?110:55)*(G.rank+1)*STEP*.6; }
  inc*=bm().income;
  const rent = clamp(30+Math.max(0,G.ed)*.004,30,150)*STEP*bm().rent;
  const net = Math.round((inc-rent)*k);
  G.ed += net;
  const reg = G.cyber.reduce((a,i)=>a+(CY(i).regen||0),0);
  if(reg) G.hp=clamp(G.hp+Math.round(reg*k),0,100);
  G.hp = clamp(G.hp+Math.round(5*k),0,100);
  G.t += months;
  G.age = START_AGE + Math.floor(G.t/12);
  if(ownedList().length){ G.cred=clamp(G.cred+ownedList().length*0.3*k|0,0,100); }
  return net;
}

const relSum = () => Object.values(G.rel||{}).reduce((a,v)=>a+Math.max(0,v),0);
function computeScore(kind){
  const years = yr()-START_YEAR;
  const attrSum = Object.keys(G.at).reduce((a,k)=>a+G.at[k],0);
  const dN = ownedList().length;
  const legend = G.flags.legend?1500:0;
  const fame = G.gear.reduce((a,i)=>a+(GEARMAP[i].fame||0)*300,0);
  const lines = [
    [`Années survécues (${years})`, years*90],
    [`Street Cred (${G.cred})`, G.cred*45],
    [`Pic de réputation (${G.stats.peak})`, G.stats.peak*15],
    [`Fortune`, Math.round(Math.max(0,G.ed)/12)],
    [`Humanité restante (${G.hum})`, G.hum*7],
    [`Quartiers contrôlés (${dN})`, dN*320],
    [`Faction « ${G.mine?G.mine.name:`—`} »`, G.mine?G.mine.power*260+400:0],
    [`Attributs (${attrSum})`, attrSum*25],
    [`Chrome installé (${G.cyber.length})`, G.cyber.length*80],
    [`Missions de faction (${G.stats.jobs})`, G.stats.jobs*60],
    [`Relations (${relSum()})`, relSum()*14],
    [`Légende & style`, legend+fame],
  ];
  let base = lines.reduce((a,l)=>a+l[1],0);
  const mult = ENDS[kind].m || ({retire:1.3,quit:1.15,blaze:G.cred>=30?1.2:0.9,flatline:.6,mercy:.6,psycho:.5,debt:.5}[kind]||1);
  return {lines, base, mult, total:Math.round(base*mult)};
}
function endGame(kind){

  store.del(`ncl_save`);
  const best=store.get(`ncl_best`)||[];
  const entry={name:G.name,score:sc.total,end:ENDS[kind].t,role:roleTitle(),year:yr(),age:G.age,date:Date.now()};

}
function checkEnd(){
  if(G.over) return true;
  if(G.hp<=0){
    const since=G.stats.cards-(G.lastRevive===undefined?-99:G.lastRevive);
    if(G.flags.trauma){ delete G.flags.trauma; G.hp=50; G.lastRevive=G.stats.cards; toast(`Trauma Team Platinum t'a sauvé(e) ! (abonnement utilisé)`); SFX.ok(); flash(`#05ffa1`); G.log.unshift({d:dateStr(),m:`Trauma Team Platinum t'a ramené(e) de justesse (abonnement utilisé).`}); return false; }
    if(G.ed>=3000&&since>=10){ G.ed-=3000; G.hp=35; G.lastRevive=G.stats.cards; toast(`Trauma Team t'a sauvé(e) : facture 3 000 €$`); SFX.ok(); flash(`#05ffa1`); G.log.unshift({d:dateStr(),m:`Trauma Team intervient en urgence : facture de 3 000 €$.`}); return false; }
    endGame(`flatline`); return true;
  }
  if(G.hum<=0){ endGame(`psycho`); return true; }
  if(G.ed<=-4000){ endGame(`debt`); return true; }
  for(const b of Object.keys(BLOCS)){ const v=(G.bloc||{})[b]; if(v<=0){ endGame(`bloc_${b}_lo`); return true; } if(v>=100){ endGame(`bloc_${b}_hi`); return true; } }
  if(G.age>=RETIRE_AGE){ endGame(`retire`); return true; }

}

function beep(f,d=.08,type=`square`,v=.035,slide=0){

    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

function skyline(){

  let x=0; const cols=[`#ff2a6d`,`#00f0ff`,`#fcee0a`,`#c77dff`];
  while(x<400){
    const w=14+Math.random()*28, h=40+Math.random()*110, c=cols[Math.floor(Math.random()*4)];
    s+=`<rect x="${x}" y="${160-h}" width="${w}" height="${h}" fill="#0c0c1a" stroke="${c}" stroke-opacity=".35"/>`;
    for(let i=0;i<Math.floor(h/14);i++) if(Math.random()>.55) s+=`<rect x="${x+3+Math.random()*(w-8)}" y="${160-h+6+i*13}" width="3" height="4" fill="${c}" opacity=".8"/>`;

  }
  return s+`</svg>`;
}

    ${G.newBest?`<div class="newbest hd">★ NOUVEAU RECORD ★</div>`:``}
    <div class="score" id="sc">0</div>
    <div class="brk">${s.lines.map(l=>`<div><span>${esc(l[0])}</span><b>${l[1].toLocaleString(`fr`)}</b></div>`).join(``)}<div><span>Sous-total</span><b>${Math.round(s.base).toLocaleString(`fr`)}</b></div><div><span>Multiplicateur de fin</span><b style="color:var(--y)">×${s.mult}</b></div></div>
    <div class="stack"><button class="btn pri" id="again">Nouvelle vie</button><button class="btn" id="home">Titre</button><button class="btn" id="share">Copier mon score</button></div></div>`;
  let n=0; const tgt=s.total, step=Math.max(1,Math.round(tgt/60)); const iv=setInterval(()=>{ n=Math.min(tgt,n+step); $(`#sc`).textContent=n.toLocaleString(`fr`); if(n>=tgt)clearInterval(iv); },20);
  if(k===`retire`||k===`blaze`||k===`quit`||e.good) SFX.ok(); else { SFX.ko(); flash(`#ff2a6d`); }
  $(`#again`).onclick=()=>{SFX.tap();showCreate()}; $(`#home`).onclick=()=>{SFX.tap();showTitle()};
  $(`#share`).onclick=()=>{ const t=`NIGHT CITY LEGEND — ${G.name} (${roleTitle()}) : ${tgt.toLocaleString(`fr`)} pts · ${e.t} à ${G.age} ans`; try{navigator.clipboard.writeText(t);toast(`Copié !`)}catch(_){toast(t)} };
}
function legendTitle(k){
  const r=roleTitle();
  if(G.cred>=90) return `Légende de Night City · ${r}`;
  if(G.cred>=60) return `${r} respecté(e) · Afterlife te connaît`;
  if(G.cred>=30) return `${r} de renom`;
  if(G.cred>=12) return `${r} local(e)`;
  return `Un nom oublié dans la foule`;
}

/* ---------- init ---------- */
function boot(){
  document.body.insertAdjacentHTML(`beforeend`,`<div id="fx"></div><div id="vig"></div><div id="flash"></div>`);
  showTitle();
}
window.addEventListener(`error`,e=>{ const r=$(`#root`); if(r&&!r.querySelector(`.screen`)) r.innerHTML=`<div style="padding:24px;color:#ff2a6d;font:14px monospace">Erreur : ${esc(e.message||`inconnue`)}<br><br><button onclick="try{localStorage.clear()}catch(e){};location.reload()" style="padding:10px;font:inherit">Réinitialiser et recharger</button></div>`; });
if(document.readyState===`loading`) window.addEventListener(`DOMContentLoaded`,boot); else boot();
if('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
