  ch:[
    {t:`Payer ta part`,s:`−${`1 500`} €$ · loyauté`,req:R.ed(1500),fx:{ed:-1500,fn:`facLoyal`,hum:2,msg:`Tu payes sans un mot. Les anciens notent ta loyauté.`}},
    {t:`Négocier un délai`,s:`SANG-FROID`,chk:{a:`cool`,dc:8,ok:{cred:3,msg:`Tu obtiens un sursis, sans perdre la face.`},ko:{ed:-1500,fac:{},cred:-2,msg:`On te rappelle à l'ordre. Tu paies quand même.`}}},
    {t:`Refuser de payer`,s:`Défi · rep −`,heavy:`Refuser de payer ta famille est un défi ouvert. Elle s'en souviendra.`,fx:{cred:2,hum:-2,msg:`Silence glacial. Tu viens de te faire des ennemis dans ta propre maison.`,fn:`facDefy`}}
  ]});
card({id:`maelstrom_chrome`,who:`dum`,tag:`Maelstrom · Offre de chrome`,once:true,w:8,cond:()=>G.member===`maelstrom`&&G.rank>=1,
  tx:`Dum Dum te tape sur l'épaule, un sourire mécanique : « Un frère du Maelstrom ne se contente pas de sa chair. J'ai du chrome pour toi, gratuit. Un cadeau de la famille. Tu ne vas pas refuser, hein ? »`,
  ch:[
    {t:`Accepter le chrome`,s:`Gratuit · −Humanité`,heavy:`Le chrome Maelstrom ne coûte pas d'argent. Il coûte ce que tu as de plus précieux : ton humanité.`,fx:{cy:`kerenzikov`,hum:-12,fac:{maelstrom:8},cred:2,msg:`La lame brille sous ta peau. Dum Dum rit. « Bienvenue dans la lumière. »`}},
    {t:`Refuser poliment`,s:`Rep − · +Humanité`,fx:{hum:4,fac:{maelstrom:-10},cred:2,msg:`Le sourire de Dum Dum se fige. « Tu vois ça comme une insulte. Moi aussi. »`}}
  ]});
card({id:`leader_dispute`,who:`@fac`,tag:`Le poids du pouvoir`,cond:()=>false,
  tx:()=>`Deux de tes lieutenants se disputent devant tout le monde, au sujet d'un territoire. L'un est brillant et loyal, l'autre ambitieux et brutal. Tout le monde attend ton verdict. <strong>${FAC[G.member]?FAC[G.member].n:`La famille`}</strong> retient son souffle.`,
  ch:[
    {t:`Donner raison au loyal`,s:`Sûr · l'ambitieux t'en voudra`,fx:{cred:3,hum:3,echo:{leader_coup:6},msg:`Le loyal baisse la tête, reconnaissant. L'ambitieux serre la mâchoire. Il s'en souviendra.`}},
    {t:`Donner raison à l'ambitieux`,s:`Fort · −Humanité`,fx:{cred:5,hum:-4,msg:`L'ambitieux sourit. Le loyal te regarde avec une déception muette.`}},
    {t:`Trancher en leader`,s:`SANG-FROID`,heavy:`Tu imposes ta propre décision à tes deux lieutenants.`,chk:{a:`cool`,dc:8,ok:{cred:8,hum:3,msg:`Ton verdict est dur mais juste. Personne n'ose le contester.`},ko:{cred:-2,echo:{leader_coup:5},msg:`Ton verdict ne satisfait personne. Les couteaux se préparent.`}}}
  ]});
card({id:`leader_coup`,who:`@fac`,tag:`⚠ Complot`,cond:()=>false,
  tx:()=>`Une rumeur te parvient : un de tes proches lieutenants prépare un coup contre toi. Des discussions la nuit, des armes déplacées, des regards fuyants. <strong>${FAC[G.member]?FAC[G.member].n:`Ta famille`}</strong> pourrait basculer d'un jour à l'autre.`,
  ch:[
    {t:`Frapper en premier`,s:`CORPS · combat`,heavy:`Tu élimines un de tes propres lieutenants pour sauver ta place.`,chk:{a:`body`,k:`cmb`,dc:9,ok:{cred:9,hum:-8,msg:`Le complot meurt avec le traître. La famille te craint — et te suit.`},ko:{hp:-35,fn:`loseLead`,msg:`Le coup tourne mal. Tu perds la couronne et manques de perdre la vie.`}}},
    {t:`Acheter sa loyauté`,s:`−3 000 €$`,req:R.ed(3000),fx:{ed:-3000,cred:2,msg:`Un virement, un sourire. La loyauté s'achète, et se paie en retour.`}},
    {t:`Ignorer la rumeur`,s:`Risque de perdre le pouvoir`,chk:{a:`cool`,dc:7,ok:{cred:2,msg:`Ce n'était qu'une rumeur. Cette fois.`},ko:{fn:`loseLead`,hum:-4,msg:`Elle était vraie. On te retire la couronne au petit matin.`}}}
  ]});
card({id:`mine_traitor`,who:`narr`,tag:`⚠ Un lieutenant te trahit`,once:true,w:5,cond:()=>G.mine&&ownedList().length>=2,
  tx:()=>`Un de tes lieutenants négocie en secret avec un rival : il lui livre des infos sur les défenses de <strong>${G.mine.name}</strong>. Tu le sais. Lui ne sait pas que tu le sais.`,
  ch:[
    {t:`L'expulser`,s:`Puissance −1`,fx:{fn:`mineLose`,hum:2,cred:2,msg:`Il disparaît du jour au lendemain. Tes hommes comprennent le message.`}},
    {t:`Lui pardonner`,s:`Risque · +Humanité`,fx:{hum:8,echo:{leader_coup:8},msg:`Il baisse les yeux. « Merci. » Tu n'es pas sûr(e) que ce soit une bonne idée.`}},
    {t:`L'éliminer`,s:`−Humanité`,heavy:`Tu élimines quelqu'un qui t'a servi.`,fx:{hum:-10,cred:6,fn:`mineGrow`,msg:`Le silence qui suit est plus lourd que n'importe quel cri.`}}
  ]});

/* ---------- Nouveaux personnages ---------- */
card({id:`meet_chino`,who:`chino`,tag:`Rencontre · Chino`,once:true,w:6,cond:()=>rel(`chino`)<5&&(G.sub===`heywood`||(G.fac.valentinos||0)>=5),
  tx:`Devant l'église de Wellsprings, un Valentino aux mains abîmées allume une bougie. « Chino. On se croise souvent, toi et moi, sans jamais se parler. Un petit service ? J'ai besoin de quelqu'un en qui je peux avoir confiance pour porter un message à un vieux de Heywood. »`,
  ch:[
    {t:`Porter le message`,s:`SANG-FROID`,chk:{a:`cool`,dc:6,ok:{rel:{chino:14},fac:{valentinos:5},cred:3,msg:`Le vieux sourit, te serre la main. Chino hoche la tête en silence.`},ko:{rel:{chino:6},hp:-8,msg:`Un malentendu, un coup de bâton. Tu arrives quand même à t'expliquer.`}}},
    {t:`Lui dire de le faire lui-même`,fx:{rel:{chino:-3},msg:`Il hausse les épaules. « Comme tu veux, hermano. »`}}
  ]});
card({id:`chino_2`,who:`chino`,tag:`Chino · Une dette d'honneur`,once:true,w:7,cond:()=>rel(`chino`)>=30,
  tx:`Chino a le regard sombre : « Un des nôtres est tombé. Les Maelstrom. Je dois lui rendre justice, mais je ne veux pas partir seul. Tu es avec moi ? »`,
  ch:[
    {t:`Y aller avec lui`,s:`CORPS · combat`,chk:{a:`body`,k:`cmb`,dc:8,ok:{rel:{chino:16},fac:{valentinos:8,maelstrom:-8},cred:6,msg:`Une nuit rouge à Northside. Vous repartez ensemble, silencieux, vivants.`},ko:{hp:-30,rel:{chino:10},msg:`Ça tourne mal, mais vous vous couvrez l'un l'autre. Il ne l'oubliera pas.`}}},
    {t:`Le convaincre d'attendre`,s:`SANG-FROID`,fx:{rel:{chino:6},hum:4,msg:`« Peut-être que tu as raison. Mais ils ne vont pas oublier. »`}}
  ]});
card({id:`meet_nadia`,who:`nadia`,tag:`Rencontre · Nadia`,once:true,w:6,cond:()=>rel(`nadia`)<5&&yr()>=2072&&A(`int`)>=4,
  tx:`Une jeune femme aux cheveux rasés d'un côté t'attrape par le bras dans une ruelle de Kabuki. « Je m'appelle Nadia. J'étais Maelstrom. J'ai fui avec des données qu'ils veulent récupérer. J'ai besoin qu'on efface mes traces. Tu t'y connais ? »`,
  ch:[
    {t:`Effacer ses traces par hack`,s:`INTELLECT`,req:R.deck(),chk:{a:`int`,k:`hck`,dc:7,ok:{rel:{nadia:14},cred:3,fac:{maelstrom:-6},msg:`Un nettoyage propre, un code qui se dissout. Nadia soupire de soulagement.`},ko:{rel:{nadia:6},hp:-10,msg:`Un trace subsiste. Elle devra quitter la ville avant la fin de la semaine.`}}},
    {t:`La cacher quelque temps`,s:`SANG-FROID`,fx:{rel:{nadia:12},hum:4,fac:{maelstrom:-4},msg:`Un coin de toit, une couverture, un thé. Elle te regarde avec une reconnaissance silencieuse.`}},
    {t:`La livrer aux Maelstrom`,s:`−Humanité · Gros gain`,heavy:`Tu livres une fuyarde à ses bourreaux.`,fx:{ed:2500,hum:-14,fac:{maelstrom:10},rel:{nadia:-30},msg:`Ils te paient grassement. Elle crie ton nom quand ils l'emmènent.`}}
  ]});
card({id:`nadia_2`,who:`nadia`,tag:`Nadia · Une leçon`,once:true,w:7,cond:()=>rel(`nadia`)>=30,
  tx:`Nadia t'apprend ses astuces de netrunneuse maelstrom : des angles que personne n'enseigne. « Ils ne les ont pas inventés. Ils les ont volés. Je te les donne. »`,
  ch:[
    {t:`Apprendre`,s:`+XP INT`,fx:{xp:{int:6},rel:{nadia:10},hum:-2,msg:`Des raccourcis sombres, efficaces. Tu comprends mieux les cerveaux dérangés.`}},
    {t:`Lui demander ce qu'elle a vraiment volé`,fx:{rel:{nadia:8},cred:4,ed:800,msg:`Elle sourit : « Un peu d'argent, beaucoup de secrets. Prends ta part. »`}}
  ]});
card({id:`meet_mika`,who:`mika`,tag:`Rencontre · Mika`,once:true,w:6,cond:()=>rel(`mika`)<5&&(G.hp<75||G.cyber.length>=1),
  tx:`Une porte basse, un néon rose : « MIKA — soins sans questions ». À l'intérieur, une doc fatiguée, des mains sûres, des diplômes qui n'existent pas. « Assieds-toi. Ça va piquer. Mais moins que la rue. »`,
  ch:[
    {t:`La laisser te soigner`,s:`+Santé`,fx:{hp:30,rel:{mika:14},ed:-100,msg:`Quelques points de suture, une piqûre, un regard doux. Elle refuse la moitié du prix.`}},
    {t:`Lui poser des questions sur son travail`,s:`+Humanité`,fx:{hum:6,rel:{mika:10},msg:`Elle parle des cliniques qu'elle a perdues, des gens qu'elle a sauvés. Tu repars plus lourd(e)… et plus humain(e).`}}
  ]});
card({id:`mika_2`,who:`mika`,tag:`Mika · Un cadeau`,once:true,w:7,cond:()=>rel(`mika`)>=30,
  tx:`Mika ferme la porte et sort un étui de sous le comptoir : « Tendons renforcés, d'occasion. Pas de papiers, pas de garantie. Mais ils marchent. Je les gardais pour quelqu'un de bien. »`,
  ch:[
    {t:`Les accepter`,s:`Reinforced Tendons offerts`,fx:{cy:`tendons`,rel:{mika:10},hum:-3,msg:`Quelques minutes de douleur, puis une légèreté nouvelle dans les jambes.`}},
    {t:`Lui dire de les vendre`,s:`+Humanité`,fx:{hum:10,rel:{mika:14},msg:`Elle te regarde longtemps. « Tu es rare, toi. »`}}
  ]});
card({id:`meet_hiro`,who:`hiro`,tag:`Rencontre · Hiro`,once:true,w:6,cond:()=>rel(`hiro`)<5&&G.cred>=15,
  tx:`Dans un bar de Charter Hill, un ingénieur de Kang Tao regarde son verre : « Je suis Hiro. Je travaille sur des armes qu'on n'utilisera jamais dans le bon sens. Je voudrais partir. Si on me reconnaît, je suis mort. »`,
  ch:[
    {t:`L'aider à disparaître`,s:`SANG-FROID`,chk:{a:`cool`,dc:8,ok:{rel:{hiro:16},fac:{kangtao:-8},cred:4,msg:`Un faux nom, un billet de train. Il serre ta main longtemps.`},ko:{rel:{hiro:8},hp:-14,fac:{kangtao:-6},msg:`Un témoin te repère. Il s'en sort. Toi, avec une balle dans l'épaule.`}}},
    {t:`Le dénoncer à Kang Tao`,s:`+Rep corpo · −Humanité`,heavy:`Tu livres un homme qui t'a fait confiance.`,fx:{ed:1800,fac:{kangtao:12},hum:-10,rel:{hiro:-30},msg:`Kang Tao te remercie. Il ne sera plus jamais vu.`}}
  ]});
card({id:`hiro_2`,who:`hiro`,tag:`Hiro · Prototype`,once:true,w:7,cond:()=>rel(`hiro`)>=30,
  tx:`Hiro te remet une mallette : « Un prototype d'armure légère. Il m'a coûté mon poste, mais il est à toi. Ne le montre pas aux corpos. »`,
  ch:[
    {t:`L'accepter`,s:`Armure Kang Tao offerte`,fx:{gear:`kangarmor`,rel:{hiro:10},msg:`Elle épouse tes épaules comme une seconde peau. Presque trop belle.`}},
    {t:`Lui conseiller de la garder pour lui`,fx:{hum:8,rel:{hiro:14},msg:`« Tu es vraiment bizarre, toi. Ça me plaît. »`}}
  ]});
card({id:`meet_eli`,who:`eli`,tag:`Rencontre · Eli`,once:true,w:6,cond:()=>rel(`eli`)<5&&A(`int`)>=5,
  tx:`Un homme en costume banal s'assoit en face de toi dans un diner de Downtown. « Eli. NetWatch. Je ne devrais pas être là. Je ne devrais pas te parler. Mais j'ai des choses à dire sur ce qu'on cache sous le Mur. »`,
  ch:[
    {t:`L'écouter jusqu'au bout`,s:`INTELLECT`,chk:{a:`int`,dc:7,ok:{rel:{eli:14},xp:{int:3},cred:3,msg:`Il parle trois heures. Quand il part, tu sais des choses que tu aurais préféré ignorer.`},ko:{rel:{eli:6},hum:-3,msg:`Il parle trop vite. Tu retiens l'essentiel — et l'angoisse.`}}},
    {t:`Le dénoncer à NetWatch`,s:`−Humanité`,heavy:`Tu livres un homme qui te confie des secrets.`,fx:{ed:1500,hum:-8,rel:{eli:-30},msg:`NetWatch te remercie. Eli disparaît dans la semaine.`}}
  ]});
card({id:`eli_2`,who:`eli`,tag:`Eli · Un avertissement`,once:true,w:7,cond:()=>rel(`eli`)>=30,
  tx:`Eli te glisse un message : « NetWatch va lancer un balayage dans ton quartier. Évite le Net trois jours. Et prends ça : une porte dérobée que j'ai laissée pour moi. »`,
  ch:[
    {t:`Prendre la porte dérobée`,s:`+XP INT · +Cred`,fx:{xp:{int:4},cred:4,rel:{eli:10},msg:`Une adresse, un code. Un secret qu'il t'a confié, entre nous.`}},
    {t:`Le remercier et te mettre au vert`,s:`+Humanité`,fx:{hum:6,rel:{eli:12},msg:`Tu te fais discret(e). Le balayage ne trouve rien.`}}
  ]});
card({id:`meet_hands`,who:`hands`,tag:`Rencontre · Mr. Hands`,once:true,w:6,cond:()=>rel(`hands`)<5&&G.cred>=18,
  tx:`Un homme élégant te tend un verre sans te demander ton nom. « On m'appelle Mr. Hands. Je suis un fixer, comme d'autres. Sauf que je ne travaille pas pour tout le monde. Quand j'ai un client discret, je cherche quelqu'un de discret. »`,
  ch:[
    {t:`Écouter son offre`,s:`SANG-FROID`,chk:{a:`cool`,dc:8,ok:{rel:{hands:14},ed:2200,cred:5,msg:`Un contrat propre, une enveloppe épaisse. Il hoche la tête : « On se reverra. »`},ko:{rel:{hands:6},ed:300,msg:`Il lit en toi trop de nervosité. Il paie quand même, à contrecœur.`}}},
    {t:`Refuser, tu ne bosses pas pour n'importe qui`,s:`+Cred`,fx:{cred:3,rel:{hands:4},msg:`« Fier(e). J'aime ça. Réfléchis. »`}}
  ]});
card({id:`hands_2`,who:`hands`,tag:`Mr. Hands · Une faveur`,once:true,w:7,cond:()=>rel(`hands`)>=30,
  tx:`Mr. Hands te donne rendez-vous dans un salon vide : « J'ai un client qui ne peut pas être vu avec moi. Tu serais mes yeux. En échange : de l'argent, mon carnet, et ma discrétion. »`,
  ch:[
    {t:`Accepter`,s:`+Gain · +XP COOL`,fx:{ed:3500,xp:{cool:5},rel:{hands:12},cred:4,msg:`Tu fais ce qu'on te demande, sans une question. Il te paie le double.`}},
    {t:`Décliner`,fx:{rel:{hands:-2},hum:3}}
  ]});

/* ---------- Fixers déjà connus : lien + mission de niveau 2 ---------- */
card({id:`wk_2`,who:`wakako`,tag:`Wakako Okada · Faveur de Japantown`,once:true,w:7,cond:()=>rel(`wakako`)>=15,
  tx:`Wakako te reçoit dans son salon de thé, derrière un paravent. « Je suis une femme d'affaires. Dans ce milieu, on ne me doit rien, mais on m'est redevable. Un contrat difficile attend quelqu'un de discret. Je te l'offre. »`,
  ch:[
    {t:`Accepter le contrat`,s:`SANG-FROID`,chk:{a:`cool`,dc:8,ok:{ed:3200,cred:7,rel:{wakako:12},fac:{tygers:4},msg:`Tout se passe dans la discrétion. Wakako verse le thé : « Voilà qui est bien fait. »`},ko:{hp:-18,ed:400,rel:{wakako:4},msg:`Un imprévu, une blessure. Wakako te regarde avec une déception polie.`}}},
    {t:`Lui offrir un service en retour`,s:`+Lien`,fx:{rel:{wakako:10},cred:3,msg:`Elle sourit à peine. « Dans ce monde, la gratitude est une monnaie. »`}}
  ]});
card({id:`rg_2`,who:`regina`,tag:`Regina Jones · Contrat spécial`,once:true,w:7,cond:()=>rel(`regina`)>=15,
  tx:`Regina déplie une carte : « Un client veut qu'une certaine personne arrête de causer des problèmes. Un cas… sensible. Je ne confie ça qu'aux gens en qui j'ai confiance. »`,
  ch:[
    {t:`Mener l'opération avec discrétion`,s:`RÉFLEXES · furtivité`,chk:{a:`ref`,k:`stl`,dc:8,ok:{ed:3400,cred:7,rel:{regina:12},msg:`Ni vu ni connu. Regina te remet l'enveloppe sans un mot.`},ko:{hp:-24,ed:300,rel:{regina:4},msg:`Un témoin. Tu t'en sors, mais l'affaire est moins propre que prévu.`}}},
    {t:`Refuser, trop dangereux`,s:`+Humanité`,fx:{hum:5,rel:{regina:2},msg:`« Je comprends. Je confierai à quelqu'un d'autre. »`}}
  ]});
card({id:`pd_2`,who:`padre`,tag:`Padre · Dans le barrio`,once:true,w:7,cond:()=>rel(`padre`)>=15,
  tx:`Padre t'accueille à l'arrière de son église, les bras ouverts : « Tu as aidé mon barrio, et tu n'as rien demandé. Ici, on n'oublie pas. Une famille de Wellsprings a besoin d'un protecteur. Tu serais le bon. »`,
  ch:[
    {t:`Protéger la famille`,s:`CORPS`,chk:{a:`body`,k:`cmb`,dc:8,ok:{ed:1800,hum:8,cred:6,rel:{padre:12},fac:{valentinos:8},msg:`Quelques nuits de garde, un casseur dissuadé. La famille t'embrasse comme un fils.`},ko:{hp:-22,hum:4,rel:{padre:6},msg:`Un cambriolage tourne mal, mais personne n'est mort. Padre te remercie quand même.`}}},
    {t:`Leur offrir de l'argent`,s:`−600 €$`,req:R.ed(600),fx:{ed:-600,hum:8,rel:{padre:12},msg:`Padre bénit ta générosité. Elle sera rendue, d'une façon ou d'une autre.`}}
  ]});

/* ---------- Muamar Reyes ---------- */
card({id:`meet_muamar`,who:`muamar`,tag:`Rencontre · Muamar Reyes`,once:true,w:6,cond:()=>rel(`muamar`)<5&&G.cred>=14,
  tx:`Un homme élégant t'aborde dans un garage de Santo Domingo, un cigare éteint aux lèvres. « Muamar Reyes. Ici, on m'appelle El Capitán. Fixer. On m'a parlé de toi. Je n'aime pas perdre mon temps, alors voici l'idée : un coffre dans un entrepôt de Pacifica, trois hommes dessus, et un client prêt à payer cher. »`,
  ch:[
    {t:`Poser des questions`,s:`INTELLECT`,chk:{a:`int`,dc:7,ok:{rel:{muamar:14},cred:3,ed:600,msg:`Tu as pris le temps de comprendre. Il apprécie : « Prudent. J'aime ça. »`},ko:{rel:{muamar:6},msg:`Il s'impatiente. Mais t'a retenu(e).`}}},
    {t:`Dire oui tout de suite`,s:`Impulsif`,fx:{rel:{muamar:8},cred:2,ed:300,msg:`« Enthousiaste. Voyons si ça dure. »`}}
  ]});
card({id:`muamar_job`,who:`muamar`,tag:`Muamar · Le coffre`,w:7,once:true,cond:()=>rel(`muamar`)>=10,
  tx:`Muamar te retrouve devant l'entrepôt de Pacifica. « Trois gardes, une caméra, un coffre. Je ne te dis pas comment. Je te dis combien : <strong>4 000 €$</strong>. »`,
  ch:[
    {t:`Crocheter le coffre en silence`,s:`TECHNIQUE`,chk:{a:`tech`,dc:8,ok:{ed:4000,cred:7,rel:{muamar:12},msg:`Un clic, un deuxième, le coffre s'ouvre. Muamar sourit sans rien dire.`},ko:{hp:-20,ed:400,msg:`L'alarme se déclenche. Tu t'enfuis avec un lingot, pas plus.`}}},
    {t:`Maîtriser les gardes`,s:`CORPS · combat`,chk:{a:`body`,k:`cmb`,dc:8,ok:{ed:4000,cred:8,rel:{muamar:10},msg:`Trois gardes, trois sacs de sable. Le coffre est à toi.`},ko:{hp:-30,ed:500,msg:`Une fusillade plus longue que prévu.`}}},
    {t:`Pirater les caméras`,s:`INTELLECT · hack`,req:R.deck(),chk:{a:`int`,k:`hck`,dc:7,ok:{ed:4000,cred:7,rel:{muamar:12},role:{net:1},msg:`Les caméras se figent. Tu repars avec le coffre sous le bras.`},ko:{hp:-12,ed:400,msg:`Les caméras te voient une seconde de trop.`}}}
  ]});
card({id:`muamar_gift`,who:`muamar`,tag:`Muamar · Une part`,once:true,w:7,cond:()=>rel(`muamar`)>=30,
  tx:`Muamar te tend une valise : « Une partie de ce qu'on a gagné ensemble. Plus ce que je réserve à mes gens de confiance. »`,
  ch:[
    {t:`Prendre la valise`,s:`+Gain`,fx:{ed:5000,cred:4,rel:{muamar:8},msg:`Elle est lourde, elle est belle. Muamar sourit : « À la prochaine. »`}},
    {t:`La lui laisser`,s:`+Lien`,fx:{rel:{muamar:16},cred:6,msg:`Il lève un sourcil, puis un verre. « Tu es spécial(e). »`}}
  ]});

/* ---------- Faraday (époque Edgerunners) ---------- */
card({id:`meet_faraday`,who:`faraday`,tag:`Rencontre · Faraday`,once:true,w:6,cond:()=>rel(`faraday`)<5&&yr()>=2074&&G.cred>=12,
  tx:`Un homme à la voix posée t'invite à sa table à l'Afterlife : « Faraday. Je fixe pour ceux qui n'ont plus rien à perdre. Les Edgerunners, on les connaît. Tu veux travailler pour moi ? »`,
  ch:[
    {t:`Accepter de l'écouter`,s:`SANG-FROID`,chk:{a:`cool`,dc:7,ok:{rel:{faraday:14},cred:3,msg:`Il te jauge puis acquiesce. « Je sens que tu iras loin. »`},ko:{rel:{faraday:6},msg:`Il fronce les sourcils. « Tu as encore du chemin. »`}}},
    {t:`Refuser`,fx:{rel:{faraday:-2},msg:`« Comme tu voudras. Les Edgerunners ne manquent pas. »`}}
  ]});
card({id:`faraday_job`,who:`faraday`,tag:`Faraday · Contrat à haut risque`,once:true,w:7,cond:()=>rel(`faraday`)>=10,
  tx:`Faraday te glisse une puce : « Un transfert de données pour un client discret. Un convoi Militech, deux escortes, un gamin avec un Sandevistan. <strong>5 000 €$</strong>. Ce n'est pas pour les timides. »`,

/* =====================================================================
   CARTES 9 — l'Afterlife : une halte imposée, tout est un choix.
   Boutique, contrats et repos sont des cartes avec prix et risques.
   ===================================================================== */
const effTxt = o => [
  ...Object.entries(o.at||{}).map(([k,v])=>`+${v} ${ATTRS[k].n}`),
  ...Object.entries(o.k||{}).map(([k,v])=>`+${v} ${{cmb:`combat`,drv:`conduite`,hck:`hack`,stl:`furtivité`,soc:`social`}[k]}`),
  o.mit?`−${Math.round(o.mit*100)}% dégâts`:``, o.regen?`soin auto`:``, o.deck?`${o.deck} slots hack`:``
].filter(Boolean).join(` · `);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const NOPE = (t,m) => ({t:t||`Repartir sans rien acheter`,s:`Garde tes eddies`,fx:{msg:m||`Tu ranges ton portefeuille. Ça ne se fait pas tous les jours.`}});

card({id:`afterlife_hub`,who:`@hub`,tag:`🍸 Afterlife · Une halte`,cond:()=>false,
  tx:()=>{
    if(!G.inHub){ G.inHub=true; G.hubLeft=2; G.hubUsed={}; }
    const hurt=G.hp<50, broke=G.ed<300, first=G.hubLeft>=2;
    return first
      ? `Tu pousses la porte de l'<strong>Afterlife</strong>. Néons rouges, basses sourdes. Tu as le temps de faire <strong>deux choses</strong> ce soir, pas une de plus.${hurt?` <em>Tu saignes encore.</em>`:``}${broke?` <em>Ton portefeuille est presque vide.</em>`:``}`
      : `La nuit avance à l'<strong>Afterlife</strong>. Il te reste <strong>un dernier moment</strong> avant de repartir.`;
  },
  dyn:()=>{
    const o=(k,t,s,next)=>({t,s,req:()=>G.hubUsed&&G.hubUsed[k]?`Déjà fait ce soir`:``,fx:{next,nav:true,hub:k}});
    return [
      o(`chrome`,`Voir le ripperdoc de passage`,`Chrome & hacks · achète ou repars`,`shop_chrome`),
      o(`gear`,`Fouiller le marché noir`,`Armes, armures, véhicules, style`,`shop_gear`),
      o(`gig`,`Chercher un contrat`,`Un coup à jouer, des risques à prendre`,`gig_board`),
      o(`rest`,`Te reposer`,`Soins · thérapie · fête`,`rest_card`),
      o(`trip`,`Prendre la route`,`Changer de quartier · rencontres locales`,`travel_card`),
      {t:`Repartir dans la rue`,s:G.hubLeft<2?`La soirée est finie`:`Rien aujourd'hui`,fx:{hubEnd:true,nav:true}}
    ];
  },ch:[]});

card({id:`shop_chrome`,quick:true,who:`doc`,tag:`🦾 Ripperdoc de passage`,cond:()=>false,
  tx:()=>`« Je ne reste jamais longtemps au même endroit. J'ai ça aujourd'hui. Tu choisis, tu paies, je te le pose ici même. Aucun remboursement. Et gare à ton humanité, gamin(e). »`,
  dyn:()=>{
    const pool=shuffle(CYBER.filter(c=>!hasCy(c.id)&&upCy(c)&&(!c.cred||G.cred>=c.cred)&&c.p<=Math.max(2500,G.ed*3)));
    const aff=pool.find(c=>cyPrice(c)<=G.ed); const rest=pool.filter(c=>c!==aff); const picks=(aff?[aff,...rest]:rest).slice(0,hasDeck()?2:3);
    const out=picks.map(c=>{ const price=cyPrice(c), cur=G.cyber.find(i=>CY(i).slot===c.slot&&i!==c.id);
      return {t:c.n,s:`${money(price)} · −${c.h} Humanité · ${effTxt(c)||c.d}${cur?` · remplace ${CY(cur).n}`:``}`,req:()=>G.ed>=price?``:`${money(price)} requis`,
        fx:{ed:-price,humx:-c.h,cy:c.id,msg:`Une piqûre, un grésillement, une odeur de métal chaud. ${c.d}`}}; });
    if(hasDeck()){ const hs=shuffle(HACKS.filter(h=>!G.hacks.includes(h.id)&&A(`int`)>=h.int&&G.hacks.length<deckSlots())).slice(0,1);
      hs.forEach(h=>out.push({t:`Quickhack : ${h.n}`,s:`${money(h.p)} · ${h.d}`,req:()=>G.ed>=h.p?``:`${money(h.p)} requis`,fx:{ed:-h.p,hack:h.id,msg:`Un transfert silencieux. ${h.n} est chargé.`}})); }
    out.push(NOPE(`Refuser et repartir`,`« Comme tu voudras. Reviens quand tu auras de quoi. »`)); return out;
  },ch:[]});

card({id:`shop_gear`,quick:true,who:`fix`,tag:`🔫 Marché noir`,cond:()=>false,
  tx:()=>`Un vendeur ambulant ouvre sa valise sous un néon qui grésille : « Armes, armures, bagnoles. Tout est volé, rien n'est tracé. Les prix ? Non négociables. »`,
  dyn:()=>{
    const pool=shuffle(GEAR.filter(g=>!g.loot&&!G.gear.includes(g.id)&&upGear(g)&&(!g.cred||G.cred>=g.cred)&&g.p<=Math.max(2500,G.ed*3)));
    const aff=pool.find(g=>gearPrice(g)<=G.ed); const ordered=aff?[aff,...pool.filter(g=>g!==aff)]:pool;
    const seen=new Set(), picks=[]; ordered.forEach(g=>{ if(picks.length<3&&!seen.has(g.t)){ seen.add(g.t); picks.push(g); } });
    const out=picks.map(g=>{ const price=gearPrice(g), cur=G.gear.find(i=>GEARMAP[i].t===g.t);
      return {t:g.n,s:`${money(price)} · ${g.t} · ${effTxt(g)||g.d}${cur?` · remplace ${GEARMAP[cur].n}`:``}`,req:()=>G.ed>=price?``:`${money(price)} requis`,fx:{ed:-price,gear:g.id,msg:g.d}}; });
    out.push(NOPE()); return out;
  },ch:[]});

card({id:`gig_board`,quick:true,who:`@fixer`,tag:`💼 Contrats`,cond:()=>false,
  tx:()=>`« Trois contrats ce soir. Certains paient bien, d'autres te mettent en terre.${G.hp<60?` Et blessé(e) comme tu es… réfléchis.`:``} »`,
  dyn:()=>{
    const cs=[],used=new Set();
    while(cs.length<3){ const g=GIGS[rnd(0,Math.min(GIGS.length-1,Math.floor(2+G.cred/12)+2))]; if(!used.has(g.n)){used.add(g.n);cs.push(g);} }
    const out=cs.map(g=>{ const pay=gigPay(g), cr=gigCr(g), tier=pay>=4000?3:pay>=1800?2:1;
      return {t:g.n,s:`${money(pay)} · +${cr} Cred · échec : −${g.dm} Santé`,chk:{a:g.a,k:g.k,dc:g.dc,
        ok:{ed:pay,cred:cr,loot:tier,msg:`Contrat rempli. Le fixer te paie sans un mot.`},
        ko:{hp:-g.dm,ed:Math.round(pay*.1),hum:g.dm>=18?-4:0,msg:`Le contrat tourne mal. Tu t'en sors, mais pas indemne.`}}}; });
    out.push(NOPE(`Refuser tous les contrats`,`« Pas de travail pour toi, alors. »`)); return out;
  },ch:[]});

card({id:`rest_card`,quick:true,who:`narr`,tag:`🛏 Repos`,cond:()=>false,
  tx:()=>`Une banquette au fond de l'Afterlife, un ripperdoc qui dort au comptoir, une odeur de nouilles froides. Ton corps te lâche presque. Tu peux t'offrir un vrai soin, ou simplement fermer les yeux.`,
  dyn:()=>{
    const fk=G.member?FAC[G.member].k:``;
    const cl=fk===`trauma`?0:Math.round(200*infl()), th=Math.round(600*infl()*(fk===`mox`?.5:1)), tt=Math.round(1200*infl());
    const heal=Math.round(35*Math.max(.5,1-Math.max(0,G.age-30)*0.012));

  [`Une dette de famille`,`Un créancier frappe à ta porte le jour de tes 18 ans : ton père — ou quelqu'un qui portait son nom — a laissé une ardoise. Elle est à toi maintenant.`,[[`Assumer la dette`,`−400 €$ · +Humanité`,{ed:-400,hum:6,cred:2}],[`Nier et claquer la porte`,`Les gangs s'en souviendront`,{bloc:{rue:-12},cred:3}]]],
  [`Un héritage inattendu`,`Une vieille voisine que tu aidais est morte. Elle t'a laissé une boîte en fer : des eddies, et une adresse griffonnée.`,[[`Garder l'argent`,`+900 €$`,{ed:900}],[`Suivre l'adresse`,`Un contact à l'Afterlife`,{rel:{rogue:14},cred:3}]]],
  [`Une vieille blessure`,`Un accident d'enfance t'a laissé une épaule mal réparée. Un ripperdoc te propose de la remplacer à crédit.`,[[`Accepter l'implant`,`Squelette en titane · −Humanité · dette`,{cy:`titanium`,humx:-6,ed:-500}],[`Garder ta chair`,`+Humanité`,{hum:5,xp:{body:3}}]]],
  [`Un casier déjà rempli`,`À 16 ans, tu as pris pour quelqu'un d'autre. La NCPD a ta photo, tes empreintes, et beaucoup de mémoire.`,[[`Faire profil bas`,`La police te surveille`,{bloc:{loi:-18},cred:4}],[`Payer pour effacer le dossier`,`−600 €$`,{ed:-600}]]],
  [`Un don`,`Depuis toujours, il y a une chose que tu fais mieux que les autres, sans savoir pourquoi.`,[[`Tes mains`,`+XP TECHNIQUE et RÉFLEXES`,{xp:{tech:4,ref:4}}],[`Ta tête`,`+XP INTELLECT et SANG-FROID`,{xp:{int:4,cool:4}}],[`Ton corps`,`+XP CORPS`,{xp:{body:7}}]]],
  [`Un ami d'enfance chez les corpos`,`Vous avez grandi dans le même bloc. Lui a signé chez une corporation. Il te doit un service, et il le sait.`,[[`Lui demander de l'argent`,`+700 €$`,{ed:700}],[`Lui demander un nom`,`Les corpos te voient d'un bon œil`,{bloc:{corpo:10},fac:{militech:8},cred:2}]]],
  [`Une promesse`,`Quelqu'un que tu aimais est mort cette année. Tu lui as promis une chose, au bord du lit.`,[[`De rester humain(e)`,`+Humanité · trait Âme intacte`,{hum:5,fn:`twAme`}],[`De ne jamais rester pauvre`,`+500 €$ · −Humanité`,{ed:500,hum:-4,cred:2}]]],
  [`Un coup de chance`,`Tu trouves un sac dans une épave au bord de la route. Dedans : une arme propre et une liasse.`,[[`Garder l'arme`,`Lexington`,{gear:`lexington`}],[`Vendre le tout`,`+800 €$`,{ed:800}],[`Rendre le sac à son propriétaire`,`Un fixer te remarque`,{rel:{dex:14},cred:4,hum:4}]]],
  [`Un mauvais départ`,`Ta première combine a mal tourné. Tu as perdu ce que tu avais, et gagné une cicatrice.`,[[`Recommencer plus prudemment`,`−150 €$ · +XP SANG-FROID`,{ed:-150,xp:{cool:5}}],[`Te venger`,`Les gangs te remarquent`,{bloc:{rue:-10},cred:5,hp:-10}]]],
  [`Un mentor de passage`,`Un vieux solo te prend sous son aile pendant un hiver, avant de disparaître sans un mot.`,[[`Apprendre à te battre`,`+XP CORPS et RÉFLEXES`,{xp:{body:4,ref:4}}],[`Apprendre à survivre`,`Trait Instinct de survie`,{fn:`twSurvie`}]]],
];
card({id:`life_twist`,who:`narr`,tag:`Coup du sort`,cond:()=>false,
  tx:()=>{ const i=rnd(0,TWISTS.length-1); G.tmp={tw:i}; return `<strong>${TWISTS[i][0]}.</strong> ${TWISTS[i][1]}`; },
  dyn:()=>TWISTS[(G.tmp&&G.tmp.tw)||0][2].map(c=>({t:c[0],s:c[1],fx:c[2]})),ch:[]});

/* ---------- Missions secondaires générées ---------- */
const SM_GOALS = [`récupérer une mallette volée`,`faire sortir un témoin de la ville`,`saboter une livraison`,`retrouver une personne disparue`,`protéger un commerce contre un racket`,`voler un prototype`,`effacer un dossier compromettant`,`escorter un médecin de rue`,`porter un message à un chef de gang`,`faire taire un maître chanteur`,`reprendre un implant impayé`,`photographier une rencontre secrète`,`ramener un gamin fugueur`,`détruire une cargaison de drogue coupée`,`retrouver le tueur d'un ami`,`voler une voiture de collection`];
const SM_TWISTS = [`Le client ment sur un point.`,`Un autre merc est déjà sur le coup.`,`La NCPD surveille le secteur.`,`La cible est quelqu'un que tu connais de vue.`,`Tout doit être réglé avant l'aube.`,`Le paiement dépend de ta discrétion.`,`Des Scavs rôdent dans le coin.`,`La cible est sous protection corpo.`,`Il pleut des cordes et les rues sont vides.`,`Le client a peur et ne dit pas de quoi.`,`Un gang local réclame sa part.`,`L'adresse donnée n'existe pas.`];
const SM_WAYS = [
  {t:`Passer en force`,a:`body`,k:`cmb`,ko:22},{t:`Régler ça au flingue`,a:`ref`,k:`cmb`,ko:22},{t:`T'infiltrer sans bruit`,a:`ref`,k:`stl`,ko:14},
  {t:`Baratiner ton chemin`,a:`cool`,ko:10},{t:`Pirater les accès`,a:`int`,k:`hck`,ko:12},{t:`Bricoler une solution`,a:`tech`,ko:12},
  {t:`Observer, puis frapper au bon moment`,a:`int`,ko:12},{t:`Tout miser sur le volant`,a:`ref`,k:`drv`,ko:18}
];
const SM_OK = [`Propre, rapide. Le client paie sans discuter.`,`Ça s'est joué à une seconde près, mais c'est fait.`,`Personne ne saura jamais comment tu t'y es pris(e).`,`Le client te regarde autrement. Ton nom va circuler.`];
const SM_KO = [`Tout part de travers. Tu sauves ta peau, pas la mission.`,`Quelqu'un t'attendait. Tu repars les mains vides.`,`Un détail t'a échappé, et il a coûté cher.`];
card({id:`sm`,who:`fix`,tag:`Mission secondaire`,w:45,cond:()=>!G.flags.q_active,
  tx:()=>{ const d=DIST.filter(x=>!x.lock||G.flags.dogtown), dd=d[rnd(0,d.length-1)];
    G.tmp={g:rnd(0,SM_GOALS.length-1),tw:rnd(0,SM_TWISTS.length-1),d:dd.n};
    return `« J'ai besoin de quelqu'un pour <strong>${SM_GOALS[G.tmp.g]}</strong>, du côté de <em>${dd.n}</em>. » ${SM_TWISTS[G.tmp.tw]}`; },
  dyn:()=>{ const tier=G.cred>=60?3:G.cred>=30?2:G.cred>=10?1:0;
    const pay=Math.round((520+G.cred*34)*(0.8+Math.random()*0.6)*bm().gig/50)*50;
    const ways=shuffle(SM_WAYS).slice(0,3);
    const out=ways.map(w=>{ const dc=6+tier+rnd(0,1); const heat=w.k===`cmb`?{loi:-3}:w.k===`hck`?{corpo:-2}:null;
      return {t:w.t,s:`${ATTRS[w.a].n}${w.k?` · ${{cmb:`combat`,stl:`furtivité`,hck:`hack`,drv:`conduite`}[w.k]}`:``} · ${money(pay)}`,chk:{a:w.a,k:w.k,dc,
        ok:{ed:pay,cred:2+tier,fn:`sideDone`,loot:pay>=1800?(pay>=3200?2:1):0,msg:pickR(SM_OK)},
        ko:Object.assign({hp:-(w.ko+tier*3),cred:-1,msg:pickR(SM_KO)},heat?{bloc:heat}:{})}}; });
    if(Math.random()<.35) out.push({t:`Prévenir la cible`,s:`+Humanité · tu trahis le client`,fx:{hum:7,cred:-2,ed:Math.round(pay*.25/50)*50,msg:`Tu choisis ton camp. La cible te glisse quelques billets et disparaît. Le client, lui, s'en souviendra.`}});
    out.push({t:`Refuser`,s:`Pas ton genre de boulot`,fx:{msg:`« Dommage. Je trouverai quelqu'un de moins regardant. »`}});
    return out; },ch:[]});

card({id:`meet_dakota`,who:`dakota`,tag:`Rencontre · Dakota Smith`,once:true,w:6,cond:()=>rel(`dakota`)<5&&(G.origin===`nomad`||G.cred>=10),
  tx:`Un garage perdu au bord de la route, à la lisière des Badlands. Une femme aux mains tachées d'huile te détaille sans se presser : « Dakota Smith. Je fixe pour ceux qui roulent. Ici, pas de costards, pas de mensonges. Tu sais tenir un volant ou une clé ? »`,
  ch:[
    {t:`Lui montrer ce que tu vaux au volant`,s:`RÉFLEXES · conduite`,chk:{a:`ref`,k:`drv`,dc:6,ok:{rel:{dakota:14},cred:3,ed:400,msg:`Un tour de piste dans la poussière. Elle hoche la tête : « Tu feras l'affaire. »`},ko:{rel:{dakota:6},hp:-6,msg:`Tu plantes le pick-up dans un fossé. Elle rit. « On apprend. »`}}},
    {t:`L'aider à l'atelier`,s:`TECHNIQUE`,chk:{a:`tech`,dc:6,ok:{rel:{dakota:14},xp:{tech:3},msg:`Vous remontez un moteur en silence. C'est sa façon de faire connaissance.`},ko:{rel:{dakota:5},msg:`Tu perds une vis. Elle soupire, mais te garde.`}}}
  ]});
card({id:`dakota_job`,who:`dakota`,tag:`Dakota · Convoi clandestin`,once:true,w:7,cond:()=>rel(`dakota`)>=10,
  tx:`Dakota déplie une carte sur un capot brûlant : « Un chargement à faire passer sous le nez de Militech. Les Wraiths rôdent sur la route, et la patrouille frontalière a soif. <strong>3 500 €$</strong>. Les Badlands paient ceux qui arrivent. »`,

    {t:`Maquiller le chargement`,s:`TECHNIQUE`,chk:{a:`tech`,dc:8,ok:{ed:3500,cred:6,rel:{dakota:12},msg:`Faux plancher, faux papiers. La patrouille ne voit que de la ferraille.`},ko:{ed:300,bloc:{loi:-8},msg:`Un douanier trop curieux. Tu abandonnes le camion.`}}},

card({id:`brick_cell`,who:`brickm`,tag:`Maelstrom · Le prisonnier de Totentanz`,once:true,w:6,cond:()=>yr()>=2074&&(G.member===`maelstrom`||(G.fac.maelstrom||0)>=10||G.cred>=30),

card({id:`oda_duel`,who:`oda`,tag:`Arasaka · Sandayu Oda`,once:true,w:5,cond:()=>G.cred>=40&&yr()>=2075,
  tx:`Un homme masqué, lames mantis repliées, t'attend au milieu d'un parking vide : <strong>Sandayu Oda</strong>, garde du corps de Hanako Arasaka. « Ton nom revient trop souvent dans les rapports. Ma maîtresse veut savoir si tu es une menace ou un outil. Montre-moi. »`,

card({id:`mitch_panzer`,who:`mitch`,tag:`Aldecaldos · Mitch Anderson`,once:true,w:5,cond:()=>G.origin===`nomad`||(G.fac.aldecaldos||0)>=10||rel(`panam`)>=15,

const SCN = {

  animals:[`Une salle de sport clandestine à Rancho Coronado. Des Animals, muscles gonflés, te regardent entrer comme du gibier. « Un nouveau ? Viens tester ta force. »`,`Un Animal torse nu soulève une voiture à mains nues pour impressionner la foule. Il te lance : « Tu fais quoi, toi, à part regarder ? »`,`Sasquatch en personne traverse la rue, suivi de sa bande. Il te toise : « T'as de la carrure. Mais pas de cœur. Prouve-moi le contraire. »`],

  wraiths:[`Un nuage de poussière sur la piste : les Wraiths te prennent en chasse, hurlant dans leurs moteurs. Leur chef lève le poing : « Tu roules vite pour un étranger. »`,`Un Wraith te défie à une course sur la route des Badlands. L'enjeu : ta voiture contre sa moto. Les autres hurlent leur approbation.`,`Nash en personne coupe le moteur de sa moto devant toi : « Les Aldecaldos te donnent du pain. Nous, on te donne le choix. »`],

const ENC_ORDER = Object.keys(SCN);
const ARCH = {valentinos:`gang`,maelstrom:`gang`,tygers:`gang`,sixth:`gang`,animals:`gang`,voodoo:`net`,mox:`mox`,aldecaldos:`clan`,wraiths:`clan`,barghest:`corp`,scavs:`scav`,ncpd:`law`,arasaka:`corp`,militech:`corp`,kangtao:`corp`,biotechnica:`corp`};
function pickEnc(){
  const own=locOwner();
  if(G.forceEnc){ G.forceEnc=false; if(SCN[own]) return own; if(own===`neutral`) return pickR([`ncpd`,`arasaka`,`militech`,`kangtao`]); if(own===`player`) return null; }
  const w=ENC_ORDER.map(id=>{ let x=3; const r=G.fac[id]||0; if(r<=-10) x+=Math.min(8,-r/6); if(id===own) x+=5; if(G.member===id) x+=2; if((G.allies||{})[id]) x+=2; if(id===`ncpd`) x+=(G.heat.loi||0)/12; if(FAC[id]&&FAC[id].k===`corp`) x+=(G.heat.corpo||0)/18; return x; });
  let t=w.reduce((a,b)=>a+b,0), r=Math.random()*t; for(let i=0;i<w.length;i++){ r-=w[i]; if(r<=0) return ENC_ORDER[i]; } return ENC_ORDER[0];
}

/* ---------- temps & économie ---------- */
function tick(months){
  const k = months/BASE;
  let inc = 0;
  ownedList().forEach(d=>inc+=d.inc*3*(.4+.6*holdOf(d.id)/100)*(G.mine&&G.mine.type===`gang`?1.2:1));
  if(G.mine&&G.mine.type===`fixers`) inc+=300;
  inc+=crewN()*120;
  inc+=Object.keys(G.allies||{}).length*100;
  if(isLeader()) inc+=300;
  if(G.flags.corpjob) inc+=140*BASE;
  if(G.member){ const kd=FAC[G.member].k; inc+= (kd===`corp`||kd===`ncpd`||kd===`trauma`?110:55)*(G.rank+1)*BASE*.6; }
  inc*=bm().income;
  inc-=crewN()*70+ownedList().length*45;
  const rent = clamp(20+Math.max(0,G.ed)*.003+G.cred*.8,20,150)*infl()*BASE*bm().rent;
  const net = Math.round((inc-rent)*k);
  G.ed += net;
  const reg = G.cyber.reduce((a,i)=>a+(CY(i).regen||0),0);
  if(reg) G.hp=clamp(G.hp+Math.round(reg*k),0,100);
  G.hp = clamp(G.hp+Math.round(5*k*Math.max(.4,1-Math.max(0,G.age-30)*0.02)),0,100);
  if(G.flags.aging){ G.hp=clamp(G.hp-Math.max(1,Math.round(3*k)),0,100); }
  G.t += months;
  G.age = START_AGE + Math.floor(G.t/12);
  if(ownedList().length){ G.cred=clamp(G.cred+ownedList().length*0.3*k|0,0,100); }
  return net;
}

function drawCard(){
  while(G.queue.length){ const c=byId[G.queue.shift()]; if(c) return c; }
  const T=G.t;
  const SK=G.skip||{}, wt=c=>typeof c.w===`function`?c.w():(c.w||5);
  const st = CARDS.filter(c=>c.story && !SK[c.id] && !G.done[c.id] && T>=(c.at[0]-START_YEAR)*12+c.at[1] && (!c.cond||safe(c.cond,false)));

function beep(f,d=.08,type=`square`,v=.035,slide=0){
  if(muted)return;

    o.type=type;o.frequency.setValueAtTime(f,t);

    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

/* ---------- skyline ---------- */
function skyline(){
  let s=`<svg class="skyline" viewBox="0 0 400 160" preserveAspectRatio="none">`;
  let x=0; const cols=[`#ff2a6d`,`#00f0ff`,`#fcee0a`,`#c77dff`];
  while(x<400){
    const w=14+Math.random()*28, h=40+Math.random()*110, c=cols[Math.floor(Math.random()*4)];
    s+=`<rect x="${x}" y="${160-h}" width="${w}" height="${h}" fill="#0c0c1a" stroke="${c}" stroke-opacity=".35"/>`;
    for(let i=0;i<Math.floor(h/14);i++) if(Math.random()>.55) s+=`<rect x="${x+3+Math.random()*(w-8)}" y="${160-h+6+i*13}" width="3" height="4" fill="${c}" opacity=".8"/>`;
    x+=w+2;
  }
  return s+`</svg>`;
}

function burst(x,y,colors,n){
  let cv=$(`#pcv`); if(!cv){ cv=document.createElement(`canvas`); cv.id=`pcv`; cv.style.cssText=`position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:95`; document.body.appendChild(cv); }
  const W=cv.width=innerWidth, H=cv.height=innerHeight, ctx=cv.getContext(`2d`); n=n||60;
  if(x===undefined){ x=W/2; y=H/2; }
  const ps=Array.from({length:n},()=>({x,y,vx:(Math.random()-.5)*10,vy:(Math.random()-.8)*10,r:2+Math.random()*3,c:colors[Math.floor(Math.random()*colors.length)],l:1}));
  let run=true; (function f(){ ctx.clearRect(0,0,W,H); let alive=0; ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.28; p.vx*=.985; p.l-=.016; if(p.l>0){ alive++; ctx.globalAlpha=Math.max(0,p.l); ctx.fillStyle=p.c; ctx.shadowColor=p.c; ctx.shadowBlur=8; ctx.fillRect(p.x,p.y,p.r,p.r*1.6); } }); if(alive&&run) requestAnimationFrame(f); else ctx.clearRect(0,0,W,H); })();
}

  document.querySelectorAll(`[data-rc]`).forEach(b=>b.onclick=ev=>{ev.stopPropagation();doRec([b.dataset.rc])});
  const ra=$(`#rcall`); if(ra) ra.onclick=()=>doRec(elig);
  const rs=$(`#rstr`); if(rs) rs.onclick=()=>{ const p=Math.round(400*infl()); if(G.ed<p){SFX.ko();toast(`${money(p)} requis`);return} G.ed-=p; CHIPS=[]; FN.recruit(); G.mine.power+=0; updateHud(); SFX.ok(); toast(`Une recrue rejoint ${G.mine.name}`); openContacts(); };
}
function openMore(){
  modal(`Plus`,`<div class="tiles">
    <button class="tile" data-m="log"><span class="ti">📓</span><b>Journal</b><small>Historique</small></button>
    <button class="tile" data-m="how"><span class="ti">❓</span><b>Aide</b><small>Comment jouer</small></button>
    <button class="tile" data-m="snd"><span class="ti">${muted?`🔇`:`🔊`}</span><b>Son</b><small>${muted?`OFF`:`ON`}</small></button>
    <button class="tile" data-m="out"><span class="ti">🚪</span><b>Sortir</b><small>Retraite · Dernier run</small></button></div>`);
  document.querySelectorAll(`[data-m]`).forEach(b=>b.onclick=()=>{SFX.tap();({log:openLog,how:showHow,snd:()=>{muted=!muted;store.set(`ncl_mute`,muted);openMore()},out:openExit})[b.dataset.m]()});
}
function openLog(){ modal(`Journal`,G.log.slice(0,40).map(l=>`<div class="log"><b>${l.d}</b>${esc(l.m)}</div>`).join(``)||`<div class="log">Rien à signaler.</div>`); }
function openExit(){
  modal(`Sortir`,`<div class="log">La rue ne rend rien. Choisis comment tu veux partir.</div>
   <button class="btn" data-x="retire"><div style="color:var(--g);font-weight:700">Prendre ta retraite maintenant</div><div style="color:var(--dim)">Fin paisible · bonus de retraite ×1,3 (mais moins d'années au compteur)</div></button>
   <button class="btn" data-x="blaze"><div style="color:var(--m);font-weight:700">Dernier Run — sortir en flammes</div><div style="color:var(--dim)">Bonus si Street Cred ≥ 30. Sinon, personne ne s'en souviendra.</div></button>
   <button class="btn" data-x="menu"><div style="font-weight:700">Sauvegarder & revenir au titre</div></button>`);
  document.querySelectorAll(`[data-x]`).forEach(b=>b.onclick=()=>{
    const x=b.dataset.x; SFX.tap();
    if(x===`menu`){ save(); closeModal(); showTitle(); return; }
    if(!confirm(x===`retire`?`Prendre ta retraite maintenant ?`:`Faire ton Dernier Run ?`)) return;
    closeModal(); endGame(x); showEnd();
  });
}

/* ---------- écran final ---------- */
function showEnd(){
  closeModal(); document.body.classList.remove(`lowhum`);
  const k=G.over, e=ENDS[k], s=G.final;
  const title = legendTitle(k);
  root().innerHTML=`<div class="screen end">
    <div class="mono" style="color:var(--dim);letter-spacing:.3em">${esc(G.name)} · ${G.age} ans · ${yr()}</div>
    <h1 class="hd glitch" data-t="${e.t}" style="color:${k===`retire`||k===`blaze`||k===`quit`||e.good?`var(--y)`:`var(--m)`}">${e.t}</h1>
    <svg class="ecg ${k===`retire`||k===`quit`||e.good?`alive`:`dead`}" viewBox="0 0 400 60" preserveAspectRatio="none"><path d="${k===`retire`||k===`quit`||e.good?`M0 30 H60 l10 -18 l10 36 l10 -18 H150 l10 -18 l10 36 l10 -18 H240 l10 -18 l10 36 l10 -18 H330 l10 -18 l10 36 l10 -18 H400`:`M0 30 H50 l10 -20 l10 40 l10 -20 H120 l10 -14 l10 28 l10 -14 H190 l8 -6 l8 12 l8 -6 H400`}"/></svg>
    <div class="ep">« ${e.e} »</div>
    <div class="hd" style="color:var(--c);letter-spacing:.25em">${title}</div>
    ${G.newBest?`<div class="newbest hd">★ NOUVEAU RECORD ★</div>`:``}
    <div class="score" id="sc">0</div>
    <div class="log" style="max-width:420px;border:0;text-align:center">Dernier acte : ${esc((G.log[0]||{}).m||`—`)}</div>
    <div class="brk">${s.lines.filter(l=>l[1]!==0).map(l=>`<div><span>${esc(l[0])}</span><b>${l[1].toLocaleString(`fr`)}</b></div>`).join(``)}<div><span>Sous-total</span><b>${Math.round(s.base).toLocaleString(`fr`)}</b></div><div><span>Multiplicateur de fin</span><b style="color:var(--y)">×${s.mult}</b></div></div>
    <div class="stack"><button class="btn pri" id="again">Nouvelle vie</button><button class="btn" id="home">Titre</button><button class="btn" id="share">Copier mon score</button></div></div>`;
  let n=0; const tgt=s.total, step=Math.max(1,Math.round(tgt/60)); const iv=setInterval(()=>{ n=Math.min(tgt,n+step); $(`#sc`).textContent=n.toLocaleString(`fr`); if(n>=tgt)clearInterval(iv); },20);
  if(k===`retire`||k===`blaze`||k===`quit`||e.good) SFX.ok(); else { SFX.ko(); flash(`#ff2a6d`); }
  $(`#again`).onclick=()=>{SFX.tap();showCreate()}; $(`#home`).onclick=()=>{SFX.tap();showTitle()};
  $(`#share`).onclick=()=>{ const t=`NIGHT CITY LEGEND — ${G.name} (${roleTitle()}) : ${tgt.toLocaleString(`fr`)} pts · ${e.t} à ${G.age} ans`; try{navigator.clipboard.writeText(t);toast(`Copié !`)}catch(_){toast(t)} };
}
function legendTitle(k){
  const r=roleTitle();
  if(G.cred>=90) return `Légende de Night City · ${r}`;
  if(G.cred>=60) return `${r} respecté(e) · Afterlife te connaît`;
  if(G.cred>=30) return `${r} de renom`;
  if(G.cred>=12) return `${r} local(e)`;
  return `Un nom oublié dans la foule`;
}

/* ---------- init ---------- */
function boot(){
  document.body.insertAdjacentHTML(`beforeend`,`<div id="fx"></div><div id="vig"></div><div id="flash"></div>`);
  showTitle();
}
window.addEventListener(`error`,e=>{ const r=$(`#root`); if(r&&!r.querySelector(`.screen`)) r.innerHTML=`<div style="padding:24px;color:#ff2a6d;font:14px monospace">Erreur : ${esc(e.message||`inconnue`)}<br><br><button onclick="try{localStorage.clear()}catch(e){};location.reload()" style="padding:10px;font:inherit">Réinitialiser et recharger</button></div>`; });
if(document.readyState===`loading`) window.addEventListener(`DOMContentLoaded`,boot); else boot();
if('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
